        // =====================================================================================
        // BUAT LAGU BARU (Suno generate langsung, tanpa upload / cover).
        // State, prompt, dan alur ini sepenuhnya terpisah dari mode Cover. Yang dipakai bersama hanya:
        // API key, library, dan fungsi bantu murni (composeStyle, vocalTagList, parser balasan AI).
        // =====================================================================================
        const KIE_GEN_URL = 'https://api.kie.ai/api/v1/generate';
        const SONG_DURATIONS = [0, 60, 90, 120, 180, 240, 300, 360]; // 0 = otomatis (model yang menentukan)
        const SONG_TAGS = ['[Intro]', '[Verse 1]', '[Pre-Chorus]', '[Chorus]', '[Verse 2]', '[Bridge]', '[Outro]'];
        const SONG_KIND_LABEL = { cover: 'Cover', song: 'Generate Lagu', instrumental: 'Generate Music Instrumental' };

        // Tanya AI (GPT-6 Luna via Kie). Batas waktu per percobaan, maksimal 2 percobaan, bisa dibatalkan lewat signal.
        async function kieAsk(prompt, key, signal, ms) {
            const log = []; let last = null;
            for (let i = 0; i < 2; i++) {
                if (signal && signal.aborted) throw Object.assign(new Error('Dibatalkan'), { cancelled: true });
                const ctrl = new AbortController();
                const onAbort = () => ctrl.abort();
                if (signal) signal.addEventListener('abort', onAbort);
                let timedOut = false;
                const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, ms);
                try {
                    const res = await fetch(KIE_URL, {
                        method: 'POST', signal: ctrl.signal,
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'Authorization': `Bearer ${key}` },
                        body: JSON.stringify({ model: 'gpt-6-luna', stream: false, reasoning: { effort: 'low' }, input: [{ role: 'user', content: [{ type: 'input_text', text: prompt }] }] })
                    });
                    const txt = await res.text();
                    let data = {}; try { data = JSON.parse(txt); } catch (e) {}
                    if (!res.ok || (data.code && Number(data.code) !== 200) || data.error) {
                        const er = new Error((data.error && data.error.message) || data.msg || data.message || txt.slice(0, 200) || `HTTP ${res.status}`);
                        er.status = res.ok ? Number(data.code) || 0 : res.status;
                        throw er;
                    }
                    const out = extractText(data);
                    if (!out) throw new Error('Respons kosong dari AI');
                    return out;
                } catch (e) {
                    if (signal && signal.aborted) throw Object.assign(new Error('Dibatalkan'), { cancelled: true });
                    const isTimeout = e.name === 'AbortError' || timedOut;
                    log.push(`#${i + 1}: ${isTimeout ? 'timeout' : e.message}${e.status ? ` [${e.status}]` : ''}`);
                    last = isTimeout ? new Error('Kie AI tidak merespons (timeout). Coba lagi beberapa saat lagi.') : e;
                    if ([401, 402, 403].includes(e.status)) break; // key/kredit bermasalah: ulang tidak membantu
                } finally {
                    clearTimeout(timer);
                    if (signal) signal.removeEventListener('abort', onAbort);
                }
            }
            throw Object.assign(last || new Error('Gagal menghubungi AI'), { detail: log.join('\n') });
        }

        // Prompt style khusus lagu BARU (Suno membuat melodi & aransemen dari nol)
        function buildSongStylePrompt(style, o) {
            const tags = o.tags || [];
            const vocalRule = o.instrumental
                ? 'VOCAL: this is an INSTRUMENTAL track. Do NOT write any vocal descriptor (no gender, voice, vocals, singing, choir, humming, lyrics). Include the word "instrumental" exactly once.'
                : tags.length
                    ? `VOCAL: the app itself puts these vocal tags at the very start of the final style: "${tags.join(', ')}". Do NOT write any vocal descriptor in your output (no gender, age, range, vocal timbre, "vocals", "voice", duet, choir) and ignore vocal statements in the user description; the chosen vocal wins. Pick genre, mood, instruments and production that suit this voice.`
                    : 'VOCAL: no vocal was chosen. Add exactly ONE clear vocal descriptor right after the genre (for example "warm female vocals") that fits the description and the lyric language.';
            return [
                'You are a Suno prompt specialist. Convert the user description into a Suno STYLE prompt for a brand-new song: Suno will invent the melody, arrangement and sound from scratch.',
                '',
                `USER DESCRIPTION: ${style}`,
                `LYRIC SNIPPET (only to detect language and mood, never copy it): ${String(o.lyrics || '').replace(/\s+/g, ' ').slice(0, 400) || '(empty: follow the language of the description)'}`,
                vocalRule,
                '',
                'HOW SUNO READS THE STYLE FIELD (follow strictly):',
                '- Plain comma-separated descriptors, never sentences. No brackets, no section tags, no lyrics, no artist or song names.',
                '- Order is weight: the earliest descriptors count most. Use this order: genre (+ era or subgenre), energy/tempo, mood, 2-3 key instruments, production texture.',
                '- Total 4-8 descriptors (vocal tags not counted). Above that they start cancelling each other. One main genre, at most one secondary genre.',
                '- Never combine contradictions (calm + aggressive, lo-fi + polished cinematic, whispered + anthemic). If the description contradicts itself, keep the part the user stressed most.',
                '- Specific mood words beat vague ones: "warm, nostalgic, hopeful" instead of "sad" or "dark" alone.',
                '- Include one tempo cue: the BPM number the user gave, otherwise one fitting number (for example "92 BPM") or an energy word.',
                '- Name instruments precisely (acoustic guitar, upright piano, soft strings). Production: one short texture phrase (clean mix, soft reverb, live feel).',
                '- Exclusions ("no X"): only if the user asked, maximum two.',
                '- Keep the user intent. Fill empty slots with consistent choices. Never add elements that contradict the request.',
                '',
                `LENGTH: 120-350 characters, hard maximum ${Math.max(100, STYLE_MAX - tags.join(', ').length - 2)}. Write in English.`,
                'OUTPUT: valid JSON {"style": "..."} only, no other text, no markdown.'
            ].join('\n');
        }

        // Prompt "Lirik Otomatis": menulis lirik BARU dari nol sesuai style
        function buildSongWritePrompt(style, o) {
            const tags = o.tags || [];
            return [
                'You are an award-winning songwriter writing original lyrics that will be sung by Suno AI.',
                '',
                `SONG BRIEF (genre, mood, theme, and any language request): ${style}`,
                tags.length ? `VOICE THAT WILL SING IT: ${tags.join(', ')}` : null,
                'LANGUAGE: write in the language the brief asks for. If the brief names no language, write in Indonesian (Bahasa Indonesia).',
                '',
                'WRITE LIKE THIS:',
                '- Let the genre and mood decide the feel: playful and simple for kids songs, intimate for acoustic ballads, punchy and rhythmic for pop or rock, and so on.',
                '- One clear theme or tiny story. Concrete images (things you can see, hear, touch) instead of abstract statements. Avoid cliches and filler.',
                '- A chorus with a memorable hook that repeats; verses that move the story forward; an optional bridge that shifts the angle.',
                '- Natural rhymes (do not force them). Keep line lengths similar inside a section so the lines are easy to sing.',
                '- Original words only: never quote or imitate an existing song.',
                '',
                'STRUCTURE: put each Suno section label alone on its own line in square brackets, for example [Verse 1], [Pre-Chorus], [Chorus], [Verse 2], [Bridge], [Final Chorus], [Outro]. Choose a structure that fits the style (short songs for children: two verses plus chorus). Blank line between sections.',
                'LENGTH: about 1200-2600 characters in total.',
                '',
                'OUTPUT: the lyrics only, as plain text. No title, no explanation, no markdown, no syllable hyphenation, no stage directions.'
            ].filter(x => x !== null).join('\n');
        }

        // Prompt "Optimasi Lirik": memoles / menyempurnakan lirik yang sudah ada
        function buildSongPolishPrompt(lyrics, style) {
            return [
                'You are a senior lyric editor polishing a song that will be sung by Suno AI.',
                style ? `SONG BRIEF (use only for tone and genre): ${style}` : null,
                '',
                'TASK: polish the lyrics below to professional quality. You may rewrite weak lines freely, but keep the song recognisably the same song.',
                'KEEP: the original language, theme, story, point of view, and section structure. Keep existing section labels; if labels are missing, add sensible Suno labels such as [Verse 1] and [Chorus] each on its own line.',
                'IMPROVE:',
                '- Replace cliches and vague lines with fresh, concrete imagery.',
                '- Make line length and rhythm consistent inside each section so every line is easy to sing.',
                '- Natural rhymes (never forced); fix awkward word order, grammar and spelling.',
                '- Make the chorus hook stronger and more memorable; make every verse move the story forward.',
                '- Cut filler and pointless repetition.',
                'DO NOT: change the language, add syllable hyphens, add comments or explanations, or make the lyrics much longer (maximum 4500 characters).',
                '',
                'OUTPUT: only the polished lyrics, as plain text.',
                '',
                'LYRICS:',
                lyrics
            ].filter(x => x !== null).join('\n');
        }

        // Judul otomatis (Kie mewajibkan judul, maks 80 karakter)
        function deriveSongTitle(kind, lyrics, style) {
            const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
            if (kind === 'vocal') {
                const line = String(lyrics || '').split('\n').map(l => l.replace(/\[[^\]]*\]/g, ' ').replace(/([A-Za-zÀ-ÿ])-(?=[A-Za-zÀ-ÿ])/g, '$1').replace(/[^\p{L}\p{N}\s'’]/gu, ' ').replace(/\s+/g, ' ').trim()).find(l => /[A-Za-zÀ-ɏ]/.test(l));
                if (line) return cap(line.split(' ').slice(0, 6).join(' ')).slice(0, 80);
                return 'Lagu Baru';
            }
            const first = String(style || '').split(',')[0].replace(/[^\p{L}\p{N}\s'’-]/gu, ' ').replace(/\s+/g, ' ').trim();
            const words = first.split(' ').filter(Boolean).slice(0, 4).map(cap).join(' ');
            return (words ? `${words} Instrumental` : 'Instrumental').slice(0, 80);
        }

        function NewSong({ apiKeys, lib, setLib, refreshCredits, refreshCreditsLater, onSongDone }) {
            const [kind, setKind] = useState('vocal'); // 'vocal' | 'instrumental'
            const [style, setStyle] = useState('');
            const [prevStyle, setPrevStyle] = useState(null);
            const [lyrics, setLyrics] = useState('');
            const [lyricsHistory, setLyricsHistory] = useState([]);
            const [vocal, setVocal] = useState({ genders: [], age: '', range: '', traits: [] });
            const [duration, setDuration] = useState(0);
            const [ai, setAi] = useState('');   // '', 'style', 'write', 'polish'
            const [gen, setGen] = useState(false);
            const [msg, setMsg] = useState('');
            const [elapsed, setElapsed] = useState(0);
            const [err, setErr] = useState(null);
            const aiAbort = useRef(null);
            const genAbort = useRef(null);
            const cancelGen = useRef(false);
            const lyricsRef = useRef(null);

            const instrumental = kind === 'instrumental';
            const vocalTags = instrumental ? [] : vocalTagList(vocal);
            const apiGender = vocalTags.length && vocal.genders.length === 1 ? vocal.genders[0] : '';
            const finalStyle = composeStyle(style, vocalTags);
            const busy = !!ai || gen;
            const title = deriveSongTitle(kind, lyrics, style);

            useEffect(() => {
                if (!busy) { setElapsed(0); return; }
                const t0 = Date.now();
                const id = setInterval(() => setElapsed(Math.floor((Date.now() - t0) / 1000)), 1000);
                return () => clearInterval(id);
            }, [busy]);

            const toggleGender = (id) => setVocal(v => {
                const g = v.genders.includes(id) ? v.genders.filter(x => x !== id) : [...v.genders, id];
                return g.length ? { ...v, genders: g, range: '', traits: v.traits.filter(t => !(t === 'falsetto' && g.length === 1 && g[0] === 'f')) } : { genders: [], age: '', range: '', traits: [] };
            });
            const pickAge = (id) => setVocal(v => { const age = v.age === id ? '' : id; const young = ['child', 'teen'].includes(age); return { ...v, age, range: age === 'child' ? '' : v.range, traits: v.traits.filter(t => !(young && V_YOUNG_BLOCK.includes(t))) }; });
            const pickRange = (r) => setVocal(v => ({ ...v, range: v.range === r ? '' : r }));
            const toggleTrait = (id) => setVocal(v => v.traits.includes(id) ? { ...v, traits: v.traits.filter(t => t !== id) } : (traitBlocked(id, v) ? v : { ...v, traits: [...v.traits, id] }));

            const insertTag = (tag) => {
                const el = lyricsRef.current; const pos = el ? el.selectionStart : lyrics.length;
                const before = lyrics.slice(0, pos), after = lyrics.slice(pos);
                const ins = `${before && !before.endsWith('\n') ? '\n' : ''}${tag}\n`;
                setLyricsHistory(h => [...h.slice(-19), lyrics]);
                setLyrics(before + ins + after);
                setTimeout(() => { if (el) { el.focus(); const c = (before + ins).length; el.setSelectionRange(c, c); } }, 0);
            };
            const undoLyrics = () => {
                if (!lyricsHistory.length) return;
                setLyrics(lyricsHistory[lyricsHistory.length - 1]);
                setLyricsHistory(h => h.slice(0, -1));
            };

            // Tiga aksi AI (semuanya opsional): Optimalkan Style, Lirik Otomatis, Optimasi Lirik
            const runAi = async (type) => {
                if (busy) return;
                const key = cleanKey(apiKeys.kie);
                if (!key) return showToast('API Key Kie AI dibutuhkan!', 'error');
                const st = style.trim(), ly = lyrics.trim();
                if ((type === 'style' || type === 'write') && !st) return showToast(type === 'write' ? 'Isi style dulu, lirik dibuat sesuai style.' : 'Isi style dulu.', 'error');
                if (type === 'polish' && !ly) return showToast('Isi lirik dulu untuk dioptimasi.', 'error');
                const ctrl = new AbortController(); aiAbort.current = ctrl;
                setAi(type); setErr(null);
                try {
                    if (type === 'style') {
                        const raw = await kieAsk(buildSongStylePrompt(st, { tags: vocalTags, instrumental, lyrics: instrumental ? '' : lyrics }), key, ctrl.signal, 60000);
                        const out = parseStyleResponse(raw);
                        if (!out) throw new Error('Hasil kosong, coba ulang');
                        setPrevStyle(style); setStyle(out.slice(0, STYLE_MAX));
                    } else {
                        const prompt = type === 'write' ? buildSongWritePrompt(st, { tags: vocalTags }) : buildSongPolishPrompt(ly, st);
                        const raw = await kieAsk(prompt, key, ctrl.signal, 90000);
                        const out = parseLyricsResponse(raw);
                        if (!out) throw new Error('Hasil lirik kosong, coba ulang');
                        setLyricsHistory(h => [...h.slice(-19), lyrics]);
                        setLyrics(out.slice(0, LYRICS_MAX));
                        setTimeout(() => { const el = lyricsRef.current; if (el) el.scrollTop = 0; }, 0);
                    }
                } catch (e) {
                    if (e.cancelled) showToast('Dibatalkan', 'info');
                    else {
                        console.error(e);
                        setErr({ title: type === 'style' ? 'Optimalkan style gagal' : type === 'write' ? 'Lirik otomatis gagal' : 'Optimasi lirik gagal', msg: e.message || 'Gagal menghubungi AI', raw: e.detail || '' });
                        showToast(e.message || 'Gagal menghubungi AI', 'error');
                    }
                } finally {
                    aiAbort.current = null; setAi('');
                    setTimeout(refreshCredits, 3000);
                }
            };
            const cancelAi = () => { if (aiAbort.current) aiAbort.current.abort(); };

            const generate = async () => {
                if (busy) return;
                const key = cleanKey(apiKeys.kie);
                if (!key) return showToast('API Key Kie AI dibutuhkan!', 'error');
                if (!style.trim()) return showToast('Isi style dulu.', 'error');
                if (!instrumental && !lyrics.trim()) return showToast('Isi lirik dulu, atau pilih Instrumental.', 'error');
                if (!instrumental && lyrics.trim().length > LYRICS_MAX) return showToast(`Lirik ${lyrics.trim().length} karakter, melebihi batas ${LYRICS_MAX}.`, 'error');
                const lyr = instrumental ? '' : lyrics.trim();
                const sig = hash36(['song', kind, finalStyle, lyr, apiGender, duration, KIE_SUNO_MODEL].join('\u0001'));
                const dup = lib.covers.find(c => c.sig === sig);
                if (dup && !window.confirm('Style, lirik, dan pengaturan ini sama persis dengan lagu yang sudah ada di Library. Generate ulang tetap memakai kredit. Lanjutkan?')) { onSongDone(kind); return; }

                const ctrl = new AbortController(); genAbort.current = ctrl; cancelGen.current = false;
                const chk = () => { if (cancelGen.current) throw new Error('Dibatalkan'); };
                const auth = { 'Authorization': `Bearer ${key}` };
                let taskId = '';
                setGen(true); setErr(null); setMsg('Mengirim tugas ke Suno (Kie AI)...');
                try {
                    const base = { customMode: true, instrumental, model: KIE_SUNO_MODEL, callBackUrl: cleanKey(apiKeys.callback) || KIE_DEFAULT_CALLBACK, title, style: finalStyle };
                    if (!instrumental) { base.prompt = lyr; base.lyrics = lyr; if (apiGender) base.vocalGender = apiGender; }
                    const submit = async (b) => {
                        const res = await fetch(KIE_GEN_URL, { method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'application/json', ...auth }, body: JSON.stringify(b) });
                        return { res, j: await res.json().catch(() => ({})) };
                    };
                    const okTask = (r) => r.res.ok && Number(r.j.code) === 200 && r.j.data && r.j.data.taskId;
                    let r = await submit(duration ? { ...base, duration } : base);
                    if (!okTask(r) && duration && /duration/i.test(r.j.msg || '')) {
                        showToast('Kie tidak menerima pengaturan durasi, dikirim tanpa durasi (otomatis).', 'info');
                        r = await submit(base);
                    }
                    chk();
                    if (!okTask(r)) throw Object.assign(new Error(`Kie AI menolak tugas: ${r.j.msg || r.j.message || 'HTTP ' + r.res.status} (code ${r.j.code || r.res.status})`), { raw: JSON.stringify(r.j).slice(0, 600) });
                    taskId = r.j.data.taskId;

                    const t0 = Date.now(); let fails = 0, polls = 0, tracks = [];
                    const FAILED = ['CREATE_TASK_FAILED', 'GENERATE_AUDIO_FAILED', 'SENSITIVE_WORD_ERROR'];
                    while (true) {
                        chk();
                        if (Date.now() - t0 > 600000) throw new Error(`Suno terlalu lama (>10 menit). Task ID: ${taskId}`);
                        await new Promise(res => setTimeout(res, 5000)); chk();
                        let info;
                        try {
                            const rr = await fetch(`${KIE_SUNO_INFO}?taskId=${encodeURIComponent(taskId)}`, { headers: auth, signal: ctrl.signal });
                            const d = await rr.json().catch(() => ({}));
                            if (!rr.ok || Number(d.code) !== 200) {
                                if ([401, 402, 403].includes(rr.status) || [401, 402, 403].includes(Number(d.code))) throw Object.assign(new Error(d.msg || 'Akses ditolak'), { fatal: true });
                                throw new Error(d.msg || `HTTP ${rr.status}`);
                            }
                            info = d.data || {}; fails = 0;
                        } catch (e) {
                            if (e.name === 'AbortError' || e.fatal || ++fails > 5) throw e;
                            continue; // gangguan jaringan sesaat: coba lagi
                        }
                        const status = info.status || '';
                        const list = (info.response && (info.response.sunoData || info.response.data)) || [];
                        const labels = { PENDING: 'Menunggu antrean Suno', TEXT_SUCCESS: 'Suno menyusun lagu', FIRST_SUCCESS: 'Track pertama selesai, menunggu sisanya' };
                        setMsg(`${labels[status] || 'Suno sedang membuat lagu'}... (${status || 'PENDING'}) · cek ke-${++polls}${Date.now() - t0 > 150000 ? '\nAntrean Suno padat, ini normal. Tetap dipantau, boleh tekan Batal.' : ''}`);
                        if (status === 'SUCCESS') { tracks = list; break; }
                        if (status === 'CALLBACK_EXCEPTION' && list.some(x => x.audio_url || x.source_audio_url)) { tracks = list; break; }
                        if (FAILED.includes(status) || status === 'CALLBACK_EXCEPTION') {
                            throw Object.assign(new Error(`Suno gagal: ${info.errorMessage || status}`), { raw: `status: ${status}\n${info.errorMessage || ''}` });
                        }
                    }

                    const results = tracks.map((x, i) => ({
                        id: x.id || i, title: x.title || `${title} ${i + 1}`,
                        url: x.audio_url || x.source_audio_url || x.stream_audio_url || '',
                        image: x.image_url || x.source_image_url || '', duration: x.duration
                    })).filter(x => x.url);
                    if (!results.length) throw new Error(`Suno selesai tapi tidak ada audio. Task ID: ${taskId}`);
                    const stamp = Date.now();
                    setLib(l => ({ ...l, covers: [...results.map(x => ({ ...x, id: 's' + stamp + '-' + x.id, kind: instrumental ? 'instrumental' : 'song', source: 'Buat Lagu Baru', style: style.trim(), sig, date: stamp })), ...l.covers] }));
                    showToast(`Lagu selesai! ${results.length} versi dari Suno.`, 'success');
                    onSongDone(kind);
                } catch (e) {
                    console.error(e);
                    if (cancelGen.current || e.name === 'AbortError') showToast('Dibatalkan', 'info');
                    else {
                        const sens = /copyright|existing work|matches|sensitive|lyric|hak cipta/i.test(`${e.message} ${e.raw || ''}`);
                        setErr({ title: sens ? 'Lirik/style ditolak Suno (kata sensitif atau terindikasi hak cipta)' : 'Proses gagal', msg: sens ? 'Ubah atau parafrase lirik dan style, lalu coba lagi.' : (e.message || 'Gagal generate lagu'), raw: e.raw || e.detail || (taskId ? `Task ID: ${taskId}` : '') });
                        showToast(e.message || 'Gagal generate lagu', 'error');
                    }
                } finally {
                    genAbort.current = null; setGen(false);
                    refreshCreditsLater();
                }
            };
            const cancelGenerate = () => { cancelGen.current = true; if (genAbort.current) genAbort.current.abort(); };

            const aiBtn = (type, idleIcon, idleLabel, busyLabel, extra = '') => (
                <button onClick={() => runAi(type)} disabled={busy || (type === 'polish' ? !lyrics.trim() : !style.trim())} className={`flex-1 py-2.5 rounded-lg text-sm font-semibold hover:opacity-90 disabled:opacity-40 ${extra}`}>
                    {ai === type ? <><i className="fa-solid fa-circle-notch fa-spin mr-2"></i>{busyLabel} {elapsed}s</> : <><i className={`fa-solid ${idleIcon} mr-2`}></i>{idleLabel}</>}
                </button>
            );
            const canGenerate = !busy && style.trim() && (instrumental || lyrics.trim());

            return (
                <div className="h-full relative">
                    <div className="h-full overflow-y-auto">
                        <div className="p-6 flex flex-col gap-4 animate-fade-in pb-16">
                            {/* Pilihan Vocal / Instrumental */}
                            <div className="flex p-1 bg-dsp-panel rounded-lg border border-dsp-border">
                                {[{ id: 'vocal', l: 'Vocal', i: 'fa-microphone-lines' }, { id: 'instrumental', l: 'Instrumental', i: 'fa-guitar' }].map(t => (
                                    <button key={t.id} onClick={() => !busy && setKind(t.id)} disabled={busy} className={`flex-1 py-2.5 text-sm font-semibold rounded-md transition-colors ${kind === t.id ? 'bg-dsp-accent text-white' : 'text-dsp-muted hover:text-white'}`}><i className={`fa-solid ${t.i} mr-2`}></i>{t.l}</button>
                                ))}
                            </div>

                            {/* Style */}
                            <div className="bg-dsp-panel border border-dsp-border rounded-xl p-5 flex flex-col gap-3">
                                <div className="flex items-center justify-between">
                                    <h3 className="font-semibold flex items-center gap-2"><i className="fa-solid fa-palette text-dsp-music"></i> Style Lagu</h3>
                                    <span className="text-[10px] font-mono text-dsp-muted">{style.length}/{STYLE_MAX}</span>
                                </div>
                                <p className="text-xs text-dsp-muted leading-relaxed">Tulis lagu ini mau dibuat seperti apa (genre, suasana, instrumen{instrumental ? '' : ', tema'}). Bahasa Indonesia boleh. Tombol Optimalkan bersifat opsional.</p>
                                <textarea value={style} onChange={e => setStyle(e.target.value)} readOnly={ai === 'style'} rows={3} maxLength={STYLE_MAX} placeholder={instrumental ? 'mis. musik santai kafe, piano dan gitar akustik, tempo pelan' : 'mis. lagu anak ceria tentang hujan, akustik, tempo sedang'} className="w-full bg-dsp-bg border border-dsp-border rounded-lg p-3 text-sm text-dsp-text focus:border-dsp-music outline-none resize-y" />
                                <div className="flex items-center gap-3">
                                    {aiBtn('style', 'fa-wand-magic-sparkles', 'Optimalkan Style', 'Mengoptimalkan...', 'bg-dsp-ai text-white')}
                                    {prevStyle !== null && !busy && <button onClick={() => { setStyle(prevStyle); setPrevStyle(null); }} className="text-[11px] font-mono text-dsp-accent">Urungkan</button>}
                                    {ai === 'style' && <button onClick={cancelAi} className="text-[11px] font-mono text-dsp-muted hover:text-white">Batal</button>}
                                </div>
                            </div>

                            {/* Vokal (hanya mode Vocal) */}
                            {!instrumental && (
                                <div className="bg-dsp-panel border border-dsp-border rounded-xl p-5 flex flex-col gap-3">
                                    <div className="text-[11px] font-mono text-dsp-muted">VOKAL (otomatis masuk ke depan style, tanpa AI)</div>
                                    <div>
                                        <div className="text-[11px] text-dsp-muted mb-1.5">Jenis suara. Pilih keduanya untuk duet.</div>
                                        <div className="flex gap-2">{[{ id: 'f', l: 'Wanita' }, { id: 'm', l: 'Pria' }].map(o => <Chip key={o.id} on={vocal.genders.includes(o.id)} onClick={() => toggleGender(o.id)}>{o.l}</Chip>)}</div>
                                    </div>
                                    {vocal.genders.length > 0 && (<>
                                        <div>
                                            <div className="text-[11px] text-dsp-muted mb-1.5">Usia suara</div>
                                            <div className="flex flex-wrap gap-2">{VOCAL_AGES.map(a => <Chip key={a.id} on={vocal.age === a.id} onClick={() => pickAge(a.id)}>{a.l}</Chip>)}</div>
                                        </div>
                                        {vocal.genders.length === 1 && vocal.age !== 'child' && (
                                            <div>
                                                <div className="text-[11px] text-dsp-muted mb-1.5">Rentang suara</div>
                                                <div className="flex flex-wrap gap-2">{VOCAL_RANGES[vocal.genders[0]].map(r => <Chip key={r} on={vocal.range === r} onClick={() => pickRange(r)}>{r}</Chip>)}</div>
                                            </div>
                                        )}
                                        <div>
                                            <div className="text-[11px] text-dsp-muted mb-1.5">Karakter suara (maks 2; yang bertentangan dikunci)</div>
                                            <div className="flex flex-wrap gap-2">{VOCAL_TRAITS.map(t => <Chip key={t.id} on={vocal.traits.includes(t.id)} disabled={traitBlocked(t.id, vocal)} onClick={() => toggleTrait(t.id)}>{t.l}</Chip>)}</div>
                                        </div>
                                    </>)}
                                </div>
                            )}

                            {/* Lirik (hanya mode Vocal) */}
                            {!instrumental && (
                                <div className="bg-dsp-panel border border-dsp-border rounded-xl p-5 flex flex-col gap-3">
                                    <h3 className="font-semibold flex items-center gap-2"><i className="fa-solid fa-pen-nib text-dsp-ai"></i> Lirik</h3>
                                    <p className="text-xs text-dsp-muted leading-relaxed">Ketik atau tempel liriknya, atau minta AI. <b>Lirik Otomatis</b> menulis lirik baru sesuai style. <b>Optimasi Lirik</b> memoles lirik yang sudah ada. Hasilnya langsung masuk ke kolom ini dan bisa diedit. Keduanya opsional.</p>
                                    <div className="flex gap-1.5 overflow-x-auto hide-scroll">{SONG_TAGS.map(t => (<button key={t} onClick={() => insertTag(t)} className="shrink-0 px-2.5 py-1.5 rounded-md border border-dsp-border text-[11px] font-mono text-dsp-muted hover:text-white">{t}</button>))}</div>
                                    <textarea ref={lyricsRef} value={lyrics} onChange={e => setLyrics(e.target.value)} readOnly={ai === 'write' || ai === 'polish'} spellCheck={false} placeholder="Ketik atau tempel lirik di sini. Beri label seperti [Verse 1] dan [Chorus] agar hasil Suno lebih rapi." className="w-full bg-dsp-bg rounded-lg border border-dsp-border p-4 text-sm leading-relaxed text-dsp-text focus:outline-none focus:border-dsp-ai font-mono whitespace-pre-wrap resize-y min-h-[260px]" />
                                    <div className="flex items-center justify-between gap-3 text-[11px] font-mono text-dsp-muted -mt-1">
                                        <span className={lyrics.length > LYRICS_MAX ? 'text-amber-300' : ''}>{lyrics.trim() ? lyrics.trim().split(/\n/).length : 0} baris · {lyrics.length}/{LYRICS_MAX} karakter</span>
                                        <button onClick={undoLyrics} disabled={!lyricsHistory.length || busy} className={!lyricsHistory.length || busy ? 'opacity-40' : 'text-dsp-accent hover:underline'}><i className="fa-solid fa-rotate-left mr-1"></i>Urungkan</button>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        {aiBtn('write', 'fa-feather-pointed', 'Lirik Otomatis', 'Menulis...', 'bg-dsp-ai text-white')}
                                        {aiBtn('polish', 'fa-gem', 'Optimasi Lirik', 'Memoles...', 'border border-dsp-ai text-dsp-ai')}
                                    </div>
                                    {ai === 'write' || ai === 'polish' ? <button onClick={cancelAi} className="self-start text-[11px] font-mono text-dsp-muted hover:text-white">Batal</button> : null}
                                </div>
                            )}

                            {/* Durasi */}
                            <div className="bg-dsp-panel border border-dsp-border rounded-xl p-5 flex flex-col gap-3">
                                <h3 className="font-semibold flex items-center gap-2"><i className="fa-solid fa-clock text-dsp-accent"></i> Durasi</h3>
                                <div className="flex flex-wrap gap-2">{SONG_DURATIONS.map(d => <Chip key={d} on={duration === d} onClick={() => !busy && setDuration(d)}>{d === 0 ? 'Otomatis' : formatTime(d)}</Chip>)}</div>
                                <p className="text-[11px] text-dsp-muted leading-relaxed">Otomatis = Suno yang menentukan panjang lagu. Durasi tetap bersifat permintaan ke Suno (model V6), hasil akhir bisa sedikit berbeda.</p>
                            </div>

                            {/* Ringkasan + Generate */}
                            <div className="bg-dsp-panel border border-dsp-border rounded-xl p-5 flex flex-col gap-3">
                                <div className="p-3 bg-dsp-bg border border-dsp-border rounded-lg flex flex-col gap-1.5 text-[11px] font-mono break-words select-text">
                                    <div className="flex justify-between gap-3"><span className="text-dsp-muted">Jenis</span><span>{instrumental ? 'Instrumental' : 'Vocal'}</span></div>
                                    <div className="flex justify-between gap-3"><span className="text-dsp-muted">Judul otomatis</span><span className="text-right">{title}</span></div>
                                    <div className="flex justify-between gap-3"><span className="text-dsp-muted">Durasi</span><span>{duration === 0 ? 'Otomatis' : formatTime(duration)}</span></div>
                                    <div className="text-dsp-muted pt-1">Style akhir yang dikirim ({finalStyle.length}/{STYLE_MAX})</div>
                                    <div className="text-dsp-text">{finalStyle || '-'}</div>
                                    {vocal.genders.length === 2 && !instrumental && <div className="text-[10px] text-dsp-muted">Duet: parameter vokal Kie hanya m/f, jadi duet diatur lewat tag style.</div>}
                                </div>
                                {err && (
                                    <div className="rounded-lg border border-red-500/30 bg-red-500/10 text-red-300 p-3 text-xs">
                                        <div className="font-semibold mb-1"><i className="fa-solid fa-triangle-exclamation mr-1"></i>{err.title}</div>
                                        <div className="leading-relaxed">{err.msg}</div>
                                        {err.raw && <pre className="mt-2 font-mono text-[10px] opacity-80 whitespace-pre-wrap break-words select-text">{err.raw}</pre>}
                                        <button onClick={() => { try { navigator.clipboard.writeText(`${err.title}\n${err.msg}\n${err.raw || ''}`); showToast('Detail error disalin', 'success'); } catch (e) {} }} className="mt-2 underline">Salin detail error</button>
                                    </div>
                                )}
                                <button onClick={generate} disabled={!canGenerate} className="w-full disabled:opacity-40 disabled:cursor-not-allowed bg-gradient-to-r from-dsp-music to-dsp-accent text-white py-3.5 rounded-xl font-bold shadow-[0_4px_20px_rgba(16,185,129,0.3)]"><i className="fa-solid fa-bolt mr-2"></i>{instrumental ? 'Generate Music Instrumental' : 'Generate Lagu'}</button>
                                {!style.trim() && <p className="text-center text-[11px] font-mono text-amber-300">Isi style dulu sebelum Generate.</p>}
                                {style.trim() && !instrumental && !lyrics.trim() && <p className="text-center text-[11px] font-mono text-amber-300">Isi lirik dulu (ketik, tempel, atau Lirik Otomatis), atau pilih Instrumental.</p>}
                                <p className="text-center text-[10px] text-dsp-muted font-mono">Biasanya 1-3 menit; saat antrean padat bisa lebih lama. Hasil masuk ke Library ({instrumental ? 'Generate Music Instrumental' : 'Generate Lagu'}).</p>
                            </div>
                        </div>
                    </div>

                    {gen && (
                        <div className="absolute inset-0 bg-dsp-bg/90 backdrop-blur-sm z-40 flex flex-col items-center justify-center animate-fade-in px-6 text-center">
                            <i className="fa-solid fa-circle-notch fa-spin text-4xl text-dsp-accent mb-4"></i>
                            <p className="font-mono text-sm text-dsp-text break-words max-w-full whitespace-pre-line">{msg}</p>
                            <p className="font-mono text-xs text-dsp-muted mt-2">Berjalan {elapsed} dtk</p>
                            <button onClick={cancelGenerate} className="mt-6 px-5 py-2.5 rounded-lg border border-dsp-border text-sm font-medium text-dsp-text hover:bg-dsp-panelHover transition-colors">Batal</button>
                        </div>
                    )}
                </div>
            );
        }

        function Chip({ on, disabled, onClick, children }) {
            return <button type="button" disabled={disabled} onClick={onClick} className={`px-3 py-1.5 rounded-full border text-xs font-semibold transition-colors ${on ? 'bg-dsp-music border-dsp-music text-white' : 'border-dsp-border text-dsp-muted hover:text-white'} ${disabled ? 'opacity-30 cursor-not-allowed' : ''}`}>{children}</button>;
        }

        function formatPrecise(secs) {
            const t = Math.round(Math.max(0, secs) * 10);
            const m = Math.floor(t / 600);
            const s = (t % 600) / 10;
            return `${m}:${s < 10 ? '0' : ''}${s.toFixed(1)}`;
        }

        // Studio Layout with reorganized compact sections & solid black theme
        function Studio({ fileName, duration, currentTime, isPlaying, togglePlay, handleRestart, handleSeek, formatTime, vocalState, setIntensity, engine, trim, onTrim, onSeekTime }) {
            return (
                <div className="flex flex-col p-3 gap-3 animate-fade-in">
                    
                    {/* 1. Spectral Monitor */}
                    <div className="glass-card rounded-lg p-3 relative overflow-hidden">
                        <div className="flex justify-between items-center mb-2 px-0.5">
                            <div className="text-[9px] font-mono text-zinc-400 uppercase tracking-wider flex items-center gap-1.5">
                                <i className="fa-solid fa-chart-simple text-white"></i> SPECTRAL ANALYZER
                            </div>
                        </div>
                        <div className="h-24 w-full rounded relative viz-bg glass-inner overflow-hidden">
                            <SpectrumVisualizer engine={engine} isPlaying={isPlaying} />
                        </div>
                    </div>
                    
                    {/* 2. Timeline & Waveform */}
                    <TimelineWaveformCard engine={engine} duration={duration} currentTime={currentTime} isPlaying={isPlaying} togglePlay={togglePlay} handleRestart={handleRestart} handleSeek={handleSeek} trim={trim} onTrim={onTrim} onSeekTime={onSeekTime} formatTime={formatTime} />

                    {/* 3. Cut Audio Now (Compact, placed directly under timeline) */}
                    <CutAudioCard duration={duration} currentTime={currentTime} trim={trim} onTrim={onTrim} />

                    {/* 4. Bypass Filter Slider (Placed under Cut Audio) */}
                    <FilterCard state={vocalState} onIntensity={setIntensity} />

                    {/* 5. Warning / Instruction Text Box (Placed under bypass slider, compact width) */}
                    <div className="glass-card rounded-lg p-2.5 mx-auto w-full max-w-[340px] text-center border-l-2 border-l-white">
                        <p className="text-[10px] font-mono text-zinc-300 uppercase tracking-wider leading-relaxed">
                            <i className="fa-solid fa-circle-info mr-1 text-white"></i> Jika music anda terdeteksi copyright naikan intensitas di atas 50
                        </p>
                    </div>

                </div>
            );
        }

        function SpectrumVisualizer({ engine, isPlaying }) {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const vAnalyser = engine.vocalAnalyser;
                const bufferLength = vAnalyser.frequencyBinCount;
                const vData = new Uint8Array(bufferLength);
                let req;
                const drawCurve = (dataArray, color, fillStyle) => {
                    ctx.beginPath();
                    ctx.moveTo(0, canvas.height);
                    const sliceWidth = canvas.width * 1.0 / (bufferLength / 1.5); 
                    let x = 0;
                    for(let i = 0; i < bufferLength; i++) {
                        const v = dataArray[i] / 255.0;
                        const y = canvas.height - (v * canvas.height * 0.9);
                        if(i === 0) ctx.lineTo(x, y);
                        else {
                            const prevV = dataArray[i-1] / 255.0;
                            const prevY = canvas.height - (prevV * canvas.height * 0.9);
                            const xc = (x - sliceWidth + x) / 2;
                            const yc = (prevY + y) / 2;
                            ctx.quadraticCurveTo(x - sliceWidth, prevY, xc, yc);
                        }
                        x += sliceWidth;
                    }
                    ctx.lineTo(canvas.width, canvas.height);
                    ctx.lineTo(0, canvas.height);
                    ctx.fillStyle = fillStyle;
                    ctx.fill();
                    ctx.lineWidth = 1.2;
                    ctx.strokeStyle = color;
                    ctx.stroke();
                };
                const render = () => {
                    req = requestAnimationFrame(render);
                    vAnalyser.getByteFrequencyData(vData);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    const vGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    vGrad.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
                    vGrad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
                    drawCurve(vData, '#ffffff', vGrad);
                };
                render();
                return () => cancelAnimationFrame(req);
            }, [engine]);
            return <canvas ref={canvasRef} width="400" height="96" className="w-full h-full absolute inset-0"></canvas>;
        }

        function TimelineWaveformCard({ engine, duration, currentTime, isPlaying, togglePlay, handleRestart, handleSeek, trim, onTrim, onSeekTime, formatTime }) {
            const d = duration || 0;
            const minGap = Math.min(MIN_CUT, d);
            const trackRef = useRef(null);
            const canvasRef = useRef(null);
            const dragRef = useRef(null);
            const [peaks, setPeaks] = useState(null);

            useEffect(() => { setPeaks(engine.getPeaks(500)); }, [engine, duration]);

            useEffect(() => {
                const c = canvasRef.current;
                if (!c || !peaks) return;
                const g = c.getContext('2d');
                const W = c.width, H = c.height;
                g.clearRect(0, 0, W, H);
                g.fillStyle = '#ffffff';
                const bw = W / peaks.length;
                for (let b = 0; b < peaks.length; b++) {
                    const h = Math.max(1, Math.pow(peaks[b], 0.7) * H * 0.85);
                    g.fillRect(b * bw, (H - h) / 2, Math.max(1, bw - 0.4), h);
                }
            }, [peaks]);

            const startPct = d > 0 ? (trim.start / d) * 100 : 0;
            const endPct = d > 0 ? (trim.end / d) * 100 : 100;
            const playPct = d > 0 ? Math.min(100, Math.max(0, (currentTime / d) * 100)) : 0;

            const stepSizes = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600];
            const tickStep = stepSizes.find(s => d / s <= 6) || 600;
            const ticks = [];
            if (d > 0) for (let t = 0; t <= d + 0.001; t += tickStep) ticks.push(t);
            const fmtTick = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

            const timeFromX = (clientX) => {
                const r = trackRef.current.getBoundingClientRect();
                const p = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
                return p * d;
            };
            const handleDown = (which) => (e) => {
                e.preventDefault();
                try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
                dragRef.current = which;
            };
            const handleMove = (which) => (e) => {
                if (dragRef.current !== which) return;
                const t = timeFromX(e.clientX);
                if (which === 'start') onTrim(Math.min(t, trim.end - minGap), trim.end);
                else onTrim(trim.start, Math.max(t, trim.start + minGap));
            };
            const handleUp = (e) => {
                dragRef.current = null;
                try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {}
            };
            const handleTap = (e) => {
                const t = timeFromX(e.clientX);
                onSeekTime(Math.min(Math.max(t, trim.start), Math.max(trim.start, trim.end - 0.05)));
            };

            return (
                <div className="glass-card rounded-lg p-3 flex flex-col gap-3">
                    <div className="flex justify-between items-center">
                        <div className="flex items-center gap-1.5">
                            <i className="fa-solid fa-timeline text-white text-xs"></i>
                            <span className="font-mono font-semibold text-[10px] tracking-widest text-white uppercase">TIMELINE WORKSPACE</span>
                        </div>
                        <div className="flex gap-2 items-center">
                             <button onClick={handleRestart} className="w-6 h-6 rounded border border-white/20 bg-white/5 flex items-center justify-center text-zinc-400 hover:text-white transition-all">
                                <i className="fa-solid fa-backward-step text-[10px]"></i>
                            </button>
                            <button onClick={togglePlay} className="w-7 h-7 rounded bg-white text-black flex items-center justify-center active:scale-95 shrink-0 hover:bg-zinc-200">
                                <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play ml-0.5'} text-[10px]`}></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <div className="relative h-4 mb-0.5 opacity-60">
                            {ticks.map(t => (
                                <div key={t} className="absolute top-0 flex flex-col items-center" style={{ left: `${(t / d) * 100}%`, transform: 'translateX(-50%)' }}>
                                    <span className="text-[8px] font-mono text-zinc-400 leading-none">{fmtTick(t)}</span>
                                    <span className="block w-[1px] h-1 bg-zinc-600 mt-0.5"></span>
                                </div>
                            ))}
                        </div>

                        <div ref={trackRef} className="relative h-16 select-none glass-inner rounded overflow-hidden">
                            <div className="absolute inset-0 cursor-pointer" onClick={handleTap}>
                                {ticks.map(t => (
                                    <div key={t} className="absolute inset-y-0 w-px bg-white/5 pointer-events-none" style={{ left: `${(t / d) * 100}%` }}></div>
                                ))}
                                <canvas ref={canvasRef} width="500" height="64" className="absolute inset-0 w-full h-full pointer-events-none opacity-90"></canvas>
                                <div className="absolute inset-y-0 left-0 bg-black/75 pointer-events-none" style={{ width: `${startPct}%` }}></div>
                                <div className="absolute inset-y-0 right-0 bg-black/75 pointer-events-none" style={{ width: `${100 - endPct}%` }}></div>
                                <div className="absolute inset-y-0 w-px bg-white pointer-events-none z-20 shadow-[0_0_6px_#fff]" style={{ left: `${playPct}%`, transform: 'translateX(-50%)' }}></div>
                            </div>

                            <div className="absolute inset-y-0 border-y border-white/40 pointer-events-none" style={{ left: `${startPct}%`, width: `${Math.max(0, endPct - startPct)}%` }}></div>

                            <div
                                className="absolute inset-y-0 w-4 flex justify-end cursor-ew-resize z-10"
                                style={{ left: `${startPct}%`, transform: 'translateX(-100%)', touchAction: 'none' }}
                                onPointerDown={handleDown('start')} onPointerMove={handleMove('start')} onPointerUp={handleUp} onPointerCancel={handleUp}
                            >
                                <div className="w-2.5 h-full bg-white/20 border-r border-white/40 rounded-l"></div>
                            </div>
                            
                            <div
                                className="absolute inset-y-0 w-4 flex justify-start cursor-ew-resize z-10"
                                style={{ left: `${endPct}%`, touchAction: 'none' }}
                                onPointerDown={handleDown('end')} onPointerMove={handleMove('end')} onPointerUp={handleUp} onPointerCancel={handleUp}
                            >
                                <div className="w-2.5 h-full bg-white/20 border-l border-white/40 rounded-r"></div>
                            </div>
                        </div>

                        <div className="mt-2 relative h-3">
                            <input type="range" min="0" max="100" step="0.1" value={playPct || 0} onChange={handleSeek} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                            <div className="absolute left-0 right-0 top-1/2 -translate-y-1/2 h-[2px] bg-zinc-800 rounded-full overflow-hidden">
                                <div className="absolute top-0 h-full bg-white/20" style={{ left: `${(trim.start/d)*100}%`, width: `${((trim.end-trim.start)/d)*100}%` }}></div>
                                <div className="absolute top-0 left-0 h-full bg-white" style={{ width: `${playPct}%` }}></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Compact Cut Audio Card
        function CutAudioCard({ duration, currentTime, trim, onTrim }) {
            const d = duration || 0;
            const minGap = Math.min(MIN_CUT, d);
            const len = trim.end - trim.start;
            const isCut = trim.start > 0.001 || trim.end < d - 0.001;

            return (
                <div className="glass-card rounded-lg p-2.5 flex flex-col gap-2">
                    <div className="flex items-center justify-between px-0.5">
                        <div className="flex items-center gap-1.5">
                            <i className="fa-solid fa-scissors text-white text-[10px]"></i>
                            <span className="font-mono font-semibold text-[10px] tracking-widest text-white uppercase">CUT AUDIO NOW</span>
                        </div>
                        <span className="text-[9px] font-mono text-zinc-400">LEN: <span className="text-white font-bold">{formatPrecise(len)}</span></span>
                    </div>

                    <div className="grid grid-cols-3 gap-1.5 text-center">
                        <button onClick={() => onTrim(Math.min(currentTime, trim.end - minGap), trim.end)}
                                className="glass-btn py-1.5 text-[9px] font-mono tracking-wider rounded uppercase text-zinc-300 hover:text-white">
                            SET IN <span className="text-[8px] opacity-70 block">{formatPrecise(trim.start)}</span>
                        </button>
                        <button onClick={() => onTrim(trim.start, Math.max(currentTime, trim.start + minGap))}
                                className="glass-btn py-1.5 text-[9px] font-mono tracking-wider rounded uppercase text-zinc-300 hover:text-white">
                            SET OUT <span className="text-[8px] opacity-70 block">{formatPrecise(trim.end)}</span>
                        </button>
                        <button onClick={() => onTrim(0, d)} disabled={!isCut}
                                className={`glass-btn py-1.5 text-[9px] font-mono tracking-wider rounded uppercase ${isCut ? 'text-white' : 'opacity-30 text-zinc-600'}`}>
                            RESET <span className="text-[8px] opacity-70 block">FULL</span>
                        </button>
                    </div>
                </div>
            );
        }

        // Filter Card (Bypass Slider)
        function FilterCard({ state, onIntensity }) {
            const pct = Math.round(state.intensity * 100);

            return (
                <div className="glass-card rounded-lg p-3 flex flex-col gap-2.5">
                    <div className="flex justify-between items-center px-0.5">
                        <div className="flex items-center gap-1.5">
                            <i className="fa-solid fa-sliders text-white text-xs"></i>
                            <span className="font-mono font-semibold text-[10px] tracking-widest text-white uppercase">AUDIO FILTER BYPASS</span>
                        </div>
                        <span className="text-[10px] font-mono font-bold text-white">{pct}%</span>
                    </div>

                    <div className="flex items-center gap-3 bg-black/40 p-2 rounded border border-white/5">
                        <i className="fa-solid fa-bolt text-[10px] text-white opacity-80"></i>
                        <div className="flex-1 relative flex items-center h-4">
                            <input type="range" min="0" max="1" step="0.01" value={state.intensity} onChange={(e) => onIntensity(parseFloat(e.target.value))} className="relative z-10 w-full" />
                            <div className="absolute left-0 h-[3px] pointer-events-none rounded-full bg-white" style={{ width: `${pct}%`, top: '50%', transform: 'translateY(-50%)' }}></div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
