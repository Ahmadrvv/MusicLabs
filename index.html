        const { useState, useEffect, useRef, useCallback } = React;

        // --- Kie AI (GPT-6 Luna, format OpenAI Responses) ---
        const KIE_URL = 'https://api.kie.ai/codex/v1/responses'; 
        const KIE_TIMEOUT_MS = 180000; 
        const KIE_ATTEMPTS = [

        // --- Kie AI (Suno: Upload & Cover) ---
        const KIE_SUNO_URL = 'https://api.kie.ai/api/v1/generate/upload-cover';
        const KIE_SUNO_INFO = 'https://api.kie.ai/api/v1/generate/record-info';

        const KIE_DEFAULT_CALLBACK = 'https://example.com/callback';

            { kind: 'stream', url: 'https://kieai.redpandaai.co/api/file-stream-upload' },
            { kind: 'base64', url: 'https://kieai.redpandaai.co/api/file-base64-upload' },

        // REBRAND: Changed Suno stages to generic AI stages for UI display

        const idb = (mode, fn) => new Promise((res, rej) => {
            try {
                const r = indexedDB.open('kie_cover_studio', 1);
                r.onupgradeneeded = () => r.result.createObjectStore('audio');
                r.onerror = () => rej(r.error);
                r.onsuccess = () => { const tx = r.result.transaction('audio', mode); const q = fn(tx.objectStore('audio')); tx.oncomplete = () => res(q ? q.result : undefined); tx.onerror = () => rej(tx.error); };
            } catch (e) { rej(e); }
        });
        const idbPut = (id, blob) => idb('readwrite', st => st.put(blob, id));

        const idbDel = (id) => idb('readwrite', st => st.delete(id));

        const cleanKey = (k) => String(k || '').replace(/^\s*Bearer\s+/i, '').replace(/\s+/g, '');

        const fetchWithTimeout = async (url, opts = {}, ms = 15000) => {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), ms);
            try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
            finally { clearTimeout(timer); }
        };

        function extractText(data) {
            if (!data) return '';
            if (Array.isArray(data.output)) {
                const t = data.output.filter(o => o && o.type !== 'reasoning').flatMap(o => Array.isArray(o.content) ? o.content : []).filter(c => c && typeof c.text === 'string' && !/reasoning/.test(c.type || '')).map(c => c.text).join('');
                if (t) return t;
            }
            if (typeof data.output_text === 'string') return data.output_text;
            if (Array.isArray(data.content)) return data.content.filter(b => b && b.type === 'text').map(b => b.text).join('');
            if (typeof data.content === 'string') return data.content;
            const c = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
            if (typeof c === 'string') return c;
            if (data.data && typeof data.data === 'object') return extractText(data.data);
            return '';
        }

        async function kieChat(prompt, key, { timeout = KIE_TIMEOUT_MS, signal, onTry } = {}) {
            const log = [], RETRY = [429, 502, 503, 504];
            for (let i = 0; i < 2; i++) {
                if (signal && signal.aborted) throw Object.assign(new Error('Dibatalkan'), { cancelled: true });
                const ctrl = new AbortController(), onAbort = () => ctrl.abort();
                if (signal) signal.addEventListener('abort', onAbort);
                let timedOut = false; const t0 = Date.now();
                const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, timeout);
                try {
                    if (onTry) onTry(i + 1);
                    const res = await fetch(KIE_URL, {
                        method: 'POST', signal: ctrl.signal,
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'Authorization': `Bearer ${key}` },
                        body: JSON.stringify({ model: 'gpt-6-luna', stream: false, reasoning: { effort: 'low' }, input: [{ role: 'user', content: [{ type: 'input_text', text: prompt }] }] })
                    });
                    const txt = await res.text();
                    const head = `HTTP ${res.status} | ${((Date.now() - t0) / 1000).toFixed(1)} dtk | ${txt.slice(0, 300).replace(/\s+/g, ' ')}`;
                    let data = {}; try { data = JSON.parse(txt); } catch (e) {}
                    const code = Number(data.code) || 0;
                    if (!res.ok || (code && code !== 200) || data.error) {
                        const er = new Error((data.error && data.error.message) || data.msg || data.message || txt.slice(0, 200) || `HTTP ${res.status}`);
                        er.status = res.ok ? code : res.status; er.raw = head; throw er;
                    }
                    const inc = data.status === 'incomplete' || (data.data && data.data.status === 'incomplete');
                    const out = extractText(data);
                    if (inc) throw Object.assign(new Error('Balasan AI terpotong (jatah token habis). Persingkat input lalu coba lagi.'), { raw: head });
                    if (!out) throw Object.assign(new Error('Respons kosong dari AI'), { raw: head });
                    return out;
                } catch (e) {
                    if (signal && signal.aborted) throw Object.assign(new Error('Dibatalkan'), { cancelled: true });
                    const isTimeout = e.name === 'AbortError' || timedOut;
                    log.push(`#${i + 1}: ${isTimeout ? `timeout setelah ${Math.round(timeout / 1000)} dtk` : e.message}${e.status ? ` [${e.status}]` : ''}${e.raw ? ` | ${e.raw}` : ''}`);
                    if (isTimeout || !RETRY.includes(e.status) || i === 1) {
                        throw Object.assign(isTimeout ? new Error('Sistem AI tidak merespons (timeout).') : e, { detail: log.join('\n') });
                    }
                    await new Promise(r => setTimeout(r, 4000));
                } finally {
                    clearTimeout(timer);
                    if (signal) signal.removeEventListener('abort', onAbort);
                }
            }
        }

        const fetchT = async (url, opts = {}, ms = 60000) => {
            const outer = opts.signal, ctrl = new AbortController(), onAbort = () => ctrl.abort();
            if (outer) { if (outer.aborted) ctrl.abort(); else outer.addEventListener('abort', onAbort); }
            let timedOut = false;
            const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, ms);
            try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
            catch (e) { if (timedOut && !(outer && outer.aborted)) throw new Error(`Koneksi tidak merespons dalam ${Math.round(ms / 1000)} detik`); throw e; }
            finally { clearTimeout(timer); if (outer) outer.removeEventListener('abort', onAbort); }
        };

        const PEND_KEY = 'kie_pending_v1';
        const pendGet = () => { try { return JSON.parse(localStorage.getItem(PEND_KEY)) || []; } catch (e) { return []; } };
        const pendSet = (a) => { try { localStorage.setItem(PEND_KEY, JSON.stringify(a.slice(0, 10))); } catch (e) {} window.dispatchEvent(new Event('kie-pending')); };
        const pendAdd = (taskId, label) => pendSet([{ taskId, label, date: Date.now() }, ...pendGet().filter(x => x.taskId !== taskId)]);
        const pendDel = (taskId) => pendSet(pendGet().filter(x => x.taskId !== taskId));
        const lyWords = (t) => String(t || '').replace(/\[[^\]\n]*\]/g, ' ').replace(/-/g, '').toLowerCase().split(/[^\p{L}\p{N}']+/u).filter(Boolean);

        const FORMAT_PROMPT = `You are an expert lyric formatter specializing in preparing song lyrics for AI music generation. Your primary task is to transform user-provided lyrics into a friendly format with clear song sections and syllable separation to help improve vocal pronunciation.

MAIN OBJECTIVE

Whenever the user sends song lyrics, immediately process them and return the formatted lyrics. Do not ask follow-up questions unless the input is genuinely impossible to interpret.

RULES

1. PRESERVE THE ORIGINAL LYRICS
- Preserve the original language, meaning, words, and lyrical content.
- Do not translate, paraphrase, rewrite, or add new lyrical lines.
- Do not remove repeated lines.
- Do not invent lyrics to fill missing sections.
- Only modify syllable formatting, line breaks, and section labels.

2. SYLLABLE SEPARATION
- Separate words into natural syllables using hyphens.
- Examples: kepala → ke-pa-la, pundak → pun-dak.
- Apply syllable separation consistently.
- Do not separate every individual letter.

3. SONG SECTION LABELS
Use English section labels in square brackets:
[Intro], [Verse 1], [Chorus], [Bridge], [Outro], etc.
- Keep section labels separate from the lyrics.

4. FORMATTING
- Put each lyric line on its own line.
- Avoid unnecessary punctuation.
- Return only the completed, formatted lyrics in a single copy-ready block.`;

        const buildFormatPrompt = (lyrics) => FORMAT_PROMPT + '\n\nLYRICS:\n' + lyrics;

        const hash36 = (str) => { let a = 5381, b = 2166136261; for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); a = ((a << 5) + a + c) | 0; b = Math.imul(b ^ c, 16777619); } return (a >>> 0).toString(36) + (b >>> 0).toString(36); };

        const VOCAL_AGES = [
            { id: 'child', l: 'Anak-anak', tags: ['child-like playful voice', 'kids vocals'] },
            { id: 'teen', l: 'Remaja', tags: ['youthful', 'bright'] },
            { id: 'adult', l: 'Dewasa', tags: [] },
            { id: 'mature', l: 'Dewasa matang', tags: ['mature voice'] }
        ];
        const VOCAL_RANGES = { f: ['soprano', 'mezzo-soprano', 'alto'], m: ['tenor', 'baritone', 'bass'] };
        const VOCAL_TRAITS = [
            ['warm', 'Hangat', 'warm tone'], ['smooth', 'Halus', 'smooth delivery'], ['bright', 'Cerah', 'bright tone'],
            ['soft', 'Lembut', 'soft intimate delivery'], ['breathy', 'Breathy', 'breathy'], ['airy', 'Airy', 'airy'],
            ['silky', 'Silky', 'silky'], ['ethereal', 'Ethereal', 'ethereal'], ['raspy', 'Serak', 'raspy'],
            ['husky', 'Husky', 'husky'], ['gritty', 'Kasar', 'gritty'], ['powerful', 'Bertenaga', 'powerful belting'],

        const V_GENTLE = ['soft', 'breathy', 'airy', 'silky', 'ethereal'], V_STRONG = ['powerful', 'gritty', 'raspy'], V_YOUNG_BLOCK = ['sultry', 'husky', 'gritty', 'raspy'];
        const vocalConflict = (a, b) => (V_GENTLE.includes(a) && V_STRONG.includes(b)) || (V_STRONG.includes(a) && V_GENTLE.includes(b));
        const traitBlocked = (id, v) => {
            if (v.traits.includes(id)) return false;
            if (v.traits.length >= 2) return true; 
            if (v.traits.some(t => vocalConflict(t, id))) return true;
            if (['child', 'teen'].includes(v.age) && V_YOUNG_BLOCK.includes(id)) return true;

            return false;

        function vocalTagList(v) {
            if (!v || !v.genders.length) return [];
            const t = [v.genders.length === 2 ? 'male and female duet vocals' : (v.genders[0] === 'f' ? 'female vocals' : 'male vocals')];
            const age = VOCAL_AGES.find(a => a.id === v.age); if (age) t.push(...age.tags);
            if (v.range) t.push(`${v.range} vocals`);
            v.traits.forEach(id => { const x = VOCAL_TRAITS.find(y => y.id === id); if (x) t.push(x.tag); });
            return [...new Set(t)];
        }
        function composeStyle(raw, tags) {
            const base = String(raw || '').trim(), low = base.toLowerCase();
            const miss = (tags || []).filter(t => !low.includes(t.toLowerCase()));
            return [...miss, base].filter(Boolean).join(', ').slice(0, STYLE_MAX);
        }

        function parseLyricsResponse(raw) {
            let text = String(raw || '').trim();
            text = text.replace(/^```[a-zA-Z]*\s*/, '').replace(/\s*```$/, '').trim();
            if (text.startsWith('{')) {
                try {
                    const o = JSON.parse(text);
                    const v = o && (o.lyrics ?? o.lirik ?? o.text);
                    if (typeof v === 'string' && v.trim()) text = v.trim();
                } catch (e) {}
            }
            text = text.replace(/\r/g, '').replace(/[ \t]+\n/g, '\n');
            text = text.replace(/([^\n])[ \t]*(\[(?:Intro|Verse|Pre-?Chorus|Post-?Chorus|Final Chorus|Chorus|Hook|Bridge|Instrumental|Interlude|Break|Solo|Outro|End)[^\]\n]{0,30}\])/gi, '$1\n$2');
            text = text.replace(/^([ \t]*\[[^\]\n]{1,40}\])[ \t]+(?=\S)/gm, '$1\n');
            text = text.replace(/([^\n])\n(\[[^\]\n]{1,40}\])/g, '$1\n\n$2');
            text = text.replace(/([^\n])\n(\[[^\]\n]{1,40}\])/g, '$1\n\n$2');
            return text.replace(/\n{3,}/g, '\n\n').trim();
        }

        function buildStylePrompt(style, o) {
            const tags = o.tags || [];
            const vocalRule = tags.length
                ? `VOCAL: the app itself puts these vocal tags at the very start of the final style: "${tags.join(', ')}". Do NOT write any vocal descriptor in your output.`
                : 'VOCAL: no vocal was chosen. Add exactly ONE clear vocal descriptor right after the genre.';
            return [
                'You are a prompt specialist. Convert the user description into a STYLE prompt for an Upload & Cover task.',
                `USER DESCRIPTION: ${style}`,
                `LYRIC SNIPPET: ${String(o.lyrics || '').replace(/\s+/g, ' ').slice(0, 400) || '(empty)'}`,
                vocalRule,
                'OUTPUT: valid JSON {"style": "..."} only, no other text, no markdown.'
            ].join('\n');
        }

        function parseStyleResponse(raw) {
            const t = String(raw || '').replace(/```json|```/gi, '').trim();
            const m = t.match(/\{[\s\S]*\}/);
            if (m) {
                try { const o = JSON.parse(m[0]); if (o && o.style) return String(o.style).trim(); } catch (e) {}
                const r = m[0].match(/"style"\s*:\s*"([\s\S]*?)"\s*\}/);
                if (r) return r[1].replace(/\\"/g, '"').replace(/\\n/g, ' ').trim();
            }
            return t.replace(/^style\s*:\s*/i, '').replace(/\s*\n\s*/g, ' ').trim();
        }

        // =====================================================================
        //  VOCAL FILTER CORE (Audio Processing)
        // =====================================================================
        const VF_FMIN = 80, VF_FMAX = 1100, VOICE_LEVEL = 0.75, VOICE_GAIN = 0.75;
        const BREATH_UNVOICED = 0.07, BREATH_VOICED = 0.015, CENTER_POW = 2;
        const tick = () => new Promise(r => setTimeout(r, 0));
        const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

        function makeFFT(N) {
            const cosT = new Float64Array(N >> 1), sinT = new Float64Array(N >> 1);
            for (let i = 0; i < (N >> 1); i++) { cosT[i] = Math.cos(2 * Math.PI * i / N); sinT[i] = Math.sin(2 * Math.PI * i / N); }
            const bits = Math.round(Math.log2(N));
            const rev = new Uint32Array(N);
            for (let i = 0; i < N; i++) { let r = 0, v = i; for (let b = 0; b < bits; b++) { r = (r << 1) | (v & 1); v >>= 1; } rev[i] = r; }
            return function transform(re, im, inverse) {
                for (let i = 0; i < N; i++) {
                    const j = rev[i];
                    if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
                }
                const sg = inverse ? -1 : 1;
                for (let size = 2; size <= N; size <<= 1) {
                    const half = size >> 1, step = N / size;
                    for (let i = 0; i < N; i += size) {
                        for (let j = i, k = 0; j < i + half; j++, k += step) {
                            const l = j + half, c = cosT[k], s = sg * sinT[k];
                            const tr = re[l] * c + im[l] * s, ti = im[l] * c - re[l] * s;
                            re[l] = re[j] - tr; im[l] = im[j] - ti;
                            re[j] += tr; im[j] += ti;
                        }
                    }
                }

        function biquadFilter(x, type, fc, Q, sr, out) {
            const w0 = 2 * Math.PI * fc / sr;
            const cs = Math.cos(w0), sn = Math.sin(w0);
            const alpha = sn / (2 * Q);
            let b0, b1, b2;
            if (type === 'lowpass') { b0 = (1 - cs) / 2; b1 = 1 - cs; b2 = (1 - cs) / 2; }
            else { b0 = (1 + cs) / 2; b1 = -(1 + cs); b2 = (1 + cs) / 2; }
            const a0 = 1 + alpha, a1 = -2 * cs, a2 = 1 - alpha;
            const nb0 = b0 / a0, nb1 = b1 / a0, nb2 = b2 / a0, na1 = a1 / a0, na2 = a2 / a0;
            const y = out || new Float32Array(x.length);
            let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
            for (let i = 0; i < x.length; i++) {
                const xi = x[i];
                const yi = nb0 * xi + nb1 * x1 + nb2 * x2 - na1 * y1 - na2 * y2;
                x2 = x1; x1 = xi; y2 = y1; y1 = yi;
                y[i] = yi;
            }

        }

        function median9(a) {
            for (let i = 1; i < 9; i++) { const v = a[i]; let j = i - 1; while (j >= 0 && a[j] > v) { a[j + 1] = a[j]; j--; } a[j + 1] = v; }

        async function separateStems(L, R, sr, onProgress) {
            const rep = (p) => { if (onProgress) onProgress(Math.min(1, p)); };
            const len = L.length;
            const N = Math.min(8192, Math.max(1024, 1 << Math.round(Math.log2(0.046 * sr))));
            const hop = N >> 1;
            const fft = makeFFT(N);
            const win = new Float64Array(N);
            for (let i = 0; i < N; i++) win[i] = Math.sin(Math.PI * (i + 0.5) / N); 
            const binHz = sr / N;
            const K = Math.min((N >> 1) - 1, Math.ceil(13000 / binHz) + 1);
            const nF = Math.floor((len - 1) / hop) + 2;
            const re = new Float64Array(N), im = new Float64Array(N);

            const loadFrame = (f) => {
                const s = (f - 1) * hop;
                for (let i = 0; i < N; i++) {
                    const idx = s + i;
                    if (idx >= 0 && idx < len) { re[i] = L[idx] * win[i]; im[i] = R[idx] * win[i]; } else { re[i] = 0; im[i] = 0; }
                }
                fft(re, im, false);
            };

            const mag = new Float32Array(nF * K);
            for (let f = 0; f < nF; f++) {
                loadFrame(f);
                const o = f * K;
                for (let k = 0; k < K; k++) {
                    const k2 = (N - k) & (N - 1);
                    const Lr = (re[k] + re[k2]) * 0.5, Li = (im[k] - im[k2]) * 0.5;
                    const Rr = (im[k] + im[k2]) * 0.5, Ri = -(re[k] - re[k2]) * 0.5;
                    const Mr = (Lr + Rr) * 0.5, Mi = (Li + Ri) * 0.5;
                    mag[o + k] = Math.sqrt(Mr * Mr + Mi * Mi);
                }
                if (f % 200 === 0) { rep(0.25 * f / nF); await tick(); }
            }

            const hmask = new Uint8Array(nF * K);
            const Pm = new Float32Array(K);
            const tmp = new Float32Array(9);
            for (let t = 0; t < nF; t++) {
                const o = t * K;
                for (let k = 0; k < K; k++) {
                    for (let d = -4; d <= 4; d++) { let kk = k + d; if (kk < 0) kk = 0; else if (kk >= K) kk = K - 1; tmp[d + 4] = mag[o + kk]; }

                for (let k = 0; k < K; k++) {
                    for (let d = -4; d <= 4; d++) { let tt = t + d; if (tt < 0) tt = 0; else if (tt >= nF) tt = nF - 1; tmp[d + 4] = mag[tt * K + k]; }
                    const H = median9(tmp), P = Pm[k];

            }

            const bw = new Float32Array(K);
            for (let k = 0; k < K; k++) { const fHz = k * binHz; bw[k] = sstep(90, 200, fHz) * (1 - sstep(9000, 13000, fHz)); }

            const vocal = new Float32Array(len);
            const vr = new Float64Array(N), vi = new Float64Array(N);
            for (let f = 0; f < nF; f++) {
                loadFrame(f);
                const o = f * K;
                vr.fill(0); vi.fill(0);
                for (let k = 1; k < K; k++) {
                    const w = bw[k];
                    if (w <= 0) continue;
                    const k2 = N - k;
                    const Lr = (re[k] + re[k2]) * 0.5, Li = (im[k] - im[k2]) * 0.5;
                    const Rr = (im[k] + im[k2]) * 0.5, Ri = -(re[k] - re[k2]) * 0.5;
                    const Mr = (Lr + Rr) * 0.5, Mi = (Li + Ri) * 0.5;
                    const Sr = (Lr - Rr) * 0.5, Si = (Li - Ri) * 0.5;

                    if (mk <= 0) continue;
                    vr[k] = Mr * mk; vi[k] = Mi * mk;
                    vr[k2] = vr[k]; vi[k2] = -vi[k];
                }
                fft(vr, vi, true);
                const s = (f - 1) * hop;
                for (let i = 0; i < N; i++) {
                    const idx = s + i;
                    if (idx >= 0 && idx < len) vocal[idx] += vr[i] / N * win[i];
                }
                if (f % 200 === 0) { rep(0.40 + 0.6 * f / nF); await tick(); }
            }

            const musicL = new Float32Array(len), musicR = new Float32Array(len);
            for (let i = 0; i < len; i++) { musicL[i] = L[i] - vocal[i]; musicR[i] = R[i] - vocal[i]; }
            rep(1);
            return { vocal, musicL, musicR, aux: { N, hop, K, nF, binHz, hmask, bw } };
        }

        async function refineStems(L, R, sr, track, sep, onProgress) {
            const rep = (p) => { if (onProgress) onProgress(Math.min(1, p)); };
            const { N, hop, K, nF, binHz, hmask, bw } = sep.aux;
            const len = L.length;
            const fft = makeFFT(N);
            const win = new Float64Array(N);
            for (let i = 0; i < N; i++) win[i] = Math.sin(Math.PI * (i + 0.5) / N);
            const re = new Float64Array(N), im = new Float64Array(N);
            const vr = new Float64Array(N), vi = new Float64Array(N);
            const comb = new Float32Array(K);
            const bwR = new Float32Array(K), hiB = new Float32Array(K);
            for (let k = 0; k < K; k++) { const fHz = k * binHz; bwR[k] = sstep(70, 130, fHz) * (1 - sstep(9000, 13000, fHz)); hiB[k] = sstep(2500, 4000, fHz); }
            const { tone, f0hz, hopSec, nFr } = track;
            const vocal = new Float32Array(len);

            for (let f = 0; f < nF; f++) {
                const s = (f - 1) * hop;
                for (let i = 0; i < N; i++) {
                    const idx = s + i;
                    if (idx >= 0 && idx < len) { re[i] = L[idx] * win[i]; im[i] = R[idx] * win[i]; } else { re[i] = 0; im[i] = 0; }
                }
                fft(re, im, false);

                const ti = Math.max(0, Math.min(nFr - 1, Math.round(((s + (N >> 1)) / sr) / hopSec)));
                let fa = 1e9, fb = 0, nv = 0;

                    if (tone[q]) { nv++; if (f0hz[q] < fa) fa = f0hz[q]; if (f0hz[q] > fb) fb = f0hz[q]; }
                }
                const voiced = nv >= 3;
                if (voiced) {
                    comb.fill(0);
                    for (let h = 1; h * fa < 13000; h++) {
                        const lo = (h * fa) / binHz - 2, hi = (h * fb) / binHz + 2;
                        for (let k = Math.max(1, Math.ceil(lo)); k <= Math.min(K - 1, Math.floor(hi)); k++) {
                            const w = Math.max(0, Math.min(1, k - lo, hi - k));
                            if (w > comb[k]) comb[k] = w;
                        }
                    }
                }

                vr.fill(0); vi.fill(0);
                const o = f * K;
                for (let k = 1; k < K; k++) {
                    const k2 = N - k;
                    const Lr = (re[k] + re[k2]) * 0.5, Li = (im[k] - im[k2]) * 0.5;
                    const Rr = (im[k] + im[k2]) * 0.5, Ri = -(re[k] - re[k2]) * 0.5;
                    const Mr = (Lr + Rr) * 0.5, Mi = (Li + Ri) * 0.5;
                    const Sr = (Lr - Rr) * 0.5, Si = (Li - Ri) * 0.5;
                    const m2 = Mr * Mr + Mi * Mi, s2 = Sr * Sr + Si * Si;
                    let c = (m2 - s2) / (m2 + s2 + 1e-20); if (c < 0) c = 0;
                    c = Math.pow(c, CENTER_POW);

                    if (voiced) mk = Math.max(comb[k] * bwR[k], coarse * hiB[k]);
                    else mk = coarse;
                    mk *= c;
                    if (mk <= 0) continue;
                    vr[k] = Mr * mk; vi[k] = Mi * mk;
                    vr[k2] = vr[k]; vi[k2] = -vi[k];
                }
                fft(vr, vi, true);
                for (let i = 0; i < N; i++) {
                    const idx = s + i;
                    if (idx >= 0 && idx < len) vocal[idx] += vr[i] / N * win[i];
                }
                if (f % 200 === 0) { rep(f / nF); await tick(); }
            }
            const musicL = new Float32Array(len), musicR = new Float32Array(len);
            for (let i = 0; i < len; i++) { musicL[i] = L[i] - vocal[i]; musicR[i] = R[i] - vocal[i]; }
            rep(1);
            return { vocal, musicL, musicR };
        }

        async function trackMelody(vocal, sr, onProgress) {
            const rep = (p) => { if (onProgress) onProgress(Math.min(1, p)); };

            const dec = Math.max(1, Math.round(sr / 11025));
            const fs = sr / dec;
            let x = biquadFilter(vocal, 'highpass', 60, 0.7, sr);
            if (dec > 1) { for (let i = 0; i < 3; i++) biquadFilter(x, 'lowpass', 4300, 0.7, sr, x); }
            const xd = new Float32Array(Math.floor(x.length / dec));
            for (let i = 0; i < xd.length; i++) xd[i] = x[i * dec];
            x = null;
            await tick();

            const winLen = (Math.round(0.072 * fs) >> 1) << 1;
            const hop = Math.max(1, Math.round(0.010 * fs));
            let Nf = 1; while (Nf < winLen * 2) Nf <<= 1;
            const nFr = Math.floor(xd.length / hop) + 1;
            const fft = makeFFT(Nf);
            const hann = new Float64Array(winLen);
            for (let i = 0; i < winLen; i++) hann[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * (i + 0.5) / winLen);
            const binHz = fs / Nf;
            const kLo = Math.max(2, Math.floor(70 / binHz)), kHi = Math.min((Nf >> 1) - 3, Math.floor(5000 / binHz));

            const ps = new Float64Array(xd.length + 1);
            for (let i = 0; i < xd.length; i++) ps[i + 1] = ps[i] + xd[i] * xd[i];
            const envRaw = new Float32Array(nFr);
            for (let t = 0; t < nFr; t++) {
                const a = Math.max(0, t * hop - (winLen >> 1)), b = Math.min(xd.length, a + winLen);

            }

            const envP95 = envSorted[Math.min(nFr - 1, Math.floor(nFr * 0.95))] || 1e-6;
            const env = new Float32Array(nFr);
            for (let t = 0; t < nFr; t++) env[t] = envRaw[t] / envP95;

            const BPS = 4;                                              
            const NB = Math.round(BPS * 12 * Math.log2(VF_FMAX / VF_FMIN)) + 1;
            const LOG2MIN = Math.log2(VF_FMIN);
            const HN = 10;
            const wH = new Float64Array(HN + 1), l2h = new Float64Array(HN + 1);
            for (let h = 1; h <= HN; h++) { wH[h] = Math.pow(0.84, h - 1); l2h[h] = Math.log2(h); }

            const MAXP = 64;
            const pkF = new Float32Array(nFr * MAXP), pkA = new Float32Array(nFr * MAXP);
            const pkN = new Uint8Array(nFr);
            const obs = new Uint8Array(nFr * NB);
            const sal = new Float64Array(NB + 2), sal2 = new Float64Array(NB);
            const re = new Float64Array(Nf), im = new Float64Array(Nf);
            const mgA = new Float64Array((Nf >> 1) + 2), mgB = new Float64Array((Nf >> 1) + 2);
            const cF = new Float64Array(512), cA = new Float64Array(512);

            const doFrame = (t, mg) => {
                let mmax = 0;
                for (let k = kLo; k <= kHi; k++) if (mg[k] > mmax) mmax = mg[k];
                const o = t * NB;
                if (mmax < 1e-9) { pkN[t] = 0; return; }
                const thr = mmax * 0.02;
                let cnt = 0;
                for (let k = kLo; k <= kHi && cnt < 512; k++) {
                    const m = mg[k];
                    if (m > thr && m > mg[k - 1] && m >= mg[k + 1]) {
                        const la = Math.log(mg[k - 1] + 1e-12), lb = Math.log(m), lc = Math.log(mg[k + 1] + 1e-12);
                        const den = la - 2 * lb + lc;
                        let d = den < 0 ? 0.5 * (la - lc) / den : 0;

                        cnt++;
                    }
                }
                let idxs = null;
                if (cnt > MAXP) {
                    idxs = Array.from({ length: cnt }, (_, i) => i).sort((a, b) => cA[b] - cA[a]).slice(0, MAXP).sort((a, b) => a - b);
                } else { idxs = Array.from({ length: cnt }, (_, i) => i); }
                const base = t * MAXP;
                for (let n = 0; n < idxs.length; n++) { pkF[base + n] = cF[idxs[n]]; pkA[base + n] = cA[idxs[n]]; }
                pkN[t] = idxs.length;

                sal.fill(0);
                for (let n = 0; n < idxs.length; n++) {
                    const fp = pkF[base + n], a = Math.pow(pkA[base + n], 0.6);
                    const l2 = Math.log2(fp);
                    for (let h = 1; h <= HN; h++) {
                        const jf = BPS * 12 * (l2 - l2h[h] - LOG2MIN);
                        if (jf < -0.5) break;
                        if (jf > NB - 1) continue;
                        const j0 = Math.floor(jf), fr = jf - j0, v = a * wH[h];
                        sal[j0] += v * (1 - fr); sal[j0 + 1] += v * fr;
                    }
                }
                let sm = 0;
                for (let j = 0; j < NB; j++) {
                    const v = 0.25 * (j > 0 ? sal[j - 1] : sal[j]) + 0.5 * sal[j] + 0.25 * sal[j + 1];
                    sal2[j] = v; if (v > sm) sm = v;
                }
                if (sm > 0) for (let j = 0; j < NB; j++) obs[o + j] = Math.round(255 * sal2[j] / sm);
            };

            for (let t = 0; t < nFr; t += 2) {
                const t2 = t + 1 < nFr ? t + 1 : -1;
                re.fill(0); im.fill(0);
                const s1 = t * hop - (winLen >> 1);
                for (let i = 0; i < winLen; i++) { const idx = s1 + i; if (idx >= 0 && idx < xd.length) re[i] = xd[idx] * hann[i]; }
                if (t2 >= 0) {
                    const s2 = t2 * hop - (winLen >> 1);
                    for (let i = 0; i < winLen; i++) { const idx = s2 + i; if (idx >= 0 && idx < xd.length) im[i] = xd[idx] * hann[i]; }
                }
                fft(re, im, false);
                for (let k = kLo - 1; k <= kHi + 1; k++) {
                    const k2 = (Nf - k) & (Nf - 1);
                    const ar = (re[k] + re[k2]) * 0.5, ai = (im[k] - im[k2]) * 0.5;

            const bp = new Uint8Array(nFr * NB);
            let prev = new Float32Array(NB), cur = new Float32Array(NB);
            const fv = new Float32Array(NB), fi = new Uint8Array(NB), bv = new Float32Array(NB), bi2 = new Uint8Array(NB);
            for (let j = 0; j < NB; j++) prev[j] = obs[j] / 255;
            for (let t = 1; t < nFr; t++) {

                for (let j = 0; j < NB; j++) if (prev[j] > gmax) { gmax = prev[j]; gidx = j; }
                fv[0] = prev[0]; fi[0] = 0;
                for (let j = 1; j < NB; j++) {
                    if (fv[j - 1] - LAM > prev[j]) { fv[j] = fv[j - 1] - LAM; fi[j] = fi[j - 1]; } else { fv[j] = prev[j]; fi[j] = j; }
                }
                bv[NB - 1] = prev[NB - 1]; bi2[NB - 1] = NB - 1;
                for (let j = NB - 2; j >= 0; j--) {
                    if (bv[j + 1] - LAM > prev[j]) { bv[j] = bv[j + 1] - LAM; bi2[j] = bi2[j + 1]; } else { bv[j] = prev[j]; bi2[j] = j; }
                }
                const capV = gmax - JCAP;
                const o = t * NB;
                let cmax = -1e9;
                for (let j = 0; j < NB; j++) {
                    let v, id;
                    if (fv[j] >= bv[j]) { v = fv[j]; id = fi[j]; } else { v = bv[j]; id = bi2[j]; }
                    if (v < capV) { v = capV; id = gidx; }
                    bp[o + j] = id;
                    cur[j] = v + obs[o + j] / 255;
                    if (cur[j] > cmax) cmax = cur[j];
                }
                for (let j = 0; j < NB; j++) cur[j] -= cmax;
                const sw = prev; prev = cur; cur = sw;
                if (t % 2000 === 0) { rep(0.6 + 0.2 * t / nFr); await tick(); }
            }
            const path = new Uint8Array(nFr);
            let best = 0; for (let j = 1; j < NB; j++) if (prev[j] > prev[best]) best = j;
            path[nFr - 1] = best;
            for (let t = nFr - 1; t > 0; t--) path[t - 1] = bp[t * NB + path[t]];

            const f0 = new Float32Array(nFr), hr = new Float32Array(nFr);
            for (let t = 0; t < nFr; t++) {
                const fb = VF_FMIN * Math.pow(2, path[t] / (BPS * 12));
                const base = t * MAXP, n = pkN[t];
                let acc = 0, wsum = 0, matchE = 0, totE = 0;
                for (let q = 0; q < n; q++) totE += pkA[base + q] * pkA[base + q];
                for (let h = 1; h <= HN; h++) {
                    const target = fb * h;
                    if (target > 5000) break;
                    let bestA = 0, bestF = 0;
                    for (let q = 0; q < n; q++) {
                        const fp = pkF[base + q];
                        if (Math.abs(Math.log2(fp / target)) < 0.04 && pkA[base + q] > bestA) { bestA = pkA[base + q]; bestF = fp; }
                    }
                    if (bestA > 0) { acc += bestA * (bestF / h); wsum += bestA; matchE += bestA * bestA; }

                hr[t] = totE > 0 ? matchE / totE : 0;

            const strong = [];
            for (let t = 0; t < nFr; t++) if (env[t] > 0.25) strong.push(hr[t]);
            strong.sort((a, b) => a - b);
            const p75 = strong.length ? strong[Math.floor(strong.length * 0.75)] : 0.5;
            const hrThr = Math.min(0.40, Math.max(0.15, 0.5 * p75));
            const vo = new Uint8Array(nFr);
            for (let t = 0; t < nFr; t++) vo[t] = (env[t] >= 0.04 && hr[t] >= hrThr) ? 1 : 0;

            let i = 0;
            while (i < nFr) {
                if (vo[i]) { let j = i; while (j < nFr && vo[j]) j++; if (j - i < 3) for (let k = i; k < j; k++) vo[k] = 0; i = j; } else i++;
            }
            i = 0;
            while (i < nFr) {
                if (!vo[i]) {
                    let j = i; while (j < nFr && !vo[j]) j++;
                    if (i > 0 && j < nFr && (j - i) <= 3 && Math.abs(Math.log2(f0[j] / f0[i - 1])) < 0.17) {
                        let e = 0; for (let k = i; k < j; k++) e += env[k];
                        if (e / (j - i) > 0.10) for (let k = i; k < j; k++) { vo[k] = 1; f0[k] = f0[i - 1] * Math.pow(f0[j] / f0[i - 1], (k - i + 1) / (j - i + 1)); }
                    }
                    i = j;
                } else i++;

            for (let t = 0; t < nFr; t++) lg[t] = Math.log2(f0[t]);
            for (let t = 0; t < nFr; t++) {

                const a = (t > 0 && vo[t - 1]) ? lg[t - 1] : lg[t], b = lg[t], c = (t + 1 < nFr && vo[t + 1]) ? lg[t + 1] : lg[t];
                sm3[t] = Math.max(Math.min(a, b), Math.min(Math.max(a, b), c));

            for (let t = 0; t < nFr; t++) if (vo[t]) { if (first < 0) first = t; voicedCount++; }
            const hopSec = hop / fs;
            if (first < 0) return { f0log: new Float32Array(nFr).fill(Math.log2(600)), tone: vo, shift: 0, env, hopSec, nFr, f0hz: new Float32Array(nFr), hrThr };
            const f0log = new Float32Array(nFr);
            let last = sm3[first];
            for (let t = 0; t < nFr; t++) { if (vo[t]) last = sm3[t]; f0log[t] = last; }
            const vals = []; for (let t = 0; t < nFr; t++) if (vo[t]) vals.push(sm3[t]);
            vals.sort((a, b) => a - b);
            const med = Math.pow(2, vals[vals.length >> 1]);
            const shift = Math.min(2, Math.max(0, Math.round(Math.log2(700 / med))));
            const f0hz = new Float32Array(nFr);
            for (let t = 0; t < nFr; t++) f0hz[t] = Math.pow(2, f0log[t]);
            rep(1);
            return { f0log, tone: vo, shift, env, hopSec, nFr, f0hz, hrThr };
        }

        // =====================================================================
        // MEMODIFIKASI VOKAL MENJADI VOKAL SINTETIS / MANUSIA (A-B-C)
        // =====================================================================
        async function synthesizeVoice(track, vocal, sr, onProgress, opts = {}) {
            const len = vocal.length;
            const { f0log, tone, shift, env: envN, hopSec, nFr } = track;

            const TAB = 2048;
            const tab = new Float32Array(TAB);
            
            // Generator Glottal Wave (Menyerupai karakteristik pita suara manusia)
            // Roll-off harmonik disetel untuk menciptakan suara vokal yang hangat
            let pk = 0;
            for (let i = 0; i < TAB; i++) {
                let v = 0;
                for (let h = 1; h <= 40; h++) {
                    v += (1 / Math.pow(h, 1.8)) * Math.sin(2 * Math.PI * h * i / TAB);
                }
                tab[i] = v; if (Math.abs(v) > pk) pk = Math.abs(v);
            }
            for (let i = 0; i < TAB; i++) tab[i] /= pk;

            const out = new Float32Array(len);
            const act = new Uint8Array(len);
            
            const aAtt = 1 - Math.exp(-1 / (sr * 0.008));
            const aRel = 1 - Math.exp(-1 / (sr * 0.04));
            const aAmp = 1 - Math.exp(-1 / (sr * 0.015));
            const aBr = 1 - Math.exp(-1 / (sr * 0.01));
            const aN1 = 1 - Math.exp(-2 * Math.PI * 6000 / sr);
            const aN2 = 1 - Math.exp(-2 * Math.PI * 1500 / sr);
            const BLOCK = 64;
            
            let phase = 0, toneG = 0, ampS = 0, breathS = 0, vibPhase = 0, sustain = 0, n1 = 0, n2 = 0;

            // Biquad Filter (Simulasi Saluran Vokal / Formant)
            const bq1 = { x1: 0, x2: 0, y1: 0, y2: 0, b0: 0, b1: 0, b2: 0, a1: 0, a2: 0 };
            const bq2 = { x1: 0, x2: 0, y1: 0, y2: 0, b0: 0, b1: 0, b2: 0, a1: 0, a2: 0 };
            const bq3 = { x1: 0, x2: 0, y1: 0, y2: 0, b0: 0, b1: 0, b2: 0, a1: 0, a2: 0 };
            
            const updBq = (bq, fc, Q) => {
                const w0 = 2 * Math.PI * (fc / sr);
                const alpha = Math.sin(w0) / (2 * Q);
                const a0 = 1 + alpha;
                bq.b0 = alpha / a0; bq.b1 = 0; bq.b2 = -alpha / a0;
                bq.a1 = -2 * Math.cos(w0) / a0; bq.a2 = (1 - alpha) / a0;
            };
            const runBq = (bq, x) => {
                const y = bq.b0 * x + bq.b1 * bq.x1 + bq.b2 * bq.x2 - bq.a1 * bq.y1 - bq.a2 * bq.y2;
                bq.x2 = bq.x1; bq.x1 = x; bq.y2 = bq.y1; bq.y1 = y;
                return y;
            };

            // Pola sequence yang diminta user: "aaaa bbbb cccc aaa bbbb ccc aaaabbb ccccc aaabbbcc"
            const seqStr = "aaaabbbbccccaaabbbbcccaaaabbbcccccaaabbbcc";
            let seqIdx = 0;
            let sylT = 0; // Timer untuk suku kata
            let tF1 = 700, tF2 = 1100, tF3 = 2600;
            let cF1 = 700, cF2 = 1100, cF3 = 2600;
            let tAmpMod = 1.0, cAmpMod = 1.0;

            for (let s = 0; s < len; s += BLOCK) {
                let fp = (s / sr) / hopSec;
                if (fp < 0) fp = 0; if (fp > nFr - 1) fp = nFr - 1;
                const i0 = Math.floor(fp), i1 = Math.min(nFr - 1, i0 + 1), fr = fp - i0;
                let f = Math.pow(2, f0log[i0] + (f0log[i1] - f0log[i0]) * fr + shift);
                while (f > 2100) f /= 2;
                if (opts.ceil && f > opts.ceil) f = opts.ceil * Math.pow(f / opts.ceil, opts.squash); 
                const toneT = tone[Math.min(nFr - 1, Math.round(fp))] ? 1 : 0;
                const envv = envN[i0] + (envN[i1] - envN[i0]) * fr;
                const ampT = Math.min(1, Math.pow(Math.max(envv, 0), 0.55)) * sstep(0.03, 0.10, envv);
                
                const breathT = toneT ? BREATH_VOICED * ampT : (envv > 0.12 ? BREATH_UNVOICED * Math.min(1, Math.pow(envv, 0.7)) : 0);
                if (toneT) sustain += BLOCK / sr; else sustain = 0;
                const vibD = Math.min(1, Math.max(0, (sustain - 0.15) / 0.4));
                const end = Math.min(len, s + BLOCK);
                
                for (let k = s; k < end; k++) {
                    toneG += (toneT - toneG) * (toneT > toneG ? aAtt : aRel);
                    ampS += (ampT - ampS) * aAmp;
                    breathS += (breathT - breathS) * aBr;
                    vibPhase += 5.3 / sr; if (vibPhase >= 1) vibPhase -= 1;
                    
                    // Modulasi Pitch (Vibrato) dibuat lebih organik seperti suara manusia
                    const fm = f * (1 + 0.006 * vibD * Math.sin(6.2831853 * vibPhase) + 0.0015 * Math.sin(1.2 * vibPhase));
                    phase += fm / sr; if (phase >= 1) phase -= 1;
                    
                    // Logika Sequence a-b-c
                    if (sylT <= 0) {
                        const char = seqStr[seqIdx % seqStr.length];
                        seqIdx++;
                        sylT = sr * 0.12; // Transisi karakter setiap 120ms

                        if (char === 'a') {
                            tF1 = 730; tF2 = 1090; tF3 = 2440; // Suara terbuka "Aah"
                            tAmpMod = 1.0;
                        } else if (char === 'b') {
                            tF1 = 250; tF2 = 800; tF3 = 2000;  // Suara tertutup "Mmm / Bbb"
                            tAmpMod = 0.4; // Volume agak turun karena mulut tertutup
                        } else if (char === 'c') {
                            tF1 = 500; tF2 = 1800; tF3 = 2800; // Suara sibilan "Ts / Ce"
                            tAmpMod = 0.8;
                            if (toneT) breathS = Math.max(breathS, 0.35); // Suntikan desisan napas konsonan
                        }
                    }
                    sylT--;
                    
                    // Filter formant bergeser mulus mengikuti formasi huruf
                    cF1 += (tF1 - cF1) * 0.002;
                    cF2 += (tF2 - cF2) * 0.002;
                    cF3 += (tF3 - cF3) * 0.002;
                    cAmpMod += (tAmpMod - cAmpMod) * 0.002;
                    
                    // Hemat komputasi (update biquad tiap 32 sample)
                    if (k % 32 === 0) {
                        updBq(bq1, cF1, 4); updBq(bq2, cF2, 4); updBq(bq3, cF3, 4);
                    }

                    // Phase Modulation Jitter - Dijaga kecil (0.05) agar tetap "untraceable" namun tetap memiliki kualitas manusia
                    const phaseJitter = (Math.random() * 2 - 1) * 0.05; 
                    let wrapPh = phase + phaseJitter;
                    wrapPh = wrapPh - Math.floor(wrapPh);
                    
                    const ph = wrapPh * TAB, ii = ph | 0, fr2 = ph - ii;
                    let rawSmp = tab[ii] + (tab[(ii + 1) & (TAB - 1)] - tab[ii]) * fr2;

                    // Lewatkan Glottal Source pada Filter Formant
                    const f1Out = runBq(bq1, rawSmp);
                    const f2Out = runBq(bq2, rawSmp);
                    const f3Out = runBq(bq3, rawSmp);
                    
                    // Padukan formasi vokalnya
                    let smp = (f1Out * 1.0 + f2Out * 0.6 + f3Out * 0.2) * 1.5;

                    const nz = Math.random() * 2 - 1;
                    n1 += aN1 * (nz - n1); n2 += aN2 * (n1 - n2);
                    
                    // Output Vokal
                    out[k] = (smp * toneG * ampS * cAmpMod) + (n1 - n2) * breathS * 2.5;
                    if (toneG * ampS > 0.05) act[k] = 1;
                }
                if ((s / BLOCK) % 2048 === 0) { if (onProgress) onProgress(s / len); await tick(); }
            }

            let eV = 0, eO = 0;
            for (let i = 0; i < len; i++) if (act[i]) { eV += vocal[i] * vocal[i]; eO += out[i] * out[i]; }
            const gain = Math.min(3, Math.max(0.1, VOICE_LEVEL * Math.sqrt((eV + 1e-12) / (eO + 1e-12))));
            for (let i = 0; i < len; i++) { const v = out[i] * gain; out[i] = 0.9 * Math.tanh(v / 0.9); }
            return out;
        }

        async function buildVoiceFilter(vocal, sr, onProgress) {
            const report = (p) => { if (onProgress) onProgress(p); };
            const track = await trackMelody(vocal, sr, f => report(0.6 * f));
            await tick();
            const out = await synthesizeVoice(track, vocal, sr, f => report(0.6 + 0.4 * f));
            report(1);
            return { out, track };
        }

        const DIRTY_CEIL = 520, DIRTY_SQUASH = 0.15, DIRTY_DRIVE = 40, DIRTY_BIAS = 0.3, DIRTY_LP = 1800;
        function distMix(r) { return { wet: Math.cos(r * Math.PI / 2), dist: Math.sin(r * Math.PI / 2) }; }

        async function synthesizeDirty(track, vocal, ref, sr, onProgress) {
            const out = await synthesizeVoice(track, vocal, sr, (f) => { if (onProgress) onProgress(f * 0.8); }, { ceil: DIRTY_CEIL, squash: DIRTY_SQUASH });
            const len = out.length;

            const off = Math.tanh(DIRTY_BIAS);
            for (let i = 0; i < len; i++) {
                out[i] = Math.tanh(out[i] * DIRTY_DRIVE + DIRTY_BIAS) - off;
                if ((i & 524287) === 0) { if (onProgress) onProgress(0.8 + 0.1 * i / len); await tick(); }
            }

            biquadFilter(out, 'highpass', 120, 0.7, sr, out);
            biquadFilter(out, 'lowpass', DIRTY_LP, 0.7, sr, out);
            biquadFilter(out, 'lowpass', DIRTY_LP, 0.7, sr, out);
            if (onProgress) onProgress(0.95);
            await tick();

            let eR = 0, eD = 0;
            for (let i = 0; i < len; i++) { eR += ref[i] * ref[i]; eD += out[i] * out[i]; }
            const gain = Math.min(8, Math.max(0.05, Math.sqrt((eR + 1e-12) / (eD + 1e-12))));
            for (let i = 0; i < len; i++) { const v = out[i] * gain; out[i] = 0.9 * Math.tanh(v / 0.9); }
            if (onProgress) onProgress(1);
            return out;
        }

        const ECHO_MAX = 1.0;
        function makeEchoFx(ctx, level = 0) {
            const input = ctx.createGain(), out = ctx.createGain();
            out.gain.value = level * ECHO_MAX;
            const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 250;
            const drive = ctx.createGain(); drive.gain.value = 18;
            const shaper = ctx.createWaveShaper(), N = 1024, curve = new Float32Array(N);
            for (let i = 0; i < N; i++) { const x = (i / (N - 1)) * 2 - 1; curve[i] = Math.max(-1, Math.min(1, Math.tanh(x * 14) * 1.15)); } 
            shaper.curve = curve; shaper.oversample = '4x';
            const bright = ctx.createBiquadFilter(); bright.type = 'highshelf'; bright.frequency.value = 2500; bright.gain.value = 9; 
            const post = ctx.createGain(); post.gain.value = 0.3;
            const delay = ctx.createDelay(1.0); delay.delayTime.value = 0.3;
            const fb = ctx.createGain(); fb.gain.value = 0.5;
            input.connect(hp); hp.connect(drive); drive.connect(shaper); shaper.connect(bright); bright.connect(post);
            post.connect(out); post.connect(delay); delay.connect(out); delay.connect(fb); fb.connect(delay);
            return { input, output: out, setLevel: (v) => out.gain.setTargetAtTime(v * ECHO_MAX, ctx.currentTime, 0.03) };
        }

        const TARGET_RMS = 0.14, MAX_BOOST = 4, PEAK_CEIL = 0.85, MIN_CUT = 1, EDGE_FADE = 0.01, EXPORT_KBPS = 128;     

        function vocalMix(i) {
            return { dry: Math.pow(1 - i, 4), wet: Math.sin(i * Math.PI / 2) * VOICE_GAIN };
        }

        function computeMakeupGain(vocal, melody, intensity) {
            const mix = vocalMix(intensity);
            const n = Math.min(vocal.length, melody.length);
            let sum = 0, cnt = 0, peak = 0;
            for (let i = 0; i < n; i++) {
                const m = mix.dry * vocal[i] + mix.wet * melody[i];
                const a = Math.abs(m);
                if (a > peak) peak = a;
                if (a > 0.005) { sum += m * m; cnt++; }
            }
            if (cnt < 100 || peak <= 0) return 1;
            const rms = Math.sqrt(sum / cnt);
            let gain = TARGET_RMS / rms;
            gain = Math.min(gain, PEAK_CEIL / peak);
            return Math.min(MAX_BOOST, Math.max(1, gain));
        }

        function makeMasterChain(ctx) {
            const gain = ctx.createGain(); gain.gain.value = 0.92;
            const lim = ctx.createDynamicsCompressor();
            lim.threshold.value = -3; lim.knee.value = 0; lim.ratio.value = 20;
            lim.attack.value = 0.003; lim.release.value = 0.12;
            gain.connect(lim); lim.connect(ctx.destination);
            return gain;
        }

        class AudioEngine {
            static fileKey(file) { return `${file.name}|${file.size}|${file.lastModified}`; }

            constructor() {
                this.loadedKey = null;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.originalBuffer = null;
                this.vocalBuffer = null;
                this.filterBuffer = null;
                this.robotBuffer = null;

                this.vocalSource = null;
                this.filterSource = null;
                this.robotSource = null;

                this.masterGain = makeMasterChain(this.ctx);

                this.echoLevel = 0;
                this.robotLevel = 0;
                this.echoFx = makeEchoFx(this.ctx, 0);
                this.echoFx.output.connect(this.masterGain);

                this.vocalAnalyser = this.ctx.createAnalyser();
                this.vocalAnalyser.fftSize = 256;
                this.vocalAnalyser.smoothingTimeConstant = 0.8;

                this.isPlaying = false;
                this.startTime = 0;
                this.pauseTime = 0;
                this.duration = 0;
                this.baseReady = false;

                this.makeup = 1;         
                this.trimStart = 0;      
                this.trimEnd = 0;

                this.tracks = { vocal: { enabled: true, intensity: 0.6, volumeNode: null, dryGain: null, wetGain: null } };
            }

            async loadAudio(file, onProgress = () => {}) {
                const key = AudioEngine.fileKey(file);
                if (this.loadedKey === key && this.vocalBuffer && this.filterBuffer) {
                    onProgress(100, "Sistem Siap");
                    return;
                }
                this.stop();
                this.pauseTime = 0;
                this.loadedKey = null;
                this.originalBuffer = this.vocalBuffer = this.filterBuffer = this.robotBuffer = null;

                onProgress(10, "Mengalokasikan memori...");
                const arrayBuffer = await file.arrayBuffer();
                onProgress(40, "Decoding data PCM...");
                this.originalBuffer = await new Promise((resolve, reject) => {
                    const p = this.ctx.decodeAudioData(arrayBuffer, resolve, reject);
                    if (p && p.catch) p.catch(reject);
                });
                this.duration = this.originalBuffer.duration;

                const sr = this.originalBuffer.sampleRate;
                const len = this.originalBuffer.length;
                const L = this.originalBuffer.getChannelData(0);
                const R = this.originalBuffer.numberOfChannels > 1 ? this.originalBuffer.getChannelData(1) : L;

                onProgress(50, "Memisahkan frekuensi...");
                let coarse = await separateStems(L, R, sr, (f) => onProgress(50 + Math.round(f * 18), "Memisahkan frekuensi..."));
                onProgress(68, "Menganalisa nada...");
                const vf = await buildVoiceFilter(coarse.vocal, sr, (f) => onProgress(68 + Math.round(f * 18), "Menganalisa nada..."));
                onProgress(86, "Menyempurnakan audio...");
                const fin = await refineStems(L, R, sr, vf.track, coarse, (f) => onProgress(86 + Math.round(f * 7), "Menyempurnakan audio..."));
                coarse = null;
                onProgress(93, "Memproses bypass filter...");
                const robot = await synthesizeDirty(vf.track, fin.vocal, vf.out, sr, (f) => onProgress(93 + Math.round(f * 3), "Memproses bypass filter...")); 

                this.vocalBuffer = this.ctx.createBuffer(1, len, sr);
                this.vocalBuffer.copyToChannel(fin.vocal, 0);
                this.filterBuffer = this.ctx.createBuffer(1, len, sr);
                this.filterBuffer.copyToChannel(vf.out, 0);
                this.robotBuffer = this.ctx.createBuffer(1, len, sr);
                this.robotBuffer.copyToChannel(robot, 0);

                onProgress(96, "Kalibrasi dynamic range...");
                this.makeup = computeMakeupGain(fin.vocal, vf.out, this.tracks.vocal.intensity);
                this.trimStart = 0;
                this.trimEnd = this.duration;

                onProgress(98, "Menginisialisasi pemutar...");
                this.initBaseNodes();
                this.loadedKey = key;
                onProgress(100, "Sistem Siap");
            }

            initBaseNodes() {
                if (this.baseReady) { this.applyVocalState(); return; } 
                const ctx = this.ctx;
                const v = this.tracks.vocal;

                v.volumeNode = ctx.createGain();
                v.dryGain = ctx.createGain();
                v.wetGain = ctx.createGain();
                v.dryGain.connect(v.volumeNode);
                v.wetGain.connect(v.volumeNode);
                this.robotGain = ctx.createGain();
                this.robotGain.connect(v.volumeNode);
                v.volumeNode.connect(this.vocalAnalyser);
                this.vocalAnalyser.connect(this.masterGain);
                this.vocalAnalyser.connect(this.echoFx.input);

                this.baseReady = true;
                this.applyVocalState();
            }

            applyVocalState() {
                if (!this.baseReady) return;
                const t = this.tracks.vocal;
                const now = this.ctx.currentTime;
                t.volumeNode.gain.setTargetAtTime(this.makeup, now, 0.01);
                const mix = vocalMix(t.enabled ? t.intensity : 0);
                const dm = distMix(this.robotLevel); 
                t.dryGain.gain.setTargetAtTime(mix.dry, now, 0.03);
                t.wetGain.gain.setTargetAtTime(mix.wet * dm.wet, now, 0.03);
                this.robotGain.gain.setTargetAtTime(mix.wet * dm.dist, now, 0.03);
            }

            setIntensity(value) { this.tracks.vocal.intensity = value; this.applyVocalState(); }
            setEcho(value) { this.echoLevel = value; this.echoFx.setLevel(value); }
            setRobot(value) { this.robotLevel = value; this.applyVocalState(); }

            getPeaks(bins) {
                const v = this.vocalBuffer.getChannelData(0), f = this.filterBuffer.getChannelData(0);
                const mix = vocalMix(this.tracks.vocal.intensity);
                const dm = distMix(this.robotLevel), rb = this.robotBuffer ? this.robotBuffer.getChannelData(0) : null;
                const len = Math.min(v.length, f.length);
                const peaks = new Float32Array(bins);
                const step = len / bins;
                let max = 0;
                for (let b = 0; b < bins; b++) {
                    const s = Math.floor(b * step), e = Math.min(len, Math.floor((b + 1) * step));
                    let pk = 0;
                    for (let i = s; i < e; i++) { const a = Math.abs(mix.dry * v[i] + mix.wet * (dm.wet * f[i] + (rb ? dm.dist * rb[i] : 0))); if (a > pk) pk = a; }
                    peaks[b] = pk; if (pk > max) max = pk;
                }
                if (max > 0) for (let b = 0; b < bins; b++) peaks[b] /= max;
                return peaks;
            }

            setTrim(start, end) {
                const d = this.duration;
                const minLen = Math.min(MIN_CUT, d);
                start = Math.max(0, Math.min(start, d - minLen));
                end = Math.min(d, Math.max(end, start + minLen));
                this.trimStart = start;
                this.trimEnd = end;
                this._scheduleStop();
            }

            _scheduleStop() {
                if (!this.isPlaying) return;
                const remain = Math.max(0, this.trimEnd - (this.ctx.currentTime - this.startTime));
                const when = this.ctx.currentTime + remain;
                [this.vocalSource, this.filterSource, this.robotSource].forEach(s => {
                    if (s) { try { s.stop(when); } catch (e) {} }
                });
            }

            play(offset = 0) {
                if (!this.vocalBuffer || !this.filterBuffer || !this.baseReady) return false;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                if (offset < this.trimStart || offset >= this.trimEnd - 0.05) offset = this.trimStart;

                this.vocalSource = this.ctx.createBufferSource();
                this.vocalSource.buffer = this.vocalBuffer;
                this.vocalSource.connect(this.tracks.vocal.dryGain);

                this.filterSource = this.ctx.createBufferSource();
                this.filterSource.buffer = this.filterBuffer;
                this.filterSource.connect(this.tracks.vocal.wetGain);

                this.robotSource = null;
                if (this.robotBuffer) {
                    this.robotSource = this.ctx.createBufferSource();
                    this.robotSource.buffer = this.robotBuffer;
                    this.robotSource.connect(this.robotGain);
                }

                this.startTime = this.ctx.currentTime - offset;
                this.vocalSource.start(0, offset);
                this.filterSource.start(0, offset);
                if (this.robotSource) this.robotSource.start(0, offset);
                this.isPlaying = true;
                this._scheduleStop();
                return true;
            }

            stop() {
                if (this.isPlaying) this.pauseTime = Math.max(0, Math.min(this.ctx.currentTime - this.startTime, this.duration));
                [this.vocalSource, this.filterSource, this.robotSource].forEach(s => {
                    if (s) { try { s.stop(); } catch (e) {} }
                });
                this.isPlaying = false;
            }

            seekTime(time) {
                if (this.isPlaying) { this.stop(); this.play(time); }
                else { this.pauseTime = time; }
            }

            seek(percent) { this.seekTime((percent / 100) * this.duration); }

            getCurrentTime() {
                if (!this.isPlaying) return this.pauseTime;
                const t = this.ctx.currentTime - this.startTime;
                if (t >= this.trimEnd) { this.stop(); this.pauseTime = this.trimStart; return this.trimStart; }
                return t;
            }

            async renderOffline(onProgress) {
                const origSr = this.originalBuffer.sampleRate;
                const sr = [44100, 48000, 32000].includes(origSr) ? origSr : 44100;
                const start = this.trimStart;
                const dur = this.trimEnd - this.trimStart;
                const len = Math.max(1, Math.round(dur * sr));
                const oc = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, len, sr);
                const master = makeMasterChain(oc);
                const v = this.tracks.vocal;
                const mix = vocalMix(v.enabled ? v.intensity : 0);

                const bus = oc.createGain();
                const fade = Math.min(EDGE_FADE, dur / 4);
                const cutAtStart = start > 0.001;
                const cutAtEnd = this.trimEnd < this.duration - 0.001;
                bus.gain.setValueAtTime(cutAtStart ? 0 : this.makeup, 0);
                if (cutAtStart) bus.gain.linearRampToValueAtTime(this.makeup, fade);
                if (cutAtEnd) {
                    bus.gain.setValueAtTime(this.makeup, dur - fade);
                    bus.gain.linearRampToValueAtTime(0, dur);
                }
                bus.connect(master);
                if (this.echoLevel > 0) { const fx = makeEchoFx(oc, this.echoLevel); bus.connect(fx.input); fx.output.connect(master); }

                const vSrc = oc.createBufferSource(); vSrc.buffer = this.vocalBuffer;
                const fSrc = oc.createBufferSource(); fSrc.buffer = this.filterBuffer;
                const dm = distMix(this.robotLevel);
                const dG = oc.createGain(); dG.gain.value = mix.dry;
                const wG = oc.createGain(); wG.gain.value = mix.wet * dm.wet;
                vSrc.connect(dG); dG.connect(bus);
                fSrc.connect(wG); wG.connect(bus);
                vSrc.start(0, start, dur);
                fSrc.start(0, start, dur);
                if (this.robotBuffer && dm.dist > 0) {
                    const rSrc = oc.createBufferSource(); rSrc.buffer = this.robotBuffer;
                    const rG = oc.createGain(); rG.gain.value = mix.wet * dm.dist;
                    rSrc.connect(rG); rG.connect(bus);
                    rSrc.start(0, start, dur);
                }

                onProgress(30, "Merender hasil final...");
                return await new Promise((resolve, reject) => {
                    oc.oncomplete = (e) => resolve(e.renderedBuffer);
                    const p = oc.startRendering();
                    if (p && p.then) p.then(resolve, reject);
                });
            }
        }

        async function encodeMp3(buffer, kbps, onProgress) {
            if (!window.lamejs) throw new Error("Encoder MP3 belum termuat. Cek internet lalu muat ulang halaman.");
            const sr = buffer.sampleRate, len = buffer.length;
            const L = buffer.getChannelData(0), R = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : L;
            let peak = 0;
            for (let i = 0; i < len; i++) { const a = Math.abs(L[i]), b = Math.abs(R[i]); if (a > peak) peak = a; if (b > peak) peak = b; }
            const gain = peak > 1 ? 0.98 / peak : 1; 
            const enc = new window.lamejs.Mp3Encoder(2, sr, kbps);
            const block = 1152 * 20, chunks = [];
            for (let i = 0, n = 0; i < len; i += block, n++) {
                const m = Math.min(block, len - i);
                const l = new Int16Array(m), r = new Int16Array(m);
                for (let j = 0; j < m; j++) {
                    const a = Math.max(-1, Math.min(1, L[i + j] * gain)), b = Math.max(-1, Math.min(1, R[i + j] * gain));
                    l[j] = a < 0 ? a * 0x8000 : a * 0x7FFF; r[j] = b < 0 ? b * 0x8000 : b * 0x7FFF;
                }
                const out = enc.encodeBuffer(l, r);
                if (out.length) chunks.push(new Uint8Array(out));
                if (n % 10 === 0) { onProgress(Math.round(i / len * 100)); await new Promise(res => setTimeout(res, 0)); }
            }
            const end = enc.flush();
            if (end.length) chunks.push(new Uint8Array(end));
            return new Blob(chunks, { type: 'audio/mpeg' });
        }

                    if (ep.kind === 'stream') {
                        const fd = new FormData();

                        init = { method: 'POST', headers: { 'Authorization': `Bearer ${key}` }, body: fd, signal };
                    } else {
                        if (!dataUrl) dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('Gagal membaca file')); fr.readAsDataURL(blob); });
                        init = { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` }, body: JSON.stringify({ base64Data: dataUrl, uploadPath: 'audio/cover-studio', fileName }), signal };
                    }
                    const res = await fetchT(ep.url, init, 120000);
                    const j = await res.json().catch(() => ({}));
                    const url = j.data && (j.data.downloadUrl || j.data.fileUrl);

                    log.push(`${ep.kind} ${ep.url}: ${j.msg || j.message || 'HTTP ' + res.status}`);
                } catch (e) {
                    if (e.name === 'AbortError' || e.fatal) throw e;

        function sniffAudio(u) {
            const t = (a, b) => String.fromCharCode(...Array.from(u.slice(a, b)));
            if (t(0, 3) === 'ID3') return 'mp3';
            if (u[0] === 0xFF && (u[1] & 0xE0) === 0xE0) return (u[1] & 0x06) === 0 ? 'aac' : 'mp3'; 
            if (t(0, 4) === 'RIFF' && t(8, 12) === 'WAVE') return 'wav';
            if (t(0, 4) === 'OggS') return 'ogg';
            if (t(0, 4) === 'fLaC') return 'flac';
            if (t(4, 8) === 'ftyp') return 'm4a';
            return 'unknown';
        }
