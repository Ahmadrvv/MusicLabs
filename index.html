    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const KIE_URL = 'https://api.kie.ai/codex/v1/responses'; 
        const KIE_TIMEOUT_MS = 150000; 
        const KIE_ATTEMPTS = [
            { model: 'gpt-6-luna', effort: 'low' },
            { model: 'gpt-6-luna', effort: 'low' }
        ];

        const KIE_SUNO_URL = 'https://api.kie.ai/api/v1/generate/upload-cover';
        const KIE_SUNO_INFO = 'https://api.kie.ai/api/v1/generate/record-info';
        const KIE_SUNO_MODEL = 'V6';
        const KIE_DEFAULT_CALLBACK = 'https://example.com/callback';
        const KIE_UPLOAD_ENDPOINTS = [
            { kind: 'stream', url: 'https://kieai.redpandaai.co/api/file-stream-upload' },
            { kind: 'base64', url: 'https://kieai.redpandaai.co/api/file-base64-upload' },
            { kind: 'base64', url: 'https://api.kie.ai/api/v1/file-base64-upload' }
        ];

        const ENGINE_STAGES = ['Mempersiapkan struktur lirik', 'Memproses audio DSP', 'Mengompresi ke format MP3', 'Mengunggah ke server', 'Menginisialisasi tugas engine', 'Engine memproses audio'];
        const STYLE_MAX = 1000;  
        const LYRICS_MAX = 5000; 
        const LIB_KEY = 'kie_library_v1';
        
        const loadLib = () => { try { const l = JSON.parse(localStorage.getItem(LIB_KEY)); if (l) return { uploads: l.uploads || [], covers: l.covers || [] }; } catch (e) {} return { uploads: [], covers: [] }; };
        const idb = (mode, fn) => new Promise((res, rej) => {
            try {
                const r = indexedDB.open('kie_cover_studio', 1);
                r.onupgradeneeded = () => r.result.createObjectStore('audio');
                r.onerror = () => rej(r.error);
                r.onsuccess = () => { const tx = r.result.transaction('audio', mode); const q = fn(tx.objectStore('audio')); tx.oncomplete = () => res(q ? q.result : undefined); tx.onerror = () => rej(tx.error); };
            } catch (e) { rej(e); }
        });
        const idbPut = (id, blob) => idb('readwrite', st => st.put(blob, id));
        const idbGet = (id) => idb('readonly', st => st.get(id));
        const idbDel = (id) => idb('readwrite', st => st.delete(id));

        const cleanKey = (k) => String(k || '').replace(/^\s*Bearer\s+/i, '').replace(/\s+/g, '');

        const fetchWithTimeout = async (url, opts = {}, ms = 15000) => {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), ms);
            try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
            finally { clearTimeout(timer); }
        };

        function extractText(data) {
            if (!data) return '';
            if (Array.isArray(data.output)) return data.output.filter(o => o && o.type === 'message').flatMap(o => Array.isArray(o.content) ? o.content : []).filter(c => c && c.type === 'output_text').map(c => c.text).join('');
            if (Array.isArray(data.content)) return data.content.filter(b => b && b.type === 'text').map(b => b.text).join('');
            if (typeof data.content === 'string') return data.content;
            const c = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
            if (typeof c === 'string') return c;
            if (data.data && typeof data.data === 'object') return extractText(data.data);
            return '';
        }

        const FORMAT_PROMPT = `You are an expert lyric formatter specializing in preparing song lyrics for Suno AI music generation. Your primary task is to transform user-provided lyrics into a Suno-friendly format with clear song sections and syllable separation to help improve vocal pronunciation.

MAIN OBJECTIVE
Whenever the user sends song lyrics, immediately process them and return the formatted lyrics. Do not ask follow-up questions unless the input is genuinely impossible to interpret.

RULES
1. PRESERVE THE ORIGINAL LYRICS
- Preserve the original language, meaning, words, and lyrical content.
- Do not translate, paraphrase, rewrite, or add new lyrical lines.
- Preserve the original order of all lyrics.

2. SYLLABLE SEPARATION
- Separate words into natural syllables using hyphens (e.g., ke-pa-la, lu-tut).
- Keep words that are already monosyllabic intact.

3. SONG SECTION LABELS
Use English section labels in square brackets: [Intro], [Verse 1], [Chorus], [Bridge], [Outro].
Keep section labels separate from the lyrics.

4. OUTPUT FORMAT
- Put each lyric line on its own line.
- Return only the completed, formatted lyrics in a single copy-ready block.
- Do not provide an introduction or explanation.

PRIORITY
Accuracy and preservation of the original lyrics come first.`;

        const buildFormatPrompt = (lyrics) => FORMAT_PROMPT + '\n\nLYRICS:\n' + lyrics;

        const estFormatted = (t) => {
            const x = String(t || '').trim(); if (!x) return 0;
            const hy = (x.match(/[A-Za-z\u00C0-\u00FF]+/g) || []).reduce((n, w) => n + Math.max(0, (w.match(/[aeiouyAEIOUY]+/g) || []).length - 1), 0);
            return x.length + hy;
        };

        const hash36 = (str) => { let a = 5381, b = 2166136261; for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); a = ((a << 5) + a + c) | 0; b = Math.imul(b ^ c, 16777619); } return (a >>> 0).toString(36) + (b >>> 0).toString(36); };

        const VOCAL_AGES = [
            { id: 'child', l: 'Anak-anak', tags: ['child-like playful voice', 'kids vocals'] },
            { id: 'teen', l: 'Remaja', tags: ['youthful', 'bright'] },
            { id: 'adult', l: 'Dewasa', tags: [] },
            { id: 'mature', l: 'Dewasa matang', tags: ['mature voice'] }
        ];
        const VOCAL_RANGES = { f: ['soprano', 'mezzo-soprano', 'alto'], m: ['tenor', 'baritone', 'bass'] };
        const VOCAL_TRAITS = [
            ['warm', 'Hangat', 'warm tone'], ['smooth', 'Halus', 'smooth delivery'], ['bright', 'Cerah', 'bright tone'],
            ['soft', 'Lembut', 'soft intimate delivery'], ['breathy', 'Breathy', 'breathy'], ['airy', 'Airy', 'airy'],
            ['silky', 'Silky', 'silky'], ['ethereal', 'Ethereal', 'ethereal'], ['raspy', 'Serak', 'raspy'],
            ['husky', 'Husky', 'husky'], ['gritty', 'Kasar', 'gritty'], ['powerful', 'Bertenaga', 'powerful belting'],
            ['soulful', 'Soulful', 'soulful'], ['falsetto', 'Falsetto', 'natural falsetto']
        ].map(([id, l, tag]) => ({ id, l, tag }));
        
        const V_GENTLE = ['soft', 'breathy', 'airy', 'silky', 'ethereal'], V_STRONG = ['powerful', 'gritty', 'raspy'], V_YOUNG_BLOCK = ['sultry', 'husky', 'gritty', 'raspy'];
        const vocalConflict = (a, b) => (V_GENTLE.includes(a) && V_STRONG.includes(b)) || (V_STRONG.includes(a) && V_GENTLE.includes(b));
        const traitBlocked = (id, v) => {
            if (v.traits.includes(id)) return false;
            if (v.traits.length >= 2) return true; 
            if (v.traits.some(t => vocalConflict(t, id))) return true;
            if (['child', 'teen'].includes(v.age) && V_YOUNG_BLOCK.includes(id)) return true;
            if (id === 'falsetto' && v.genders.length === 1 && v.genders[0] === 'f') return true;
            return false;
        };

        function vocalTagList(v) {
            if (!v || !v.genders.length) return [];
            const t = [v.genders.length === 2 ? 'male and female duet vocals' : (v.genders[0] === 'f' ? 'female vocals' : 'male vocals')];
            const age = VOCAL_AGES.find(a => a.id === v.age); if (age) t.push(...age.tags);
            if (v.range) t.push(`${v.range} vocals`);
            v.traits.forEach(id => { const x = VOCAL_TRAITS.find(y => y.id === id); if (x) t.push(x.tag); });
            return [...new Set(t)];
        }

        function composeStyle(raw, tags) {
            const base = String(raw || '').trim(), low = base.toLowerCase();
            const miss = (tags || []).filter(t => !low.includes(t.toLowerCase()));
            return [...miss, base].filter(Boolean).join(', ').slice(0, STYLE_MAX);
        }

        function parseLyricsResponse(raw) {
            let text = String(raw || '').trim();
            text = text.replace(/^```[a-zA-Z]*\s*/, '').replace(/\s*```$/, '').trim();
            if (text.startsWith('{')) {
                try {
                    const o = JSON.parse(text);
                    const v = o && (o.lyrics ?? o.lirik ?? o.text);
                    if (typeof v === 'string' && v.trim()) text = v.trim();
                } catch (e) {}
            }
            text = text.replace(/\r/g, '').replace(/[ \t]+\n/g, '\n');
            text = text.replace(/([^\n])[ \t]*(\[(?:Intro|Verse|Pre-?Chorus|Post-?Chorus|Final Chorus|Chorus|Hook|Bridge|Instrumental|Interlude|Break|Solo|Outro|End)[^\]\n]{0,30}\])/gi, '$1\n$2');
            text = text.replace(/^([ \t]*\[[^\]\n]{1,40}\])[ \t]+(?=\S)/gm, '$1\n');
            text = text.replace(/([^\n])\n(\[[^\]\n]{1,40}\])/g, '$1\n\n$2');
            text = text.replace(/([^\n])\n(\[[^\]\n]{1,40}\])/g, '$1\n\n$2'); 
            return text.replace(/\n{3,}/g, '\n\n').trim();
        }

        function buildStylePrompt(style, o) {
            const tags = o.tags || [];
            const vocalRule = tags.length
                ? `VOCAL: the app itself puts these vocal tags at the very start of the final style: "${tags.join(', ')}". Do NOT write any vocal descriptor in your output (no gender, age, range, vocal timbre, "vocals", "voice", duet, choir) and ignore vocal statements in the user description; the chosen vocal wins.`
                : 'VOCAL: no vocal was chosen. Add exactly ONE clear vocal descriptor right after the genre (for example "warm female vocals") that fits the description and the lyric language.';
            return [
                'You are a music production prompt specialist. Convert the user description into a concise STYLE prompt for an Upload & Cover task.',
                '',
                `USER DESCRIPTION: ${style}`,
                `LYRIC SNIPPET: ${String(o.lyrics || '').replace(/\s+/g, ' ').slice(0, 400) || '(empty: follow the language of the description)'}`,
                vocalRule,
                '',
                'RULES:',
                '- Plain comma-separated descriptors, never sentences.',
                '- Order: genre, energy/tempo, mood, 2-3 key instruments, production texture.',
                '- Total 4-7 descriptors max.',
                `LENGTH: 120-350 characters, hard maximum ${Math.max(100, STYLE_MAX - tags.join(', ').length - 2)}. Write in English.`,
                'OUTPUT: valid JSON {"style": "..."} only, no other text, no markdown.'
            ].join('\n');
        }

        function parseStyleResponse(raw) {
            const t = String(raw || '').replace(/```json|```/gi, '').trim();
            const m = t.match(/\{[\s\S]*\}/);
            if (m) {
                try { const o = JSON.parse(m[0]); if (o && o.style) return String(o.style).trim(); } catch (e) {}
                const r = m[0].match(/"style"\s*:\s*"([\s\S]*?)"\s*\}/);
                if (r) return r[1].replace(/\\"/g, '"').replace(/\\n/g, ' ').trim();
            }
            return t.replace(/^style\s*:\s*/i, '').replace(/\s*\n\s*/g, ' ').trim();
        }

        function makeDistCurve(amount) {
            let k = amount, n = 44100, curve = new Float32Array(n), deg = Math.PI / 180;
            for (let i = 0; i < n; ++i) {
                let x = (i * 2 / n) - 1;
                curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        function makeCrushCurve(bits) {
            let n = 44100, curve = new Float32Array(n);
            let steps = Math.pow(2, bits);
            for(let i=0; i<n; i++) {
                let x = (i * 2 / n) - 1;
                curve[i] = Math.round(x * steps) / steps;
            }
            return curve;
        }

        function buildEffectChain(ctx, activeDistortions) {
            let input = ctx.createGain();
            let current = input;
            let nodes = [input];
            const dists = [...activeDistortions].sort((a,b) => a - b);

            dists.forEach(d => {
                let fxIn = ctx.createGain(), fxOut = ctx.createGain();
                current.connect(fxIn);
                if (d === 1) { let ws = ctx.createWaveShaper(); ws.curve = makeDistCurve(50); fxIn.connect(ws); ws.connect(fxOut); nodes.push(ws); }
                else if (d === 2) { let ws = ctx.createWaveShaper(); ws.curve = makeDistCurve(400); fxIn.connect(ws); ws.connect(fxOut); nodes.push(ws); }
                else if (d === 3) { let ws = ctx.createWaveShaper(); ws.curve = makeCrushCurve(4); fxIn.connect(ws); ws.connect(fxOut); nodes.push(ws); }
                nodes.push(fxIn, fxOut);
                current = fxOut;
            });
            let output = ctx.createGain(); current.connect(output); nodes.push(output);
            return { input, output, nodes };
        }

        class AudioEngine {
            constructor() {
                this.ctx = null; 
                this.originalBuffer = null;
                this.vocalBuffer = null;
                this.musicBuffer = null;
                this.duration = 0;
                this.isPlaying = false;
                this.isMono = false;
                this.loadedKey = null;
                this.vocalSource = null;
                this.musicSource = null;
                this.startTime = 0;
                this.pauseTime = 0;
                this.tracks = {
                    vocal: { muted: false, volume: 1, activeDistortions: [], activeLevel: null, volumeNode: null, effectNodes: [] },
                    music: { muted: false, volume: 1, activeDistortions: [], activeLevel: null, volumeNode: null, effectNodes: [] }
                };
            }

            initCtx() {
                if(!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.connect(this.ctx.destination);
                    this.vocalAnalyser = this.ctx.createAnalyser();
                    this.musicAnalyser = this.ctx.createAnalyser();
                    this.vocalAnalyser.fftSize = 256;
                    this.musicAnalyser.fftSize = 256;
                    this.vocalAnalyser.connect(this.masterGain);
                    this.musicAnalyser.connect(this.masterGain);
                }
                if(this.ctx.state === 'suspended') this.ctx.resume();
            }

            static fileKey(file) { return `${file.name}|${file.size}|${file.lastModified}`; }

            async loadAudio(file, onProgress = () => {}) {
                this.initCtx();
                const key = AudioEngine.fileKey(file);
                if (this.loadedKey === key && this.vocalBuffer && this.musicBuffer) {
                    onProgress(100, "Selesai");
                    return;
                }
                this.stop();
                this.pauseTime = 0;
                this.loadedKey = null;
                this.originalBuffer = this.vocalBuffer = this.musicBuffer = null;

                onProgress(10, "Membaca file audio...");
                const arrayBuffer = await file.arrayBuffer();
                onProgress(40, "Mendekode data audio...");
                this.originalBuffer = await new Promise((resolve, reject) => {
                    const p = this.ctx.decodeAudioData(arrayBuffer, resolve, reject);
                    if (p && p.catch) p.catch(reject);
                });
                this.duration = this.originalBuffer.duration;
                this.isMono = this.originalBuffer.numberOfChannels < 2;
                onProgress(70, "Memisahkan stems (Simulasi L/R)...");
                this.splitAudio();
                onProgress(90, "Menyiapkan engine DSP...");
                this.initBaseNodes();
                this.loadedKey = key;
                onProgress(100, "Selesai");
            }

            splitAudio() {
                const sr = this.originalBuffer.sampleRate, len = this.originalBuffer.length;
                this.vocalBuffer = this.ctx.createBuffer(1, len, sr);
                this.musicBuffer = this.ctx.createBuffer(2, len, sr);
                const L = this.originalBuffer.getChannelData(0);
                const R = this.originalBuffer.numberOfChannels > 1 ? this.originalBuffer.getChannelData(1) : L;
                const vocData = this.vocalBuffer.getChannelData(0);
                const musL = this.musicBuffer.getChannelData(0), musR = this.musicBuffer.getChannelData(1);

                for (let i = 0; i < len; i++) {
                    vocData[i] = (L[i] + R[i]) * 0.5;
                    musL[i] = L[i] - vocData[i];
                    musR[i] = R[i] - vocData[i];
                }
            }

            initBaseNodes() {
                ['vocal', 'music'].forEach(name => {
                    const track = this.tracks[name];
                    const first = !track.volumeNode;
                    if (first) track.volumeNode = this.ctx.createGain();
                    track.volumeNode.gain.value = track.muted ? 0 : track.volume;
                    if (first) this.rebuildTrackEffects(name);
                });
            }

            rebuildTrackEffects(trackName) {
                const track = this.tracks[trackName];
                if (track.effectNodes) track.effectNodes.forEach(n => { try { n.disconnect(); if (n.stop) n.stop(); } catch(e) {} });
                const chain = buildEffectChain(this.ctx, track.activeDistortions);
                track.effectNodes = chain.nodes;
                track.volumeNode.disconnect();
                track.volumeNode.connect(chain.input);
                chain.output.connect(trackName === 'vocal' ? this.vocalAnalyser : this.musicAnalyser);
            }

            setTrackVolume(trackName, volume, muted) {
                this.tracks[trackName].volume = volume;
                this.tracks[trackName].muted = muted;
                if (this.tracks[trackName].volumeNode) {
                    this.tracks[trackName].volumeNode.gain.value = muted ? 0 : volume;
                }
            }

            setDistortionLevel(trackName, level) {
                const track = this.tracks[trackName];
                track.activeLevel = (track.activeLevel === level) ? null : level;
                if(track.activeLevel === null) track.activeDistortions = [];
                else if (level === 'low') track.activeDistortions = [1];
                else if (level === 'medium') track.activeDistortions = [2];
                else if (level === 'hard') track.activeDistortions = [3];
                if (track.volumeNode) this.rebuildTrackEffects(trackName);
                return track.activeLevel;
            }

            stopSources() {
                ['vocalSource', 'musicSource'].forEach(k => {
                    if (this[k]) {
                        try { this[k].stop(); } catch(e) {}
                        try { this[k].disconnect(); } catch(e) {}
                        this[k] = null;
                    }
                });
            }

            play(offset = 0) {
                if (!this.vocalBuffer || !this.musicBuffer || !this.tracks.vocal.volumeNode) return false;
                this.initCtx();
                this.stopSources(); 
                if (!(offset >= 0) || offset >= this.duration) offset = 0;
                this.vocalSource = this.ctx.createBufferSource(); this.vocalSource.buffer = this.vocalBuffer;
                this.vocalSource.connect(this.tracks.vocal.volumeNode);
                this.musicSource = this.ctx.createBufferSource(); this.musicSource.buffer = this.musicBuffer;
                this.musicSource.connect(this.tracks.music.volumeNode);
                this.startTime = this.ctx.currentTime - offset;
                this.vocalSource.start(0, offset); this.musicSource.start(0, offset);
                this.isPlaying = true;
                return true;
            }

            stop() {
                if (this.isPlaying && this.ctx) {
                    this.pauseTime = Math.max(0, Math.min(this.ctx.currentTime - this.startTime, this.duration));
                }
                this.stopSources();
                this.isPlaying = false;
            }

            seek(percent) {
                const time = Math.max(0, Math.min(100, percent)) / 100 * this.duration;
                if (this.isPlaying) { this.stop(); this.play(time); }
                else { this.pauseTime = time; }
            }

            getCurrentTime() {
                if (!this.isPlaying || !this.ctx) return this.pauseTime;
                const t = this.ctx.currentTime - this.startTime;
                if (t >= this.duration) { this.stopSources(); this.isPlaying = false; this.pauseTime = 0; return 0; }
                return t;
            }
        }

        async function renderDspBuffer(eng) {
            if (!eng.vocalBuffer || !eng.musicBuffer) throw new Error("Audio DSP belum dimuat");
            const origSr = eng.originalBuffer.sampleRate;
            const sr = [44100, 48000, 32000].includes(origSr) ? origSr : 44100; 
            const len = Math.ceil(eng.duration * sr);
            const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
            const off = new OAC(2, len, sr);
            const master = off.createGain(); master.connect(off.destination);
            [['vocal', eng.vocalBuffer], ['music', eng.musicBuffer]].forEach(([name, buf]) => {
                const t = eng.tracks[name];
                const src = off.createBufferSource(); src.buffer = buf;
                const vol = off.createGain(); vol.gain.value = t.muted ? 0 : t.volume;
                src.connect(vol);
                const chain = buildEffectChain(off, t.activeDistortions); 
                vol.connect(chain.input); chain.output.connect(master);
                src.start(0);
            });
            return await new Promise((resolve, reject) => {
                off.oncomplete = (e) => resolve(e.renderedBuffer); 
                const p = off.startRendering();
                if (p && p.then) p.then(resolve, reject);
            });
        }

        async function encodeMp3(buffer, kbps, onProgress) {
            if (!window.lamejs) throw new Error("Encoder MP3 (lamejs) belum termuat. Cek internet lalu muat ulang halaman.");
            const sr = buffer.sampleRate, len = buffer.length;
            const L = buffer.getChannelData(0), R = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : L;
            let peak = 0;
            for (let i = 0; i < len; i++) { const a = Math.abs(L[i]), b = Math.abs(R[i]); if (a > peak) peak = a; if (b > peak) peak = b; }
            const gain = peak > 1 ? 0.98 / peak : 1; 
            const enc = new window.lamejs.Mp3Encoder(2, sr, kbps);
            const block = 1152 * 20, chunks = [];
            for (let i = 0, n = 0; i < len; i += block, n++) {
                const m = Math.min(block, len - i);
                const l = new Int16Array(m), r = new Int16Array(m);
                for (let j = 0; j < m; j++) {
                    const a = Math.max(-1, Math.min(1, L[i + j] * gain)), b = Math.max(-1, Math.min(1, R[i + j] * gain));
                    l[j] = a < 0 ? a * 0x8000 : a * 0x7FFF; r[j] = b < 0 ? b * 0x8000 : b * 0x7FFF;
                }
                const out = enc.encodeBuffer(l, r);
                if (out.length) chunks.push(new Uint8Array(out));
                if (n % 10 === 0) { onProgress(Math.round(i / len * 100)); await new Promise(res => setTimeout(res, 0)); }
            }
            const end = enc.flush();
            if (end.length) chunks.push(new Uint8Array(end));
            return new Blob(chunks, { type: 'audio/mpeg' });
        }

        async function kieUploadAudio(blob, fileName, key, signal) {
            const log = [];
            let dataUrl = null;
            for (const ep of KIE_UPLOAD_ENDPOINTS) {
                try {
                    let init;
                    if (ep.kind === 'stream') {
                        const fd = new FormData();
                        fd.append('file', blob, fileName); fd.append('uploadPath', 'audio/cover-studio'); fd.append('fileName', fileName);
                        init = { method: 'POST', headers: { 'Authorization': `Bearer ${key}` }, body: fd, signal };
                    } else {
                        if (!dataUrl) dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('Gagal membaca file')); fr.readAsDataURL(blob); });
                        init = { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` }, body: JSON.stringify({ base64Data: dataUrl, uploadPath: 'audio/cover-studio', fileName }), signal };
                    }
                    const res = await fetch(ep.url, init);
                    const j = await res.json().catch(() => ({}));
                    const url = j.data && (j.data.downloadUrl || j.data.fileUrl);
                    if (res.ok && url) return url;
                    if (res.status === 401 || res.status === 402 || Number(j.code) === 401 || Number(j.code) === 402) throw Object.assign(new Error(j.msg || 'API key ditolak / kredit habis'), { fatal: true });
                    log.push(`${ep.kind} ${ep.url}: ${j.msg || j.message || 'HTTP ' + res.status}`);
                } catch (e) {
                    if (e.name === 'AbortError' || e.fatal) throw e;
                    log.push(`${ep.kind} ${ep.url}: ${e.message}`);

        }

                    if (style) body.style = style;
                    const submit = async (b) => {
                        const res = await fetch(KIE_SUNO_URL, { method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'application/json', ...auth }, body: JSON.stringify(b) });
                        return { res, j: await res.json().catch(() => ({})) };
                    };
                    let { res, j } = await submit(body);
                    if (!(res.ok && Number(j.code) === 200 && j.data && j.data.taskId) && /customMode/i.test(j.msg || '')) ({ res, j } = await submit({ ...body, customMode: true }));
                    if (!(res.ok && Number(j.code) === 200 && j.data && j.data.taskId)) {
                        throw new Error(`Engine menolak tugas: ${j.msg || j.message || 'HTTP ' + res.status} (code ${j.code || res.status})`);
                    }
                    taskId = j.data.taskId;

                    const t0 = Date.now(); let fails = 0, polls = 0, tracks = []; setStage(6);
                    const FAILED = ['CREATE_TASK_FAILED', 'GENERATE_AUDIO_FAILED', 'SENSITIVE_WORD_ERROR'];
                    while (true) {
                        chk();
                        if (Date.now() - t0 > 600000) throw new Error(`Melebihi batas waktu maksimal pemrosesan. Referensi Task ID: ${taskId}`);
                        await new Promise(r => setTimeout(r, 5000)); chk();
                        let info;
                        try {
                            const r = await fetch(`${KIE_SUNO_INFO}?taskId=${encodeURIComponent(taskId)}`, { headers: auth, signal: ctrl.signal });
                            const d = await r.json().catch(() => ({}));
                            if (!r.ok || Number(d.code) !== 200) {
                                if ([401, 402, 403].includes(r.status) || [401, 402, 403].includes(Number(d.code))) throw Object.assign(new Error(d.msg || 'Sesi tidak valid'), { fatal: true });
                                throw new Error(d.msg || `HTTP ${r.status}`);
                            }
                            info = d.data || {}; fails = 0;
                        } catch (e) {
                            if (e.name === 'AbortError' || e.fatal || ++fails > 5) throw e;
                            continue; 
                        }
                        const status = info.status || '';
                        const list = (info.response && (info.response.sunoData || info.response.data)) || [];
                        const labels = { PENDING: 'Dalam antrean pemrosesan', TEXT_SUCCESS: 'Menganalisis komposisi vokal & lirik', FIRST_SUCCESS: 'Tahap pertama selesai, memproses penyempurnaan' };
                        setProcessMsg(`${labels[status] || 'Engine sedang menyintesis audio'}... (${status || 'PENDING'})\nPemantauan tahap ke-${++polls}${Date.now() - t0 > 150000 ? '\nLalu lintas engine padat, ini adalah hal yang wajar.' : ''}`);
                        if (mode === 'check' && ['TEXT_SUCCESS', 'FIRST_SUCCESS', 'SUCCESS'].includes(status)) break;
                        if (status === 'SUCCESS') { tracks = list; break; }
                        if (status === 'CALLBACK_EXCEPTION' && list.some(x => x.audio_url || x.source_audio_url)) { tracks = list; break; }
                        if (FAILED.includes(status) || status === 'CALLBACK_EXCEPTION') {
                            throw Object.assign(new Error(`Tugas gagal: ${info.errorMessage || status}`), { raw: `status: ${status}\n${info.errorMessage || ''}` });
                        }
                    }

                    if (mode === 'check') {
                        const blob = dspBlobRef.current;
                        const id = 'u' + Date.now();
                        let saved = false;
                        try { if (blob) { await idbPut(id, blob); saved = true; } } catch (e) {}
                        if (saved) {
                            const name = audioFile.name;
                            lib.uploads.filter(x => x.name === name).forEach(x => idbDel(x.id).catch(() => {}));
                            setLib(l => ({ ...l, uploads: [{ id, name, size: blob.size, duration: dur || engine.duration, lyrics: lyricsText, sig: audioSig(), date: Date.now() }, ...l.uploads.filter(x => x.name !== name)] }));
                            setLibId(id);
                        }
                        setStep(4);
                        return;
                    }
                    
                    const results = tracks.map((x, i) => ({
                        id: x.id || i, title: x.title || `Variant ${i + 1}`,
                        url: x.audio_url || x.source_audio_url || x.stream_audio_url || '',
                        image: x.image_url || x.source_image_url || '', duration: x.duration
                    })).filter(x => x.url);
                    if (!results.length) throw new Error(`Pemrosesan tuntas tanpa menghasilkan output audio. Task ID: ${taskId}`);
                    setCoverResults(results);
                    setLib(l => ({ ...l, covers: [...results.map(r => ({ ...r, id: 'c' + Date.now() + '-' + r.id, source: audioFile.name, style: config.style || '', sig, date: Date.now() })), ...l.covers] }));
                    setLibTab('covers');
                    showToast(`Sintesis berhasil diselesaikan: ${results.length} varian audio.`, "success");
                } catch (e) {
                    console.error(e);
                    if (cancelledRef.current || e.name === 'AbortError') showToast("Proses dibatalkan oleh pengguna", "info");
                    else {
                        const cr = /copyright|existing work|matches|sensitive|lyric|hak cipta/i.test(`${e.message} ${e.raw || ''}`);
                        const chkMode = mode === 'check';
                        setSunoErr(cr ? {
                            kind: 'copyright', title: 'Terindikasi Konflik Hak Cipta',
                            msg: chkMode ? 'Sistem mendeteksi adanya kemiripan dengan karya yang telah dilindungi. Silakan gunakan aset audio alternatif.' : 'Konten teridentifikasi melanggar standar pedoman sistem (indikasi hak cipta). Pertimbangkan untuk mengubah lirik atau audio.',
                            raw: e.raw || e.message, back: chkMode ? 1 : 4, backLabel: chkMode ? 'Ubah Referensi Audio' : 'Sesuaikan Lirik'
                        } : { kind: 'error', title: 'Kesalahan Sistem', msg: e.message || 'Gagal menghasilkan output', raw: e.detail || (taskId ? `Task ID: ${taskId}` : '') });
                        showToast(e.message || "Proses dibatalkan secara internal", "error");
                    }
                } finally {
                    abortRef.current = null;
                    setStage(0);
                    setIsProcessing(false);
                    checkKieLater(); 
                }
            };

            const sunoErrPanel = sunoErr && (
                <div className={`rounded-md border p-4 text-xs ${sunoErr.kind === 'copyright' ? 'border-amber-500/30 bg-amber-500/10 text-amber-200' : 'border-ml-danger/30 bg-ml-danger/10 text-red-300'}`}>
                    <div className="font-semibold mb-2"><i className="fa-solid fa-triangle-exclamation mr-1.5"></i>{sunoErr.title}</div>
                    <div className="leading-relaxed opacity-90">{sunoErr.msg}</div>
                    {sunoErr.raw && <pre className="mt-3 p-2 bg-[#000000] border border-ml-border rounded font-mono text-[10px] opacity-70 whitespace-pre-wrap break-words select-text">Log Sistem: {sunoErr.raw}</pre>}
                    {sunoErr.back && <button onClick={() => { setSunoErr(null); setStep(sunoErr.back); }} className="mt-4 px-4 py-2 rounded-md bg-white text-black font-semibold hover:bg-zinc-200 transition-colors">{sunoErr.backLabel}</button>}
                </div>
            );

            const useLibUpload = async (it) => {
                let blob = null; try { blob = await idbGet(it.id); } catch (e) {}
                if (!blob) return showToast("File audio tidak ditemukan di penyimpanan lokal perangkat", "error");
                engine.stop(); setIsPlaying(false); setCurrentTime(0);
                const f = new File([blob], `${String(it.name || 'Project').replace(/\.[^.]+$/, '')}.mp3`, { type: blob.type || 'audio/mpeg' });
                dspBlobRef.current = blob;           
                setAudioFile(f); setAudioDuration(it.duration || 0);
                setLyricsText(it.lyrics || ''); setLyricsHistory([]); setLastAction('');
                setCoverResults([]); setSunoErr(null); setErrorDetail(''); setUploadedUrl('');
                setLibMode(true); setLibId(it.id);
                setAppMode('cover'); setStep(4);          
            };

            const [dlBusy, setDlBusy] = useState('');
            const downloadResult = async (it) => {
                if (dlBusy || !it.url) return;
                setDlBusy(it.id);
                const base = String(it.title || 'Musiclabs_Output').replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, '_').trim().slice(0, 80) || 'Audio';
                
                const saveAsMp3 = (blobBytes) => {
                    const blob = new Blob([blobBytes], { type: 'audio/mpeg' });
                    const obj = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = obj; a.download = `${base}.mp3`; a.style.display = 'none';
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(obj), 60000);
                    return `${base}.mp3`;
                };

                try {
                    const res = await fetch(it.url);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const ab = await res.arrayBuffer();
                    if (!ab.byteLength) throw new Error('Berkas kosong');
                    
                    const t = (a, b) => String.fromCharCode(...Array.from(new Uint8Array(ab).slice(a, b)));
                    const u = new Uint8Array(ab, 0, Math.min(16, ab.byteLength));
                    let kind = 'unknown';
                    if (t(0, 3) === 'ID3' || (u[0] === 0xFF && (u[1] & 0xE0) === 0xE0)) kind = 'mp3';
                    
                    if (kind === 'mp3') {
                        showToast('Menyimpan: ' + saveAsMp3(ab), 'success');
                    } else {
                        showToast('Memaksa konversi format ke MP3 standar...', 'info');
                        try {
                            const AC = window.AudioContext || window.webkitAudioContext;
                            const ctx = new AC();
                            let abuf; try { abuf = await ctx.decodeAudioData(ab.slice(0)); } finally { try { ctx.close(); } catch (e) {} }
                            const mp3 = await encodeMp3(abuf, 192, () => {});
                            showToast('Menyimpan: ' + saveAsMp3(mp3), 'success');
                        } catch (ce) { 
                            console.error("Konversi gagal, memaksa penyimpanan dengan ekstensi mp3", ce);
                            saveAsMp3(ab);
                            showToast('Disimpan sebagai MP3', 'success');
                        }
                    }
                } catch (e) {
                    console.error("Unduhan langsung diblokir (CORS)", e);
                    showToast('Membuka tautan sumber. Silakan pastikan ekstensi berkas yang tersimpan adalah .mp3', 'info');
                    const a = document.createElement('a');
                    a.href = it.url;
                    a.download = `${base}.mp3`;
                    a.target = '_blank';
                    a.rel = 'noopener';
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } finally {
                    setDlBusy('');
                }
            };
            const delLib = (kind, it) => {
                if (!window.confirm('Tindakan ini akan menghapus aset selamanya. Lanjutkan?')) return;
                if (kind === 'uploads') idbDel(it.id).catch(() => {});
                setLib(l => ({ ...l, [kind]: l[kind].filter(x => x.id !== it.id) }));
            };

            const togglePlay = () => {
                if (engine.isPlaying) { engine.stop(); setIsPlaying(false); setCurrentTime(engine.getCurrentTime()); } 
                else {
                    const ok = engine.play(engine.getCurrentTime());
                    setIsPlaying(!!ok);
                    if (!ok) showToast("Aset audio belum siap untuk dimuat", "error");
                }
            };

            const handleSeek = (e) => {
                engine.seek(parseFloat(e.target.value));
                setCurrentTime(engine.getCurrentTime());
            };

            const setVolume = (trackName, vol) => {
                engine.setTrackVolume(trackName, vol, tracksState[trackName].muted);
                setTracksState(prev => ({ ...prev, [trackName]: { ...prev[trackName], volume: vol } }));
            };

            const toggleMute = (trackName) => {
                const newMute = !tracksState[trackName].muted;
                engine.setTrackVolume(trackName, tracksState[trackName].volume, newMute);
                setTracksState(prev => ({ ...prev, [trackName]: { ...prev[trackName], muted: newMute } }));
            };

            const setDistortion = (trackName, level) => {
                const activeLvl = engine.setDistortionLevel(trackName, level);
                setTracksState(prev => ({ ...prev, [trackName]: { ...prev[trackName], activeLevel: activeLvl } }));
            };

            const styleBox = (
                <div className="bg-ml-panel border border-ml-border rounded-lg p-5 flex flex-col gap-4">
                    <div className="flex items-center justify-between">
                        <h3 className="font-semibold tracking-wide text-white flex items-center gap-2"><i className="fa-solid fa-sliders text-zinc-400"></i> Parameter Komposisi</h3>
                        <span className="text-[10px] font-mono text-ml-muted">{style.length}/1000</span>
                    </div>
                    <p className="text-xs text-ml-muted leading-relaxed">Deskripsikan aransemen musikal yang diinginkan secara detail (genre, instrumen utama, mood). Anda dapat menggunakan bahasa Indonesia untuk kemudahan.</p>
                    <textarea value={style} onChange={e => setStyle(e.target.value)} readOnly={optimizing} rows={3} maxLength={1000} placeholder="Contoh: Pop akustik yang menenangkan, piano melankolis, tempo santai" className="w-full bg-[#000000] border border-ml-border rounded-md p-3 text-sm text-white focus:border-zinc-500 transition-colors outline-none resize-y" />
                    <div className="flex items-center gap-3">
                        <button onClick={optimizeStyle} disabled={!style.trim() || optimizing} className="flex-1 bg-white text-black py-2.5 rounded-md text-sm font-semibold hover:bg-zinc-200 transition-colors disabled:opacity-40">{optimizing ? <><i className="fa-solid fa-circle-notch fa-spin mr-2"></i>Menyelaraskan Parameter...</> : <><i className="fa-solid fa-wand-magic-sparkles mr-2"></i>Optimalkan Deskripsi</>}</button>
                        {prevStyle !== null && <button onClick={() => { setStyle(prevStyle); setPrevStyle(null); }} className="text-[11px] font-mono text-zinc-400 hover:text-white transition-colors">Batal</button>}
                    </div>
                    <div className="border-t border-ml-border pt-4 flex flex-col gap-4">
                        <div className="text-[10px] font-mono text-ml-muted tracking-wider uppercase">Atribut Vokal (Statis)</div>
                        <div>
                            <div className="text-[11px] text-ml-muted mb-2">Konfigurasi Gender (Pilih keduanya untuk Duet)</div>
                            <div className="flex gap-2">{[{ id: 'f', l: 'Perempuan' }, { id: 'm', l: 'Laki-laki' }].map(o => <Chip key={o.id} on={vocal.genders.includes(o.id)} onClick={() => toggleGender(o.id)}>{o.l}</Chip>)}</div>
                        </div>
                        {vocal.genders.length > 0 && (<>
                            <div>
                                <div className="text-[11px] text-ml-muted mb-2">Karakteristik Usia</div>
                                <div className="flex flex-wrap gap-2">{VOCAL_AGES.map(a => <Chip key={a.id} on={vocal.age === a.id} onClick={() => pickAge(a.id)}>{a.l}</Chip>)}</div>
                            </div>
                            {vocal.genders.length === 1 && vocal.age !== 'child' && (
                                <div>
                                    <div className="text-[11px] text-ml-muted mb-2">Jangkauan Nada</div>
                                    <div className="flex flex-wrap gap-2">{VOCAL_RANGES[vocal.genders[0]].map(r => <Chip key={r} on={vocal.range === r} onClick={() => pickRange(r)}>{r}</Chip>)}</div>
                                </div>
                            )}
                            <div>
                                <div className="text-[11px] text-ml-muted mb-2">Timbre Spesifik (Maksimal 2 seleksi komplementer)</div>
                                <div className="flex flex-wrap gap-2">{VOCAL_TRAITS.map(t => <Chip key={t.id} on={vocal.traits.includes(t.id)} disabled={traitBlocked(t.id, vocal)} onClick={() => toggleTrait(t.id)}>{t.l}</Chip>)}</div>
                            </div>
                        </>)}
                        <div className="mt-2 rounded-md bg-[#000000] border border-ml-border p-3 text-[11px] font-mono break-words select-text">
                            <div className="text-zinc-500 mb-1">Payload Sistem Terenkapsulasi ({composeStyle(style, vocalTags).length}/{STYLE_MAX})</div>
                            <div className="text-zinc-300">{composeStyle(style, vocalTags) || '-'}</div>
                        </div>
                    </div>
                </div>
            );

            const SONG_KIND_LABEL = { cover: 'Aransemen', song: 'Sintesis Instrumental', instrumental: 'Sintesis Instrumental' };

            const renderLibrary = () => {
                const combinedList = [
                    ...lib.uploads.map(x => ({ ...x, _libType: 'uploads' })),
                    ...lib.covers.map(x => ({ ...x, _libType: 'covers' }))
                ].sort((a,b) => b.date - a.date);

                return (
                    <div className="flex flex-col gap-4 animate-fade-in pb-10">
                        <div className="flex items-center justify-between mt-8 mb-2">
                            <h2 className="text-lg font-bold tracking-tight text-white">Library Penyimpanan</h2>
                            <div className="flex gap-1 bg-ml-panel border border-ml-border p-1 rounded-md">
                                {[{ id: 'covers', l: 'Proyek Selesai' }, { id: 'uploads', l: 'Referensi Mentah' }].map(t => (
                                    <button key={t.id} onClick={() => setLibTab(t.id)} className={`px-4 py-1.5 text-[11px] font-semibold rounded ${libTab === t.id ? 'bg-white text-black' : 'text-ml-muted hover:text-white transition-colors'}`}>{t.l}</button>
                                ))}
                            </div>
                        </div>

                        {libTab === 'covers' && (
                            <div className="flex gap-2 overflow-x-auto hide-scroll pb-2">
                                {[{ id: 'all', l: 'Semua Kategori' }, { id: 'cover', l: 'Aransemen' }, { id: 'song', l: 'Generasi Baru' }, { id: 'instrumental', l: 'Hanya Instrumen' }].map(f => {
                                    const n = f.id === 'all' ? lib.covers.length : lib.covers.filter(x => (x.kind || 'cover') === f.id).length;
                                    return <button key={f.id} onClick={() => setLibFilter(f.id)} className={`shrink-0 px-3 py-1.5 rounded-full border text-[10px] uppercase tracking-wider font-semibold transition-colors ${libFilter === f.id ? 'bg-zinc-800 border-zinc-700 text-white' : 'border-ml-border text-ml-muted hover:text-white hover:border-zinc-700'}`}>{f.l} ({n})</button>;
                                })}
                            </div>
                        )}

                        <div className="flex flex-col gap-3">
                            {libTab === 'uploads' && lib.uploads.length === 0 && <div className="text-center py-10 border border-ml-border border-dashed rounded-lg text-sm text-ml-muted">Belum ada referensi audio tersimpan.</div>}
                            {libTab === 'covers' && lib.covers.filter(x => libFilter === 'all' || (x.kind || 'cover') === libFilter).length === 0 && <div className="text-center py-10 border border-ml-border border-dashed rounded-lg text-sm text-ml-muted">{lib.covers.length === 0 ? 'Belum ada proyek yang diselesaikan.' : 'Tidak ada hasil untuk kategori filter ini.'}</div>}
                            
                            {libTab === 'uploads' && lib.uploads.map(it => (
                                <div key={it.id} className="p-4 bg-ml-panel border border-ml-border rounded-lg flex items-center gap-4 hover:border-zinc-700 transition-colors">
                                    <div className="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-500 shrink-0"><i className="fa-solid fa-wave-square"></i></div>
                                    <div className="min-w-0 flex-1">
                                        <div className="text-sm font-semibold truncate text-white">{it.name}</div>
                                        <div className="text-[11px] text-ml-muted mt-1">{new Date(it.date).toLocaleDateString('id-ID')} &bull; Durasi: {formatTime(it.duration || 0)}</div>
                                    </div>
                                    <button onClick={() => useLibUpload(it)} className="px-4 py-2 rounded-md bg-white text-black text-xs font-semibold hover:bg-zinc-200 transition-colors">Muat Ulang</button>
                                    <button onClick={() => delLib('uploads', it)} className="w-8 h-8 flex items-center justify-center text-zinc-600 hover:text-ml-danger transition-colors"><i className="fa-solid fa-trash-can"></i></button>
                                </div>
                            ))}
                            
                            {libTab === 'covers' && lib.covers.filter(x => libFilter === 'all' || (x.kind || 'cover') === libFilter).map(it => (
                                <div key={it.id} className="p-4 bg-ml-panel border border-ml-border rounded-lg flex flex-col gap-4 hover:border-zinc-700 transition-colors">
                                    <div className="flex items-center gap-4">
                                        <div className="relative shrink-0">
                                            {it.image ? <img src={it.image} alt="" className="w-14 h-14 rounded-md object-cover border border-zinc-800" /> : <div className="w-14 h-14 rounded-md bg-zinc-900 border border-zinc-800 flex items-center justify-center"><i className="fa-solid fa-music text-zinc-600"></i></div>}
                                            <div className="absolute -bottom-2 -right-2 text-[9px] bg-zinc-800 text-white px-1.5 py-0.5 rounded shadow">{formatTime(it.duration || 0)}</div>
                                        </div>
                                        <div className="min-w-0 flex-1">
                                            <div className="text-sm font-semibold truncate text-white mb-1">{it.title}</div>
                                            <div className="text-[11px] text-ml-muted truncate"><span className="text-white opacity-70 border border-zinc-700 px-1 rounded mr-2">{SONG_KIND_LABEL[it.kind || 'cover']}</span>{new Date(it.date).toLocaleDateString('id-ID')}</div>
                                        </div>
                                        <button onClick={() => downloadResult(it)} disabled={!!dlBusy} className="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 text-white flex items-center justify-center hover:bg-white hover:text-black transition-colors disabled:opacity-50"><i className={`fa-solid ${dlBusy === it.id ? 'fa-circle-notch fa-spin' : 'fa-arrow-down'}`}></i></button>
                                        <button onClick={() => delLib('covers', it)} className="w-8 h-8 flex items-center justify-center text-zinc-600 hover:text-ml-danger transition-colors"><i className="fa-solid fa-trash-can"></i></button>
                                    </div>
                                    <audio controls preload="none" src={it.url} className="w-full h-8 opacity-80 invert grayscale contrast-200"></audio>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full bg-ml-bg relative">
                    <div className="px-8 py-5 flex justify-between items-center border-b border-ml-border bg-[#000000] z-20 shrink-0">
                        <div className="flex items-center gap-4">
                            {appMode !== 'home' && <button onClick={goHome} title="Dashboard Utama" className="w-9 h-9 rounded bg-ml-panel border border-ml-border flex items-center justify-center hover:bg-zinc-800 transition-colors text-ml-muted hover:text-white"><i className="fa-solid fa-arrow-left"></i></button>}
                            <div>
                                <h1 className="text-xl font-bold tracking-tighter text-white">Musiclabs <span className="text-zinc-500 font-normal">AI</span></h1>
                                <p className="text-[10px] text-zinc-500 font-mono mt-0.5">CREATED BY AHMADVR &bull; {appMode === 'song' ? 'Komposisi Baru' : appMode === 'cover' ? 'Modifikasi Vokal' : 'Dashboard'}</p>
                            </div>
                        </div>
                        <button onClick={() => setShowSettings(true)} className="w-9 h-9 rounded bg-ml-panel border border-ml-border flex items-center justify-center hover:bg-white hover:text-black transition-colors text-ml-muted">
                            <i className="fa-solid fa-sliders"></i>
                        </button>
                    </div>

                    <div className="flex items-center gap-3 px-8 py-2.5 shrink-0 border-b border-ml-border bg-[#000000] overflow-x-auto hide-scroll">
                        {[{ id: 'kie', label: 'API Connection' }].map(it => {
                            const v = statusView(it.id);
                            return (
                                <div key={it.id} className="flex items-center gap-2 px-3 py-1 rounded bg-ml-panel border border-ml-border text-[10px] font-mono whitespace-nowrap">
                                    <span className={`w-2 h-2 rounded-full ${v.dot}`}></span>
                                    <span className="text-white font-semibold">{it.label}</span>
                                    <span className={v.textColor}>{v.short}</span>
                                </div>
                            );
                        })}
                        <button onClick={refreshAll} title="Sinkronisasi Status" className="ml-auto shrink-0 w-7 h-7 rounded border border-ml-border flex items-center justify-center text-ml-muted hover:text-white hover:bg-ml-panel transition-colors">
                            <i className={`fa-solid fa-rotate-right text-[10px] ${anyChecking ? 'fa-spin' : ''}`}></i>
                        </button>
