        async function kieAsk(prompt, key, signal, ms) {
            const log = []; let last = null;
            for (let i = 0; i < 2; i++) {
                if (signal && signal.aborted) throw Object.assign(new Error('Dibatalkan'), { cancelled: true });
                const ctrl = new AbortController();
                const onAbort = () => ctrl.abort();
                if (signal) signal.addEventListener('abort', onAbort);
                let timedOut = false;
                const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, ms);
                try {
                    const res = await fetch(KIE_URL, {
                        method: 'POST', signal: ctrl.signal,
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'Authorization': `Bearer ${key}` },
                        body: JSON.stringify({ model: 'gpt-6-luna', stream: false, reasoning: { effort: 'low' }, input: [{ role: 'user', content: [{ type: 'input_text', text: prompt }] }] })
                    });
                    const txt = await res.text();
                    let data = {}; try { data = JSON.parse(txt); } catch (e) {}
                    if (!res.ok || (data.code && Number(data.code) !== 200) || data.error) {
                        const er = new Error((data.error && data.error.message) || data.msg || data.message || txt.slice(0, 200) || `HTTP ${res.status}`);
                        er.status = res.ok ? Number(data.code) || 0 : res.status;
                        throw er;
                    }
                    const out = extractText(data);
                    if (!out) throw new Error('Respons kosong');
                    return out;
                } catch (e) {
                    if (signal && signal.aborted) throw Object.assign(new Error('Dibatalkan'), { cancelled: true });
                    const isTimeout = e.name === 'AbortError' || timedOut;
                    log.push(`#${i + 1}: ${isTimeout ? 'timeout' : e.message}${e.status ? ` [${e.status}]` : ''}`);
                    last = isTimeout ? new Error('Koneksi timeout. Coba kembali.') : e;
                    if ([401, 402, 403].includes(e.status)) break; 
                } finally {
                    clearTimeout(timer);
                    if (signal) signal.removeEventListener('abort', onAbort);
                }
            }
            throw Object.assign(last || new Error('Gagal memproses data'), { detail: log.join('\n') });
        }

        function buildSongStylePrompt(style, o) {
            const tags = o.tags || [];
            const vocalRule = o.instrumental
                ? 'VOCAL: this is an INSTRUMENTAL track. Do NOT write any vocal descriptor.'
                : tags.length
                    ? `VOCAL: the app itself puts these vocal tags at the very start of the final style: "${tags.join(', ')}". Do NOT write any vocal descriptor in your output.`
                    : 'VOCAL: no vocal was chosen. Add exactly ONE clear vocal descriptor right after the genre.';
            return [
                'You are a music prompt specialist. Convert the description into a concise STYLE prompt for AI generation.',
                '',
                `DESCRIPTION: ${style}`,
                vocalRule,
                '',
                'RULES:',
                '- Plain comma-separated descriptors, never sentences.',
                '- Order: genre, energy/tempo, mood, 2-3 key instruments, production texture.',
                '- Total 4-8 descriptors max.',
                `LENGTH: 120-350 characters, hard maximum ${Math.max(100, STYLE_MAX - tags.join(', ').length - 2)}. Write in English.`,
                'OUTPUT: valid JSON {"style": "..."} only.'
            ].join('\n');
        }

        function buildSongWritePrompt(style, o) {
            const tags = o.tags || [];
            return [
                'You are a songwriter writing original lyrics.',
                '',
                `SONG BRIEF: ${style}`,
                tags.length ? `VOICE: ${tags.join(', ')}` : null,
                'LANGUAGE: Indonesian (Bahasa Indonesia) unless requested otherwise.',
                '',
                'STRUCTURE: [Verse 1], [Chorus], etc. on own lines.',
                'LENGTH: 1200-2600 characters.',
                'OUTPUT: only the lyrics, plain text.'
            ].filter(x => x !== null).join('\n');
        }

        function buildSongPolishPrompt(lyrics, style) {
            return [
                'You are a lyric editor. Polish the lyrics to professional quality.',
                style ? `BRIEF: ${style}` : null,
                '',
                'OUTPUT: only the polished lyrics, plain text.',
                'LYRICS:',
                lyrics
            ].filter(x => x !== null).join('\n');
        }

        function deriveSongTitle(kind, lyrics, style) {
            const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
            if (kind === 'vocal') {
                const line = String(lyrics || '').split('\n').map(l => l.replace(/\[[^\]]*\]/g, ' ').replace(/([A-Za-zÀ-ÿ])-(?=[A-Za-zÀ-ÿ])/g, '$1').replace(/[^\p{L}\p{N}\s'’]/gu, ' ').replace(/\s+/g, ' ').trim()).find(l => /[A-Za-zÀ-ɏ]/.test(l));
                if (line) return cap(line.split(' ').slice(0, 6).join(' ')).slice(0, 80);
                return 'Komposisi Baru';
            }
            const first = String(style || '').split(',')[0].replace(/[^\p{L}\p{N}\s'’-]/gu, ' ').replace(/\s+/g, ' ').trim();
            const words = first.split(' ').filter(Boolean).slice(0, 4).map(cap).join(' ');
            return (words ? `${words} Instrumen` : 'Instrumental Mix').slice(0, 80);
        }

        function NewSong({ apiKeys, activeKieKey, lib, setLib, refreshCredits, refreshCreditsLater, onSongDone }) {
            const [kind, setKind] = useState('vocal');
            const [style, setStyle] = useState('');
            const [prevStyle, setPrevStyle] = useState(null);
            const [lyrics, setLyrics] = useState('');
            const [lyricsHistory, setLyricsHistory] = useState([]);
            const [vocal, setVocal] = useState({ genders: [], age: '', range: '', traits: [] });
            const [duration, setDuration] = useState(0);
            const [ai, setAi] = useState('');   
            const [gen, setGen] = useState(false);
            const [msg, setMsg] = useState('');
            const [elapsed, setElapsed] = useState(0);
            const [err, setErr] = useState(null);
            const aiAbort = useRef(null);
            const genAbort = useRef(null);
            const cancelGen = useRef(false);
            const lyricsRef = useRef(null);

            const instrumental = kind === 'instrumental';
            const vocalTags = instrumental ? [] : vocalTagList(vocal);
            const apiGender = vocalTags.length && vocal.genders.length === 1 ? vocal.genders[0] : '';
            const finalStyle = composeStyle(style, vocalTags);
            const busy = !!ai || gen;
            const title = deriveSongTitle(kind, lyrics, style);

            useEffect(() => {
                if (!busy) { setElapsed(0); return; }
                const t0 = Date.now();
                const id = setInterval(() => setElapsed(Math.floor((Date.now() - t0) / 1000)), 1000);
                return () => clearInterval(id);
            }, [busy]);

            const toggleGender = (id) => setVocal(v => {
                const g = v.genders.includes(id) ? v.genders.filter(x => x !== id) : [...v.genders, id];
                return g.length ? { ...v, genders: g, range: '', traits: v.traits.filter(t => !(t === 'falsetto' && g.length === 1 && g[0] === 'f')) } : { genders: [], age: '', range: '', traits: [] };
            });
            const pickAge = (id) => setVocal(v => { const age = v.age === id ? '' : id; const young = ['child', 'teen'].includes(age); return { ...v, age, range: age === 'child' ? '' : v.range, traits: v.traits.filter(t => !(young && V_YOUNG_BLOCK.includes(t))) }; });
            const pickRange = (r) => setVocal(v => ({ ...v, range: v.range === r ? '' : r }));
            const toggleTrait = (id) => setVocal(v => v.traits.includes(id) ? { ...v, traits: v.traits.filter(t => t !== id) } : (traitBlocked(id, v) ? v : { ...v, traits: [...v.traits, id] }));

            const insertTag = (tag) => {
                const el = lyricsRef.current; const pos = el ? el.selectionStart : lyrics.length;
                const before = lyrics.slice(0, pos), after = lyrics.slice(pos);
                const ins = `${before && !before.endsWith('\n') ? '\n' : ''}${tag}\n`;
                setLyricsHistory(h => [...h.slice(-19), lyrics]);
                setLyrics(before + ins + after);
                setTimeout(() => { if (el) { el.focus(); const c = (before + ins).length; el.setSelectionRange(c, c); } }, 0);
            };
            const undoLyrics = () => {
                if (!lyricsHistory.length) return;
                setLyrics(lyricsHistory[lyricsHistory.length - 1]);
                setLyricsHistory(h => h.slice(0, -1));
            };

            const runAi = async (type) => {
                if (busy) return;
                const key = cleanKey(activeKieKey);
                if (!key) return showToast('Sistem belum dikonfigurasi (API Key dibutuhkan)', 'error');
                const st = style.trim(), ly = lyrics.trim();
                if ((type === 'style' || type === 'write') && !st) return showToast('Parameter musik belum dilengkapi', 'error');
                if (type === 'polish' && !ly) return showToast('Konten lirik kosong', 'error');
                const ctrl = new AbortController(); aiAbort.current = ctrl;
                setAi(type); setErr(null);
                try {
                    if (type === 'style') {
                        const raw = await kieAsk(buildSongStylePrompt(st, { tags: vocalTags, instrumental, lyrics: instrumental ? '' : lyrics }), key, ctrl.signal, 60000);
                        const out = parseStyleResponse(raw);
                        if (!out) throw new Error('Data tidak dapat diproses');
                        setPrevStyle(style); setStyle(out.slice(0, STYLE_MAX));
                    } else {
                        const prompt = type === 'write' ? buildSongWritePrompt(st, { tags: vocalTags }) : buildSongPolishPrompt(ly, st);
                        const raw = await kieAsk(prompt, key, ctrl.signal, 90000);
                        const out = parseLyricsResponse(raw);
                        if (!out) throw new Error('Pembuatan teks gagal');
                        setLyricsHistory(h => [...h.slice(-19), lyrics]);
                        setLyrics(out.slice(0, LYRICS_MAX));
                        setTimeout(() => { const el = lyricsRef.current; if (el) el.scrollTop = 0; }, 0);
                    }
                } catch (e) {
                    if (e.cancelled) showToast('Dibatalkan pengguna', 'info');
                    else {
                        console.error(e);
                        showToast(e.message || 'Interupsi komunikasi sistem', 'error');
                    }
                } finally {
                    aiAbort.current = null; setAi('');
                    setTimeout(refreshCredits, 3000);
                }
            };
            const cancelAi = () => { if (aiAbort.current) aiAbort.current.abort(); };

            const generate = async () => {
                if (busy) return;
                const key = cleanKey(activeKieKey);
                if (!key) return showToast('Sistem belum dikonfigurasi', 'error');
                if (!style.trim()) return showToast('Parameter musik tidak boleh kosong', 'error');
                if (!instrumental && !lyrics.trim()) return showToast('Konten teks lirik wajib diisi', 'error');
                if (!instrumental && lyrics.trim().length > LYRICS_MAX) return showToast(`Batas karakter lirik terlampaui.`, 'error');
                const lyr = instrumental ? '' : lyrics.trim();
                const sig = hash36(['song', kind, finalStyle, lyr, apiGender, duration, KIE_SUNO_MODEL].join('\u0001'));
                
                const ctrl = new AbortController(); genAbort.current = ctrl; cancelGen.current = false;
                const chk = () => { if (cancelGen.current) throw new Error('Dibatalkan'); };
                const auth = { 'Authorization': `Bearer ${key}` };
                let taskId = '';
                setGen(true); setErr(null); setMsg('Menginisialisasi delegasi ke Engine...');
                try {
                    const base = { customMode: true, instrumental, model: KIE_SUNO_MODEL, callBackUrl: cleanKey(apiKeys.callback) || KIE_DEFAULT_CALLBACK, title, style: finalStyle };
                    if (!instrumental) { base.prompt = lyr; base.lyrics = lyr; if (apiGender) base.vocalGender = apiGender; }
                    const submit = async (b) => {
                        const res = await fetch(KIE_GEN_URL, { method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'application/json', ...auth }, body: JSON.stringify(b) });
                        return { res, j: await res.json().catch(() => ({})) };
                    };
                    const okTask = (r) => r.res.ok && Number(r.j.code) === 200 && r.j.data && r.j.data.taskId;
                    let r = await submit(duration ? { ...base, duration } : base);
                    if (!okTask(r) && duration && /duration/i.test(r.j.msg || '')) {
                        r = await submit(base);
                    }
                    chk();
                    if (!okTask(r)) throw Object.assign(new Error(`Tugas ditolak: ${r.j.msg || r.j.message || 'HTTP ' + r.res.status}`), { raw: JSON.stringify(r.j).slice(0, 600) });
                    taskId = r.j.data.taskId;

                    const t0 = Date.now(); let fails = 0, polls = 0, tracks = [];
                    const FAILED = ['CREATE_TASK_FAILED', 'GENERATE_AUDIO_FAILED', 'SENSITIVE_WORD_ERROR'];
                    while (true) {
                        chk();
                        if (Date.now() - t0 > 600000) throw new Error(`Pemrosesan melampaui batas waktu.`);
                        await new Promise(res => setTimeout(res, 5000)); chk();
                        let info;
                        try {
                            const rr = await fetch(`${KIE_SUNO_INFO}?taskId=${encodeURIComponent(taskId)}`, { headers: auth, signal: ctrl.signal });
                            const d = await rr.json().catch(() => ({}));
                            if (!rr.ok || Number(d.code) !== 200) {
                                if ([401, 402, 403].includes(rr.status) || [401, 402, 403].includes(Number(d.code))) throw Object.assign(new Error(d.msg || 'Akses ilegal'), { fatal: true });
                                throw new Error(d.msg || `HTTP ${rr.status}`);
                            }
                            info = d.data || {}; fails = 0;
                        } catch (e) {
                            if (e.name === 'AbortError' || e.fatal || ++fails > 5) throw e;
                            continue; 
                        }
                        const status = info.status || '';
                        const list = (info.response && (info.response.sunoData || info.response.data)) || [];
                        const labels = { PENDING: 'Dalam antrean', TEXT_SUCCESS: 'Analisis struktur parameter', FIRST_SUCCESS: 'Kompilasi varian awal selesai' };
                        setMsg(`${labels[status] || 'Mesin sedang mensintesis audio'}... (${status || 'PENDING'})\nSiklus ke-${++polls}`);
                        if (status === 'SUCCESS') { tracks = list; break; }
                        if (status === 'CALLBACK_EXCEPTION' && list.some(x => x.audio_url || x.source_audio_url)) { tracks = list; break; }
                        if (FAILED.includes(status) || status === 'CALLBACK_EXCEPTION') {
                            throw Object.assign(new Error(`Kerusakan logikal engine: ${info.errorMessage || status}`), { raw: `status: ${status}\n${info.errorMessage || ''}` });
                        }
                    }

                    const results = tracks.map((x, i) => ({
                        id: x.id || i, title: x.title || `${title} ${i + 1}`,
                        url: x.audio_url || x.source_audio_url || x.stream_audio_url || '',
                        image: x.image_url || x.source_image_url || '', duration: x.duration
                    })).filter(x => x.url);
                    if (!results.length) throw new Error(`Berkas keluaran tidak terdeteksi.`);
                    const stamp = Date.now();
                    setLib(l => ({ ...l, covers: [...results.map(x => ({ ...x, id: 's' + stamp + '-' + x.id, kind: instrumental ? 'instrumental' : 'song', source: 'Sintesis Audio Baru', style: style.trim(), sig, date: stamp })), ...l.covers] }));
                    showToast(`Siklus pembuatan rampung: ${results.length} aset didapatkan.`, 'success');
                    onSongDone(kind);
                } catch (e) {
                    console.error(e);
                    if (cancelGen.current || e.name === 'AbortError') showToast('Dibatalkan pengguna', 'info');
                    else {
                        const sens = /copyright|existing work|matches|sensitive|lyric|hak cipta/i.test(`${e.message} ${e.raw || ''}`);
                        setErr({ title: sens ? 'Penolakan Sistem (Filter Kebijakan)' : 'Aborsi Proses', msg: sens ? 'Terdeteksi konflik kebijakan (kemiripan hak cipta/kata terlarang). Revisi input teks/parameter.' : (e.message || 'Kegagalan sintesis'), raw: e.raw || e.detail || (taskId ? `Task ID: ${taskId}` : '') });
                        showToast(e.message || 'Kegagalan sintesis', 'error');
                    }
                } finally {
                    genAbort.current = null; setGen(false);
                    refreshCreditsLater();
                }
            };
            const cancelGenerate = () => { cancelGen.current = true; if (genAbort.current) genAbort.current.abort(); };

            const aiBtn = (type, idleIcon, idleLabel, busyLabel, extra = '') => (
                <button onClick={() => runAi(type)} disabled={busy || (type === 'polish' ? !lyrics.trim() : !style.trim())} className={`flex-1 py-2.5 rounded text-xs font-bold uppercase tracking-widest transition-colors disabled:opacity-30 ${extra}`}>
                    {ai === type ? <><i className="fa-solid fa-circle-notch fa-spin mr-2"></i>{busyLabel} {elapsed}s</> : <><i className={`fa-solid ${idleIcon} mr-2`}></i>{idleLabel}</>}
                </button>
            );
            const canGenerate = !busy && style.trim() && (instrumental || lyrics.trim());

            return (
                <div className="h-full relative flex flex-col items-center">
                    <div className="w-full max-w-3xl h-full overflow-y-auto hide-scroll">
                        <div className="p-8 flex flex-col gap-6 pb-20">
                            
                            <div className="flex bg-[#000000] p-1 rounded-lg border border-zinc-800">
                                {[{ id: 'vocal', l: 'Format Vokal', i: 'fa-microphone-lines' }, { id: 'instrumental', l: 'Hanya Instrumen', i: 'fa-guitar' }].map(t => (
                                    <button key={t.id} onClick={() => !busy && setKind(t.id)} disabled={busy} className={`flex-1 py-3 text-xs font-bold uppercase tracking-widest rounded-md transition-colors ${kind === t.id ? 'bg-white text-black' : 'text-zinc-500 hover:text-white'}`}><i className={`fa-solid ${t.i} mr-2`}></i>{t.l}</button>
                                ))}
                            </div>

                            <div className="bg-ml-panel border border-ml-border rounded-lg p-6 flex flex-col gap-4">
                                <div className="flex items-center justify-between border-b border-zinc-900 pb-3">
                                    <h3 className="font-bold tracking-wide text-white flex items-center gap-2"><i className="fa-solid fa-sliders text-zinc-500"></i> Parameter Gaya Musikal</h3>
                                    <span className="text-[10px] font-mono text-zinc-600">{style.length}/{STYLE_MAX}</span>
                                </div>
                                <textarea value={style} onChange={e => setStyle(e.target.value)} readOnly={ai === 'style'} rows={3} maxLength={STYLE_MAX} placeholder={instrumental ? 'Ex: Lo-fi beat santai, melodi piano lembut, atmosfer hujan' : 'Ex: Pop rock energik, dominasi gitar elektrik, tempo cepat'} className="w-full bg-[#000000] border border-zinc-800 rounded p-3 text-sm text-zinc-300 focus:border-zinc-500 outline-none resize-y transition-colors" />
                                <div className="flex items-center gap-3">
                                    {aiBtn('style', 'fa-wand-magic-sparkles', 'Tala Ulang Parameter', 'Menyelaraskan...', 'bg-zinc-800 text-white hover:bg-zinc-700')}
                                    {prevStyle !== null && !busy && <button onClick={() => { setStyle(prevStyle); setPrevStyle(null); }} className="text-[10px] font-mono uppercase tracking-widest text-zinc-400 hover:text-white transition-colors">Batal</button>}
                                    {ai === 'style' && <button onClick={cancelAi} className="text-[10px] font-mono uppercase tracking-widest text-zinc-400 hover:text-white">Batal</button>}
                                </div>
                            </div>

                            {!instrumental && (
                                <div className="bg-ml-panel border border-ml-border rounded-lg p-6 flex flex-col gap-4">
                                    <div className="text-[10px] font-mono text-zinc-500 uppercase tracking-widest border-b border-zinc-900 pb-2">Karakter Vokal Spesifik</div>
                                    <div className="flex flex-col gap-4 mt-2">
                                        <div>
                                            <div className="text-[10px] uppercase font-mono text-zinc-600 mb-2">Gender (Pilih semua untuk duet)</div>
                                            <div className="flex gap-2">{[{ id: 'f', l: 'Perempuan' }, { id: 'm', l: 'Laki-laki' }].map(o => <Chip key={o.id} on={vocal.genders.includes(o.id)} onClick={() => toggleGender(o.id)}>{o.l}</Chip>)}</div>
                                        </div>
                                        {vocal.genders.length > 0 && (<>
                                            <div>
                                                <div className="text-[10px] uppercase font-mono text-zinc-600 mb-2">Indikator Rentang Usia</div>
                                                <div className="flex flex-wrap gap-2">{VOCAL_AGES.map(a => <Chip key={a.id} on={vocal.age === a.id} onClick={() => pickAge(a.id)}>{a.l}</Chip>)}</div>
                                            </div>
                                            {vocal.genders.length === 1 && vocal.age !== 'child' && (
                                                <div>
                                                    <div className="text-[10px] uppercase font-mono text-zinc-600 mb-2">Register Vokal</div>
                                                    <div className="flex flex-wrap gap-2">{VOCAL_RANGES[vocal.genders[0]].map(r => <Chip key={r} on={vocal.range === r} onClick={() => pickRange(r)}>{r}</Chip>)}</div>
                                                </div>
                                            )}
                                            <div>
                                                <div className="text-[10px] uppercase font-mono text-zinc-600 mb-2">Timbre Spesifik (Maksimal 2 seleksi)</div>
                                                <div className="flex flex-wrap gap-2">{VOCAL_TRAITS.map(t => <Chip key={t.id} on={vocal.traits.includes(t.id)} disabled={traitBlocked(t.id, vocal)} onClick={() => toggleTrait(t.id)}>{t.l}</Chip>)}</div>
                                            </div>
                                        </>)}
                                    </div>
                                </div>
                            )}

                            {!instrumental && (
                                <div className="bg-ml-panel border border-ml-border rounded-lg p-6 flex flex-col gap-4">
                                    <div className="flex items-center justify-between border-b border-zinc-900 pb-3">
                                        <h3 className="font-bold tracking-wide text-white flex items-center gap-2"><i className="fa-solid fa-align-left text-zinc-500"></i> Konten Lirik</h3>
                                    </div>
                                    <div className="flex gap-2 overflow-x-auto hide-scroll">{SONG_TAGS.map(t => (<button key={t} onClick={() => insertTag(t)} className="shrink-0 px-3 py-1.5 rounded border border-zinc-800 bg-[#000000] text-[10px] font-mono text-zinc-400 hover:text-white transition-colors">{t}</button>))}</div>
                                    <textarea ref={lyricsRef} value={lyrics} onChange={e => setLyrics(e.target.value)} readOnly={ai === 'write' || ai === 'polish'} spellCheck={false} placeholder="Masukkan teks lirik manual atau manfaatkan fitur asisten AI di bawah untuk otomatisasi." className="w-full bg-[#000000] rounded border border-zinc-800 p-4 text-sm leading-relaxed text-zinc-300 focus:outline-none focus:border-zinc-500 font-mono whitespace-pre-wrap resize-y min-h-[260px]" />
                                    
                                    <div className="flex items-center justify-between gap-3 text-[10px] font-mono text-zinc-600 uppercase tracking-widest mt-1">
                                        <span className={lyrics.length > LYRICS_MAX ? 'text-ml-danger' : ''}>{lyrics.trim() ? lyrics.trim().split(/\n/).length : 0} Lines &bull; {lyrics.length}/{LYRICS_MAX} Chars</span>
                                        <button onClick={undoLyrics} disabled={!lyricsHistory.length || busy} className={!lyricsHistory.length || busy ? 'opacity-30' : 'hover:text-white'}><i className="fa-solid fa-rotate-left mr-1.5"></i>Undo</button>
                                    </div>
                                    
                                    <div className="flex flex-col sm:flex-row items-center gap-3 pt-2">
                                        {aiBtn('write', 'fa-feather-pointed', 'Generasi Otomatis', 'Merangkai Teks...', 'bg-white text-black hover:bg-zinc-200 w-full')}
                                        {aiBtn('polish', 'fa-gem', 'Optimalisasi Konten', 'Merevisi...', 'bg-zinc-900 border border-zinc-700 text-white hover:bg-zinc-800 w-full')}
                                    </div>
                                    {ai === 'write' || ai === 'polish' ? <button onClick={cancelAi} className="self-center text-[10px] font-mono uppercase tracking-widest text-zinc-500 hover:text-white mt-1">Batalkan Operasi</button> : null}
                                </div>
                            )}

                            <div className="bg-ml-panel border border-ml-border rounded-lg p-6 flex flex-col gap-4">
                                <div className="p-4 bg-[#000000] border border-zinc-800 rounded flex flex-col gap-2 text-[10px] font-mono uppercase tracking-widest break-words select-text">
                                    <div className="flex justify-between gap-4 border-b border-zinc-900 pb-2"><span className="text-zinc-600">Mode Target</span><span className="text-white text-right">{instrumental ? 'Instrumental' : 'Vokal'}</span></div>
                                    <div className="flex justify-between gap-4 border-b border-zinc-900 pb-2 pt-1"><span className="text-zinc-600">Alokasi Durasi (Est.)</span><span className="text-white text-right">{duration === 0 ? 'Dikelola Engine' : formatTime(duration)}</span></div>
                                    <div className="text-zinc-600 pt-2">Kompilasi Deskriptor ({finalStyle.length}/{STYLE_MAX})</div>
                                    <div className="text-zinc-300 pb-1">{finalStyle || 'N/A'}</div>
                                </div>
                                
                                {err && (
                                    <div className="rounded border border-ml-danger/30 bg-ml-danger/10 text-red-300 p-4 text-xs">
                                        <div className="font-bold mb-2 uppercase tracking-wide"><i className="fa-solid fa-triangle-exclamation mr-1.5"></i>{err.title}</div>
                                        <div className="leading-relaxed opacity-90">{err.msg}</div>
                                        {err.raw && <pre className="mt-3 bg-[#000000] p-2 rounded font-mono text-[10px] opacity-70 whitespace-pre-wrap break-words">{err.raw}</pre>}
                                    </div>
                                )}
                                
                                <button onClick={generate} disabled={!canGenerate} className="w-full mt-2 disabled:opacity-30 disabled:cursor-not-allowed bg-white text-black py-4 rounded-md text-xs font-bold uppercase tracking-widest hover:bg-zinc-200 transition-colors shadow-lg"><i className="fa-solid fa-bolt mr-2"></i>Eksekusi Sintesis Engine</button>
                            </div>
                        </div>
                    </div>

                    {gen && (
                        <div className="absolute inset-0 bg-[#000000]/90 backdrop-blur-md z-40 flex flex-col items-center justify-center px-8 text-center animate-fade-in">
                            <div className="relative flex items-center justify-center w-28 h-28 mb-8 animate-spin-slow">
                                <div className="w-28 h-28 rounded-full bg-ml-bg border-[4px] border-zinc-800 flex items-center justify-center shadow-2xl relative overflow-hidden">
                                    <div className="absolute inset-2 rounded-full border border-zinc-800/40"></div>
                                    <div className="absolute inset-5 rounded-full border border-zinc-800/60"></div>
                                    <div className="absolute inset-8 rounded-full border border-zinc-800/40"></div>
                                    <div className="w-10 h-10 rounded-full bg-white flex items-center justify-center relative z-10">
                                        <div className="w-2.5 h-2.5 rounded-full bg-[#000000]"></div>
                                    </div>
                                </div>
                            </div>
                            <h3 className="font-bold text-lg text-white mb-2 tracking-tight uppercase">SYSTEM PROCESSING</h3>
                            <p className="font-mono text-xs text-ml-muted max-w-full whitespace-pre-line uppercase tracking-wider leading-relaxed">{msg}</p>
                            <p className="font-mono text-[10px] text-zinc-600 mt-8">Elapsed Time: {elapsed}s</p>
                            <button onClick={cancelGenerate} className="mt-8 px-6 py-2 rounded border border-zinc-800 text-[11px] font-bold tracking-widest uppercase text-white hover:bg-zinc-900 transition-colors">Terminate Process</button>
                        </div>
                    )}
                </div>
            );
        }

        function Chip({ on, disabled, onClick, children }) {
            return <button type="button" disabled={disabled} onClick={onClick} className={`px-4 py-1.5 rounded border text-[10px] font-bold uppercase tracking-widest transition-colors ${on ? 'bg-white border-white text-black' : 'border-zinc-800 bg-[#000000] text-zinc-400 hover:text-white'} ${disabled ? 'opacity-20 cursor-not-allowed' : ''}`}>{children}</button>;
        }

        function SpectrumVisualizer({ engine, isPlaying }) {
            const canvasRef = useRef(null);
            useEffect(() => {
                if(!engine || !engine.ctx) return;
                const canvas = canvasRef.current; const ctx = canvas.getContext('2d');
                const vAnalyser = engine.vocalAnalyser; const mAnalyser = engine.musicAnalyser;
                if(!vAnalyser || !mAnalyser) return;
                
                const bufferLength = vAnalyser.frequencyBinCount;
                const vData = new Uint8Array(bufferLength); const mData = new Uint8Array(bufferLength);
                let req;
                
                const drawCurve = (dataArray, color, fillStyle) => {
                    ctx.beginPath(); ctx.moveTo(0, canvas.height);
                    const sliceWidth = canvas.width * 1.0 / (bufferLength / 1.5);
                    let x = 0;
                    for(let i = 0; i < bufferLength; i++) {
                        const v = dataArray[i] / 255.0;
                        const y = canvas.height - (v * canvas.height * 0.9);
                        if(i === 0) ctx.lineTo(x, y);
                        else {
                            const prevV = dataArray[i-1] / 255.0;
                            const prevY = canvas.height - (prevV * canvas.height * 0.9);
                            const xc = (x - sliceWidth + x) / 2; const yc = (prevY + y) / 2;
                            ctx.quadraticCurveTo(x - sliceWidth, prevY, xc, yc);
                        }
                        x += sliceWidth;
                    }
                    ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height);
                    ctx.fillStyle = fillStyle; ctx.fill();
                    ctx.lineWidth = 1.5; ctx.strokeStyle = color; ctx.stroke();
                };

                const render = () => {
                    req = requestAnimationFrame(render);
                    vAnalyser.getByteFrequencyData(vData); mAnalyser.getByteFrequencyData(mData);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    const vGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    vGrad.addColorStop(0, 'rgba(255, 255, 255, 0.4)'); vGrad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
                    const mGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    mGrad.addColorStop(0, 'rgba(82, 82, 91, 0.5)'); mGrad.addColorStop(1, 'rgba(82, 82, 91, 0.0)');

                    drawCurve(mData, '#52525b', mGrad); drawCurve(vData, '#ffffff', vGrad);
                };
                render();
                return () => cancelAnimationFrame(req);
            }, [engine, isPlaying]);

            return <canvas ref={canvasRef} width="600" height="160" className="w-full h-full absolute inset-0"></canvas>;
        }

        function TrackCard({ title, type, state, onVolume, onMute, onDistortion }) {
            return (
                <div className="bg-ml-panel border border-ml-border rounded-lg p-5 flex flex-col gap-4 hover:border-zinc-700 transition-colors">
                    <div className="flex justify-between items-center border-b border-zinc-900 pb-3">
                        <div className="flex items-center gap-2 text-white">
                            <i className="fa-solid fa-layer-group text-sm text-zinc-500"></i>
                            <span className="font-bold tracking-tight">{title}</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <span className="text-[9px] font-bold font-mono uppercase tracking-widest text-zinc-500">Bypass</span>
                            <div className="relative inline-block w-8 mr-1 align-middle select-none">
                                <input type="checkbox" checked={state.muted} onChange={onMute} className="toggle-checkbox absolute block w-4 h-4 rounded-full bg-zinc-400 border-[3px] border-ml-panel appearance-none cursor-pointer z-10 transition-all duration-300" style={{ top: '2px', left: '2px' }}/>
                                <label className="toggle-label block overflow-hidden h-5 rounded-full bg-[#000000] border border-zinc-800 cursor-pointer transition-colors duration-300"></label>
                            </div>
                        </div>
                    </div>
                    
                    <div className="flex items-center gap-4 py-2">
                        <i className={`fa-solid fa-volume-low text-xs w-4 text-center ${state.muted ? 'text-ml-danger/70' : 'text-zinc-500'}`}></i>
                        <div className="flex-1 relative flex items-center">
                            <input type="range" min="0" max="1.5" step="0.05" value={state.volume} onChange={(e) => onVolume(parseFloat(e.target.value))} className="relative z-10 w-full" />
                            <div className="absolute left-0 h-[2px] rounded-l-full pointer-events-none transition-all duration-150" style={{ width: `${(state.volume / 1.5) * 100}%`, backgroundColor: state.muted ? '#52525b' : '#ffffff', top: '50%', transform: 'translateY(-50%)' }}></div>
                        </div>
                    </div>
                    
                    <div className="pt-2">
                        <div className="text-[9px] font-mono font-bold text-zinc-600 mb-2 uppercase tracking-widest">Modulator Saturation</div>
                        <div className="flex gap-1.5">
                            {[ { id: 'low', label: 'Drive' }, { id: 'medium', label: 'Fuzz' }, { id: 'hard', label: 'Crush' } ].map(btn => {
                                const active = state.activeLevel === btn.id;
                                return (
                                    <button key={btn.id} onClick={() => onDistortion(btn.id)} className={`flex-1 py-1.5 text-[10px] font-bold uppercase tracking-widest rounded transition-all border ${active ? 'bg-white border-white text-black shadow-sm' : 'bg-[#000000] border-zinc-800 text-zinc-500 hover:text-white'}`}>{btn.label}</button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
