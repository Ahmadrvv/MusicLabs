                        return { res, j: await res.json().catch(() => ({})) };
                    };
                    let { res, j } = await submit(body);
                    if (!(res.ok && Number(j.code) === 200 && j.data && j.data.taskId) && /customMode/i.test(j.msg || '')) ({ res, j } = await submit({ ...body, customMode: true }));
                    if (!(res.ok && Number(j.code) === 200 && j.data && j.data.taskId)) {
                        throw new Error(`Server menolak tugas: ${j.msg || j.message || 'HTTP ' + res.status}`);
                    }
                    taskId = j.data.taskId; pendAdd(taskId, `${base} (cover)`);

                    const t0 = Date.now(); let fails = 0, polls = 0, tracks = []; setStage(5);
                    const FAILED = ['CREATE_TASK_FAILED', 'GENERATE_AUDIO_FAILED', 'SENSITIVE_WORD_ERROR'];
                    while (true) {
                        chk();
                        if (Date.now() - t0 > 600000) throw new Error(`Proses terlalu lama (>10 menit).`);
                        await new Promise(r => setTimeout(r, 5000)); chk();
                        let info;
                        try {
                            const r = await fetchT(`${KIE_SUNO_INFO}?taskId=${encodeURIComponent(taskId)}`, { headers: auth, signal: ctrl.signal }, 30000);
                            const d = await r.json().catch(() => ({}));
                            if (!r.ok || Number(d.code) !== 200) {
                                if ([401, 402, 403].includes(r.status) || [401, 402, 403].includes(Number(d.code))) throw Object.assign(new Error(d.msg || 'Akses ditolak'), { fatal: true });
                                throw new Error(d.msg || `HTTP ${r.status}`);
                            }
                            info = d.data || {}; fails = 0;
                        } catch (e) {
                            if (e.name === 'AbortError' || e.fatal || ++fails > 5) throw e;
                            continue; 
                        }
                        const status = info.status || '';
                        const list = (info.response && (info.response.sunoData || info.response.data)) || [];
                        const labels = { PENDING: 'Menunggu antrean server', TEXT_SUCCESS: 'AI menyusun lirik', FIRST_SUCCESS: 'Track pertama selesai, menunggu sisanya' };
                        setProcessMsg(`${labels[status] || 'AI sedang memproses'}... (${status || 'PENDING'}) · cek ke-${++polls}${Date.now() - t0 > 150000 ? '\nAntrean padat, tetap dipantau.' : ''}`);
                        if (mode === 'check' && ['TEXT_SUCCESS', 'FIRST_SUCCESS', 'SUCCESS'].includes(status)) { pendDel(taskId); break; }
                        if (status === 'SUCCESS') { pendDel(taskId); tracks = list; break; }
                        if (status === 'CALLBACK_EXCEPTION' && list.some(x => x.audio_url || x.source_audio_url)) { pendDel(taskId); tracks = list; break; }
                        if (FAILED.includes(status) || status === 'CALLBACK_EXCEPTION') {
                            pendDel(taskId);
                            throw Object.assign(new Error(`AI gagal: ${info.errorMessage || status}`), { raw: `status: ${status}\n${info.errorMessage || ''}` });
                        }
                    }

                    if (mode === 'check') {
                        const blob = acdBlobRef.current;
                        const id = 'u' + Date.now();
                        let saved = false;
                        try { if (blob) { await idbPut(id, blob); saved = true; } } catch (e) {}
                        if (saved) {
                            const name = audioFile.name;
                            lib.uploads.filter(x => x.name === name).forEach(x => idbDel(x.id).catch(() => {}));
                            setLib(l => ({ ...l, uploads: [{ id, name, size: blob.size, duration: dur || engine.duration, lyrics: lyricsText, sig: audioSig(), date: Date.now() }, ...l.uploads.filter(x => x.name !== name)] }));
                            setLibId(id);
                            showToast("Pemeriksaan selesai. File tersimpan, lanjutkan ke lirik dan style.", "success");
                        }
                        setStep(4);
                        return;
                    }
                    
                    const results = tracks.map((x, i) => ({
                        id: x.id || i, title: x.title || `Cover ${i + 1}`,
                        url: x.audio_url || x.source_audio_url || x.stream_audio_url || '',
                        image: x.image_url || x.source_image_url || '', duration: x.duration
                    })).filter(x => x.url);
                    if (!results.length) throw new Error(`Proses selesai tapi tidak ada audio.`);
                    setCoverResults(results);
                    setLib(l => ({ ...l, covers: [...results.map(r => ({ ...r, id: 'c' + Date.now() + '-' + r.id, source: audioFile.name, style: config.style || '', sig, date: Date.now() })), ...l.covers] }));
                    setLibTab('covers'); goHome(); 
                    showToast(`Proses selesai. ${results.length} versi audio dihasilkan.`, "success");
                } catch (e) {
                    console.error(e);
                    if (cancelledRef.current || e.name === 'AbortError') showToast("Dibatalkan", "info");
                    else {
                        const cr = /copyright|existing work|matches|sensitive|lyric|hak cipta/i.test(`${e.message} ${e.raw || ''}`);
                        setSunoErr(cr ? {
                            kind: 'copyright', title: 'Masalah Hak Cipta',
                            msg: 'Permintaan ditolak karena kendala hak cipta. Sesuaikan pengaturan ACD atau gunakan audio lain.',
                            raw: e.raw || e.message, back: 2, backLabel: 'Ke Pengaturan ACD'
                        } : { kind: 'error', title: 'Proses gagal', msg: e.message || 'Gagal generate', raw: e.detail || '' });
                        showToast(e.message || "Gagal memproses audio", "error");
                    }
                } finally {
                    abortRef.current = null;
                    setStage(0);
                    setIsProcessing(false);
                    checkKieLater(); 
                }
            };

            const sunoErrPanel = sunoErr && (
                <div className={`rounded-xl border p-5 text-sm shadow-xl ${sunoErr.kind === 'copyright' ? 'border-orange-500/50 bg-[#1a1a1a] text-white' : 'border-red-500/50 glass-inner text-white'}`}>
                    <div className="font-bold mb-2 text-base flex items-center gap-3"><i className="fa-solid fa-triangle-exclamation"></i> {sunoErr.title}</div>
                    <div className="leading-relaxed opacity-90">{sunoErr.msg}</div>
                    {sunoErr.raw && <pre className="mt-4 font-mono text-[11px] opacity-60 whitespace-pre-wrap break-words select-text">Detail: {sunoErr.raw}</pre>}
                    {sunoErr.back && <button onClick={() => { setSunoErr(null); setStep(sunoErr.back); }} className="mt-5 px-5 py-2.5 rounded-lg border border-white/50 text-white font-semibold hover:bg-white hover:text-black transition-colors">{sunoErr.backLabel}</button>}
                </div>
            );

            const useLibUpload = async (it) => {
                let blob = null; try { blob = await idbGet(it.id); } catch (e) {}
                if (!blob) return showToast("File audio tidak tersedia", "error");
                engine.stop(); setIsPlaying(false); setCurrentTime(0);
                const f = new File([blob], `${String(it.name || 'Lagu').replace(/\.[^.]+$/, '')}.mp3`, { type: blob.type || 'audio/mpeg' });
                acdBlobRef.current = blob;           
                setAudioFile(f); setAudioDuration(it.duration || 0);
                setLyricsText(String(it.lyrics || '').slice(0, LYRICS_MAX)); setLyricsHistory([]);
                setCoverResults([]); setSunoErr(null); setErrorDetail(''); setUploadedUrl('');
                setLibMode(true); setLibId(it.id);
                setAppMode('cover'); setStep(4);
            };

            const [dlBusy, setDlBusy] = useState('');
            const downloadResult = async (it) => {
                if (dlBusy || !it.url) return;
                setDlBusy(it.id);
                const base = String(it.title || 'Lagu').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || 'Lagu';
                const saveRaw = (blob, ext) => {
                    const obj = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = obj; a.download = `${base}.${ext}`; a.style.display = 'none';
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(obj), 60000);
                    return `${base}.${ext}`;
                };
                const saveMp3 = (bytes) => saveRaw(new Blob([bytes], { type: 'application/octet-stream' }), 'mp3');
                try {
                    const res = await fetch(it.url);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const ab = await res.arrayBuffer();
                    if (!ab.byteLength) throw new Error('File kosong');
                    const kind = sniffAudio(new Uint8Array(ab, 0, Math.min(16, ab.byteLength)));
                    if (kind === 'mp3') {
                        showToast('Mengunduh: ' + saveMp3(ab), 'success');
                    } else {
                        const label = kind === 'unknown' ? 'non-MP3' : kind.toUpperCase();
                        let mp3 = null;
                        try {
                            showToast('File berformat ' + label + ', mengonversi...', 'info');
                            const AC = window.AudioContext || window.webkitAudioContext;
                            const ctx = new AC();
                            let abuf; try { abuf = await ctx.decodeAudioData(ab.slice(0)); } finally { try { ctx.close(); } catch (e) {} }
                            mp3 = await encodeMp3(abuf, 192, () => {});
                        } catch (ce) { console.error(ce); }
                        if (mp3) showToast('Mengunduh: ' + saveMp3(mp3), 'success');
                        else if (kind === 'unknown') throw new Error('Format file tidak dikenal');  
                        else showToast('Disimpan sebagai MP3: ' + saveMp3(ab), 'info');
                    }
                } catch (e) {
                    showToast('Mengunduh lewat tab baru...', 'info');
                    const a = document.createElement('a');
                    a.href = it.url;
                    a.download = `${base}.mp3`;
                    a.target = '_blank';
                    a.rel = 'noopener';
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } finally {
                    setDlBusy('');
                }
            };
            
            const delLib = (kind, it) => {
                if (!window.confirm('Hapus dari library?')) return;
                if (kind === 'uploads') idbDel(it.id).catch(() => {});
                setLib(l => ({ ...l, [kind]: l[kind].filter(x => x.id !== it.id) }));
            };

            const togglePlay = () => {
                if (engine.isPlaying) { engine.stop(); setIsPlaying(false); setCurrentTime(engine.getCurrentTime()); } 
                else {
                    const ok = engine.play(engine.getCurrentTime());
                    setIsPlaying(!!ok);
                    if (!ok) showToast("Audio belum siap.", "error");
                }
            };

            const handleSeek = (e) => {
                engine.seek(parseFloat(e.target.value));
                setCurrentTime(engine.getCurrentTime());
            };

            const handleRestart = () => {
                engine.seekTime(engine.trimStart);
                setCurrentTime(engine.getCurrentTime());
            };

            const setIntensity = (value) => {
                engine.setIntensity(value);
                setVocalState(prev => ({ ...prev, intensity: value }));
            };

            const setEcho = (value) => { engine.setEcho(value); setEchoLevel(value); };
            const setRobot = (value) => { engine.setRobot(value); setRobotLevel(value); };

            const handleTrim = (start, end) => {
                engine.setTrim(start, end);
                setTrimState({ start: engine.trimStart, end: engine.trimEnd });
            };

            const handleTimelineSeek = (time) => {
                engine.seekTime(time);
                setCurrentTime(engine.getCurrentTime());
            };

            const keyInputRef = useRef(null);
            const KEY_SLOTS = 5;
            const slotList = (p) => Array.from({ length: KEY_SLOTS }, (_, i) => ((p && p.savedKeys) || [])[i] || '');

            const handleKeyPaste = async () => {
                const manual = () => {
                    const el = keyInputRef.current;
                    if (el) { el.focus(); try { el.select(); } catch (e) {} }
                    showToast("Clipboard tidak dapat diakses oleh browser ini. Tempel manual: tekan lama pada kolom lalu pilih Tempel.", "info");
                };
                try {
                    if (!navigator.clipboard || typeof navigator.clipboard.readText !== 'function') return manual();
                    const text = cleanKey(await navigator.clipboard.readText());
                    if (!text) return showToast("Clipboard kosong.", "error");
                    setApiKeys(prev => ({ ...prev, kie: text }));
                    showToast("API Key ditempel dari clipboard", "success");
                } catch (err) { manual(); }
            };

            const handleSaveKey = () => {
                const k = cleanKey(apiKeys.kie);
                if (!k) return showToast("Kolom API Key masih kosong.", "error");
                const cur = slotList(apiKeys);
                if (cur.includes(k)) return showToast("Key ini sudah tersimpan di slot.", "info");
                const free = cur.findIndex(x => !x);
                if (free < 0) return showToast("Semua slot terisi. Kosongkan salah satu slot terlebih dahulu.", "error");
                cur[free] = k;
                setApiKeys(prev => ({ ...prev, savedKeys: cur }));
                showToast("Key disimpan di slot " + (free + 1), "success");
            };

            const setSlot = (i, v) => setApiKeys(prev => { const a = slotList(prev); a[i] = String(v || '').replace(/\s+/g, ''); return { ...prev, savedKeys: a }; });
            const applySlot = (i) => { const k = slotList(apiKeys)[i]; if (k) { setApiKeys(prev => ({ ...prev, kie: k })); showToast("Slot " + (i + 1) + " dipakai", "success"); } };

            const LibraryViewInline = () => (
                <>
                    {libTab === 'covers' && (
                        <div className="flex gap-2 mb-4 shrink-0 overflow-x-auto hide-scroll relative z-10">
                            {[{ id: 'all', l: 'Semua Tipe' }, { id: 'cover', l: 'Cover' }, { id: 'song', l: 'Orisinal' }, { id: 'instrumental', l: 'Instrumen' }].map(f => {
                                const n = f.id === 'all' ? lib.covers.length : lib.covers.filter(x => (x.kind || 'cover') === f.id).length;
                                return <button key={f.id} onClick={() => setLibFilter(f.id)} className={`px-3 py-1.5 rounded-md text-[10px] font-semibold uppercase tracking-wider transition-colors shadow-sm whitespace-nowrap ${libFilter === f.id ? 'bg-white text-black' : 'glass-btn text-zinc-400 hover:text-white'}`}>{f.l} ({n})</button>;
                            })}
                        </div>
                    )}
                    
                    {libTab === 'uploads' && lib.uploads.length === 0 && <div className="absolute inset-0 pointer-events-none flex items-center justify-center text-sm text-zinc-500 uppercase tracking-widest font-mono">Belum ada file import.</div>}
                    {libTab === 'covers' && lib.covers.filter(x => libFilter === 'all' || (x.kind || 'cover') === libFilter).length === 0 && <div className="absolute inset-0 pointer-events-none flex items-center justify-center text-sm text-zinc-500 uppercase tracking-widest font-mono">Belum ada hasil render.</div>}
                    
                    <div className="flex-1 overflow-y-auto flex flex-col gap-3 pr-2 hide-scroll">
                        {libTab === 'uploads' && lib.uploads.map(it => (
                            <div key={it.id} className="group flex items-center gap-3 p-3 rounded-lg glass-inner hover:border-white/20 transition-colors">
                                <div className="w-10 h-10 rounded-md bg-white/5 border border-white/10 flex items-center justify-center text-zinc-400 shrink-0 text-base">
                                    <i className="fa-solid fa-file-audio"></i>
                                </div>
                                <div className="flex-1 min-w-0 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                                    <div className="flex flex-col gap-1 min-w-0">
                                        <span className="text-xs font-semibold text-white truncate">{it.name}</span>
                                        <span className="text-[10px] font-mono text-zinc-500 uppercase tracking-wider truncate">{new Date(it.date).toLocaleDateString('id-ID')} · {formatTime(it.duration || 0)}</span>
                                    </div>
                                    <div className="lib-actions flex items-center gap-2 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <button onClick={() => useLibUpload(it)} className="h-8 px-3 glass-btn hover:bg-white text-zinc-300 hover:text-black text-[10px] font-semibold uppercase tracking-wider whitespace-nowrap rounded-md transition-colors flex items-center justify-center">Load</button>
                                        <button onClick={() => delLib('uploads', it)} className="w-8 h-8 shrink-0 flex items-center justify-center rounded-md border border-white/10 text-zinc-500 hover:text-red-400 hover:border-red-500/30 hover:bg-red-500/10 transition-colors"><i className="fa-solid fa-trash-can text-xs"></i></button>
                                    </div>
                                </div>
                            </div>
                        ))}
                        {libTab === 'covers' && lib.covers.filter(x => libFilter === 'all' || (x.kind || 'cover') === libFilter).map(it => (
                            <div key={it.id} className="group flex flex-col gap-3 p-3 rounded-lg glass-inner hover:border-white/20 transition-colors">
                                <div className="flex items-center gap-3">
                                    {it.image ? <img src={it.image} alt="" className="w-10 h-10 rounded-md object-cover shrink-0 border border-white/10" /> : <div className="w-10 h-10 rounded-md bg-white/5 border border-white/10 flex items-center justify-center text-zinc-400 shrink-0 text-base"><i className="fa-solid fa-compact-disc"></i></div>}
                                    <div className="flex-1 min-w-0 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                                        <div className="flex flex-col gap-1 min-w-0">
                                            <span className="text-xs font-semibold text-white truncate">{it.title}</span>
                                            <span className="text-[10px] font-mono text-zinc-500 uppercase tracking-wider truncate">{new Date(it.date).toLocaleDateString('id-ID')} · {SONG_KIND_LABEL[it.kind || 'cover']}</span>
                                        </div>
                                        <div className="lib-actions flex items-center gap-2 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button onClick={() => downloadResult(it)} disabled={!!dlBusy} className="h-8 px-3 glass-btn hover:bg-white disabled:hover:bg-transparent text-zinc-300 hover:text-black disabled:opacity-50 text-[10px] font-semibold uppercase tracking-wider whitespace-nowrap min-w-[84px] flex items-center justify-center rounded-md transition-colors">
                                                {dlBusy === it.id ? <i className="fa-solid fa-spinner fa-spin"></i> : 'Export MP3'}
                                            </button>
                                            <button onClick={() => delLib('covers', it)} className="w-8 h-8 shrink-0 flex items-center justify-center rounded-md border border-white/10 text-zinc-500 hover:text-red-400 hover:border-red-500/30 hover:bg-red-500/10 transition-colors"><i className="fa-solid fa-trash-can text-xs"></i></button>
                                        </div>
                                    </div>
                                </div>
                                <audio controls preload="none" src={it.url} className="w-full h-9 outline-none invert opacity-90 rounded-md bg-white"></audio>
                            </div>
                        ))}
                    </div>
                </>
            );

            return (
                <div className="flex flex-col h-full relative font-sans text-zinc-300">
                    {/* Top Navigation Bar */}
                    <div className="h-16 px-6 md:px-8 flex justify-between items-center glass-panel border-b border-white/10 shrink-0 z-20 shadow-lg">
                        <div className="flex items-center gap-5">
                            {appMode !== 'home' && <button onClick={goHome} title="Return to Home" className="w-10 h-10 rounded-full flex items-center justify-center glass-btn text-zinc-300 hover:text-white"><i className="fa-solid fa-arrow-left text-sm"></i></button>}
                            <div className="flex items-center gap-3 cursor-pointer" onClick={goHome}>
                                <TechLogo className="text-white w-5 h-5" />
                                <div className="flex flex-col">
                                    <div className="flex items-center gap-2">
                                        <h1 className="text-sm font-bold tracking-wide text-white leading-tight">Musiclabs</h1>
                                        <span className="px-1.5 py-[3px] rounded-md bg-white/10 border border-white/15 text-[9px] font-semibold tracking-widest text-zinc-300 leading-none">AI</span>

                                    <span className="mt-2 text-[8px] leading-none font-medium uppercase tracking-[0.18em] text-zinc-500">Created by Ahmad VR</span>
                                </div>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            {[{ id: 'kie', label: 'API' }].map(it => {
                                const v = statusView(it.id);
                                return (
                                    <button key={it.id} onClick={() => setShowSettings(true)} className="flex items-center gap-2.5 px-3 py-1.5 rounded-full glass-inner hover:border-white/30 transition-colors cursor-pointer shadow-sm">
                                        <span className={`w-2 h-2 rounded-full ${v.dot}`}></span>
                                        <span className={`text-xs font-semibold ${v.textColor}`}>{v.short}</span>
                                    </button>
                                );
                            })}
                            <button onClick={() => setShowSettings(true)} className="w-10 h-10 rounded-full flex items-center justify-center glass-btn text-zinc-300 hover:text-white shadow-sm">
                                <i className="fa-solid fa-sliders text-sm"></i>
                            </button>
                        </div>
                    </div>

                    {/* App Header (Steps) for Cover Mode */}
                    <div className={`${appMode === 'cover' ? 'flex' : 'hidden'} px-6 py-4 shrink-0 glass-panel border-b border-white/5 overflow-x-auto hide-scroll justify-center shadow-md z-10`}>
                        <div className="flex items-center max-w-3xl w-full justify-between">
                            {[[1, 'Import'], [2, 'ACD Process'], [4, 'Parameters'], [5, 'Render']].map(([num, lbl], i, arr) => {
                                const isActive = step === num;
                                const isDone = step > num;
                                const clickable = isDone && !(libMode && (num === 2 || num === 3)); 
                                return (
                                    <React.Fragment key={num}>
                                        <div onClick={() => clickable ? goStep(num) : null} className={`flex flex-col items-center gap-2 ${clickable ? 'cursor-pointer group' : ''} px-2`}>
                                            <div className={`w-6 h-6 rounded-full flex items-center justify-center border text-[11px] transition-all duration-300 ${isActive ? 'bg-white border-white text-black scale-110' : isDone ? 'glass-btn border-zinc-500 text-zinc-300 group-hover:border-white group-hover:text-white' : 'bg-black/30 border-white/10 text-zinc-600'}`}>
                                                {isDone && !isActive ? <i className="fa-solid fa-check"></i> : num}
                                            </div>
                                            <span className={`text-xs uppercase tracking-wider font-semibold ${isActive ? 'text-white' : isDone ? 'text-zinc-400 group-hover:text-white' : 'text-zinc-600'}`}>{lbl}</span>
                                        </div>
                                        {i < arr.length - 1 && (
                                            <div className="flex-1 h-[2px] mx-2 -mt-6 bg-white/10 rounded-full overflow-hidden">
                                                <div className="h-full bg-white transition-all duration-500 ease-out" style={{ width: isDone ? '100%' : '0%' }}></div>
                                            </div>
                                        )}
                                    </React.Fragment>
                                );
                            })}
                        </div>
                    </div>

                    {/* Home Mode View */}
                    {appMode === 'home' && (
                        <div className="flex-1 flex flex-col p-6 md:p-10 gap-8 overflow-y-auto hide-scroll pb-20 relative">
                            <div className="glass-panel rounded-2xl p-8 max-w-5xl mx-auto w-full text-center md:text-left flex flex-col md:flex-row items-center justify-between gap-8 z-10 shadow-xl">
                                <div>
                                    <h2 className="text-xl md:text-2xl font-bold text-white mb-2 font-mono"><span className="text-zinc-500">{">_"}</span> Welcome to Musiclabs AI</h2>
                                </div>
                                <div className="flex flex-col md:flex-row gap-4 w-full md:w-auto">
                                    <button onClick={() => setAppMode('cover')} className="glass-card p-5 rounded-xl flex items-center gap-4 hover:-translate-y-1 hover:border-white/30 transition-all text-left group">
                                        <div className="w-12 h-12 shrink-0 rounded-full bg-white/5 flex items-center justify-center text-xl text-zinc-300 group-hover:bg-white group-hover:text-black transition-all shadow-inner">
                                            <i className="fa-solid fa-wave-square"></i>
                                        </div>
                                        <div>
                                            <h3 className="text-base font-bold text-white mb-1 group-hover:text-white transition-colors">Cover</h3>
                                            <p className="text-xs text-zinc-400">Proses audio sumber dan buat versi cover.</p>
                                        </div>
                                    </button>
                                    <button onClick={() => setAppMode('song')} className="glass-card p-5 rounded-xl flex items-center gap-4 hover:-translate-y-1 hover:border-white/30 transition-all text-left group">
                                        <div className="w-12 h-12 shrink-0 rounded-full bg-white/5 flex items-center justify-center text-xl text-zinc-300 group-hover:bg-white group-hover:text-black transition-all shadow-inner">
                                            <i className="fa-solid fa-music"></i>
                                        </div>

                                        <label className="text-xs uppercase tracking-wider font-semibold text-zinc-400 mb-3 block">Callback URL (Opsional)</label>
                                        <input type="text" autoComplete="off" autoCapitalize="none" autoCorrect="off" spellCheck={false} value={apiKeys.callback || ''} onChange={e => setApiKeys({...apiKeys, callback: e.target.value})} className="w-full glass-inner border border-white/10 rounded-xl px-4 py-3 text-sm font-mono text-white focus:border-white/40 focus:ring-1 focus:ring-white/20 outline-none transition-all placeholder:text-zinc-600" placeholder="https://..." />
                                    </div>
                                </div>

                                <button onClick={() => setShowSettings(false)} className="w-full mt-8 glass-btn hover:bg-white text-zinc-200 hover:text-black font-bold uppercase tracking-widest py-4 rounded-xl transition-all text-sm shadow-lg text-center">
                                    Tutup Pengaturan
                                </button>
                            </div>
                        </div>
                    )}

                    <div id="toast-container" className="fixed bottom-8 left-1/2 -translate-x-1/2 flex flex-col gap-3 z-[60] w-full max-w-sm px-4 pointer-events-none"></div>
                </div>
            );
        }

        // =====================================================================================
        // BUAT LAGU BARU (Song Generator Component)
        // =====================================================================================
        const KIE_GEN_URL = 'https://api.kie.ai/api/v1/generate';
        const SONG_DURATIONS = [0, 60, 90, 120, 180, 240, 300, 360]; 
        const SONG_TAGS = ['[Intro]', '[Verse 1]', '[Pre-Chorus]', '[Chorus]', '[Verse 2]', '[Bridge]', '[Outro]'];
        const SONG_KIND_LABEL = { cover: 'Cover', song: 'Lagu Baru', instrumental: 'Instrumental' };

        async function kieAsk(prompt, key, signal, ms) { return kieChat(prompt, key, { timeout: ms, signal }); }

        function buildSongStylePrompt(style, o) {
            const tags = o.tags || [];
            const vocalRule = o.instrumental
                ? 'VOCAL: this is an INSTRUMENTAL track. Do NOT write any vocal descriptor.'
                : tags.length
                    ? `VOCAL: the app puts vocal tags: "${tags.join(', ')}". Do NOT write vocal descriptors in output.`
                    : 'VOCAL: Add exactly ONE clear vocal descriptor right after the genre.';
            return [
                'You are a prompt specialist. Convert the user description into a STYLE prompt.',
                `USER DESCRIPTION: ${style}`,
                vocalRule,
                'OUTPUT: valid JSON {"style": "..."} only, no other text.'
            ].join('\n');
        }

        function buildSongWritePrompt(style, o) {
            const tags = o.tags || [];
            return [
                'You are an award-winning songwriter.',
                `SONG BRIEF: ${style}`,
                tags.length ? `VOICE: ${tags.join(', ')}` : null,
                'LANGUAGE: Indonesian if not specified.',
                'STRUCTURE: Use [Verse 1], [Chorus] labels on own lines. Plain text only.'
            ].filter(x => x !== null).join('\n');
        }

        function buildSongPolishPrompt(lyrics, style) {
            return [
                'You are a senior lyric editor.',
                style ? `SONG BRIEF: ${style}` : null,
                'TASK: polish lyrics to professional quality. Keep structure and tags.',
                'OUTPUT: only the polished lyrics as plain text.',
                'LYRICS:',
                lyrics
            ].filter(x => x !== null).join('\n');
        }

        function deriveSongTitle(kind, lyrics, style) {
            const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
            if (kind === 'vocal') {
                const line = String(lyrics || '').split('\n').map(l => l.replace(/\[[^\]]*\]/g, ' ').replace(/([A-Za-zÀ-ÿ])-(?=[A-Za-zÀ-ÿ])/g, '$1').replace(/[^\p{L}\p{N}\s'’]/gu, ' ').replace(/\s+/g, ' ').trim()).find(l => /[A-Za-zÀ-ɏ]/.test(l));
                if (line) return cap(line.split(' ').slice(0, 6).join(' ')).slice(0, 80);
                return 'Lagu Baru';
            }
            const first = String(style || '').split(',')[0].replace(/[^\p{L}\p{N}\s'’-]/gu, ' ').replace(/\s+/g, ' ').trim();
            const words = first.split(' ').filter(Boolean).slice(0, 4).map(cap).join(' ');
            return (words ? `${words} Instrumental` : 'Instrumental').slice(0, 80);
        }

        function NewSong({ apiKeys, lib, setLib, refreshCredits, refreshCreditsLater, onSongDone }) {
            const [kind, setKind] = useState('vocal'); 
            const [style, setStyle] = useState('');
            const [prevStyle, setPrevStyle] = useState(null);
            const [lyrics, setLyrics] = useState('');
            const [lyricsHistory, setLyricsHistory] = useState([]);
            const [vocal, setVocal] = useState({ genders: [], age: '', range: '', traits: [] });
            const [duration, setDuration] = useState(0);
            const [ai, setAi] = useState('');   
            const [gen, setGen] = useState(false);
            const [msg, setMsg] = useState('');
            const [elapsed, setElapsed] = useState(0);
            const [err, setErr] = useState(null);
            const aiAbort = useRef(null);
            const genAbort = useRef(null);
            const cancelGen = useRef(false);
            const lyricsRef = useRef(null);

            const instrumental = kind === 'instrumental';
            const vocalTags = instrumental ? [] : vocalTagList(vocal);
            const apiGender = vocalTags.length && vocal.genders.length === 1 ? vocal.genders[0] : '';
            const finalStyle = composeStyle(style, vocalTags);
            const busy = !!ai || gen;
            const title = deriveSongTitle(kind, lyrics, style);

            useEffect(() => {
                if (!busy) { setElapsed(0); return; }
                const t0 = Date.now();
                const id = setInterval(() => setElapsed(Math.floor((Date.now() - t0) / 1000)), 1000);
                return () => clearInterval(id);
            }, [busy]);

            const toggleGender = (id) => setVocal(v => {
                const g = v.genders.includes(id) ? v.genders.filter(x => x !== id) : [...v.genders, id];
                return g.length ? { ...v, genders: g, range: '', traits: v.traits.filter(t => !(t === 'falsetto' && g.length === 1 && g[0] === 'f')) } : { genders: [], age: '', range: '', traits: [] };
            });
            const pickAge = (id) => setVocal(v => { const age = v.age === id ? '' : id; const young = ['child', 'teen'].includes(age); return { ...v, age, range: age === 'child' ? '' : v.range, traits: v.traits.filter(t => !(young && V_YOUNG_BLOCK.includes(t))) }; });
            const pickRange = (r) => setVocal(v => ({ ...v, range: v.range === r ? '' : r }));
            const toggleTrait = (id) => setVocal(v => v.traits.includes(id) ? { ...v, traits: v.traits.filter(t => t !== id) } : (traitBlocked(id, v) ? v : { ...v, traits: [...v.traits, id] }));

            const insertTag = (tag) => {
                const el = lyricsRef.current; const pos = el ? el.selectionStart : lyrics.length;
                const before = lyrics.slice(0, pos), after = lyrics.slice(pos);
                const ins = `${before && !before.endsWith('\n') ? '\n' : ''}${tag}\n`;
                if (lyrics.length + ins.length > LYRICS_MAX) return showToast(`Batas ${LYRICS_MAX} karakter tercapai.`, "error");
                setLyricsHistory(h => [...h.slice(-19), lyrics]);
                setLyrics(before + ins + after);
                setTimeout(() => { if (el) { el.focus(); const c = (before + ins).length; el.setSelectionRange(c, c); } }, 0);
            };
            const undoLyrics = () => {
                if (!lyricsHistory.length) return;
                setLyrics(lyricsHistory[lyricsHistory.length - 1]);
                setLyricsHistory(h => h.slice(0, -1));
            };

            const runAi = async (type) => {
                if (busy) return;
                const key = cleanKey(apiKeys.kie);
                if (!key) return showToast('API Key belum diisi. Tambahkan di Pengaturan.', 'error');
                const st = style.trim(), ly = lyrics.trim();
                if ((type === 'style' || type === 'write') && !st) return showToast('Style belum diisi.', 'error');
                if (type === 'polish' && !ly) return showToast('Lirik belum diisi.', 'error');
                const ctrl = new AbortController(); aiAbort.current = ctrl;
                setAi(type); setErr(null);
                try {
                    if (type === 'style') {
                        const raw = await kieAsk(buildSongStylePrompt(st, { tags: vocalTags, instrumental, lyrics: instrumental ? '' : lyrics }), key, ctrl.signal, 120000);
                        const out = parseStyleResponse(raw);
                        if (!out) throw new Error('Hasil kosong');
                        setPrevStyle(style); setStyle(out.slice(0, STYLE_MAX));
                    } else {
                        const prompt = type === 'write' ? buildSongWritePrompt(st, { tags: vocalTags }) : buildSongPolishPrompt(ly, st);
                        const raw = await kieAsk(prompt, key, ctrl.signal, 180000);
                        const out = parseLyricsResponse(raw);
                        if (!out) throw new Error('Hasil lirik kosong');
                        setLyricsHistory(h => [...h.slice(-19), lyrics]);
                        setLyrics(out.slice(0, LYRICS_MAX));
                    }
                } catch (e) {
                    if (e.cancelled) showToast('Dibatalkan', 'info');
                    else setErr({ title: 'AI Error', msg: e.message, raw: e.detail });
                } finally {
                    aiAbort.current = null; setAi('');
                    setTimeout(refreshCredits, 3000);
                }
            };
            const cancelAi = () => { if (aiAbort.current) aiAbort.current.abort(); };

            const generate = async () => {
                if (busy) return;
                const key = cleanKey(apiKeys.kie);
                if (!key) return showToast('API Key belum diisi. Tambahkan di Pengaturan.', 'error');
                if (!style.trim()) return showToast('Style belum diisi.', 'error');
                if (!instrumental && !lyrics.trim()) return showToast('Lirik belum diisi.', 'error');
                
                const lyr = instrumental ? '' : lyrics.trim();
                const sig = hash36(['song', kind, finalStyle, lyr, apiGender, duration, KIE_SUNO_MODEL].join('\u0001'));
                
                const ctrl = new AbortController(); genAbort.current = ctrl; cancelGen.current = false;
                const chk = () => { if (cancelGen.current) throw new Error('Dibatalkan'); };
                const auth = { 'Authorization': `Bearer ${key}` };
                let taskId = '';
                setGen(true); setErr(null); setMsg('Mengirim tugas ke AI...');
                try {
                    const base = { customMode: true, instrumental, model: KIE_SUNO_MODEL, callBackUrl: cleanKey(apiKeys.callback) || KIE_DEFAULT_CALLBACK, title, style: finalStyle };
                    if (!instrumental) { base.prompt = lyr; base.lyrics = lyr; if (apiGender) base.vocalGender = apiGender; }
                    const submit = async (b) => {
                        const res = await fetchT(KIE_GEN_URL, { method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'application/json', ...auth }, body: JSON.stringify(b) }, 90000);
                        return { res, j: await res.json().catch(() => ({})) };
                    };
                    let r = await submit(duration ? { ...base, duration } : base);
                    chk();
                    if (!(r.res.ok && Number(r.j.code) === 200 && r.j.data && r.j.data.taskId)) {
                        throw new Error(`Ditolak: ${r.j.msg || 'Error'}`);
                    }
                    taskId = r.j.data.taskId; pendAdd(taskId, title || 'Lagu');

                    const t0 = Date.now(); let fails = 0, tracks = [];
                    while (true) {
                        chk();
                        if (Date.now() - t0 > 600000) throw new Error(`Terlalu lama.`);
                        await new Promise(res => setTimeout(res, 5000)); chk();
                        let info;
                        try {
                            const rr = await fetchT(`${KIE_SUNO_INFO}?taskId=${encodeURIComponent(taskId)}`, { headers: auth, signal: ctrl.signal }, 30000);
                            const d = await rr.json().catch(() => ({}));
                            if (!rr.ok || Number(d.code) !== 200) throw new Error(d.msg || `HTTP ${rr.status}`);
                            info = d.data || {}; fails = 0;
                        } catch (e) {
                            if (e.name === 'AbortError' || ++fails > 5) throw e; continue;
                        }
                        const status = info.status || '';
                        setMsg(`AI sedang memproses... (${status})`);
                        if (status === 'SUCCESS') { 
                            pendDel(taskId); 
                            tracks = (info.response && (info.response.sunoData || info.response.data)) || [];
                            break; 
                        }
                        if (['CREATE_TASK_FAILED', 'GENERATE_AUDIO_FAILED', 'SENSITIVE_WORD_ERROR'].includes(status)) {
                            pendDel(taskId); throw new Error(`Gagal: ${info.errorMessage || status}`);
                        }
                    }

                    const results = tracks.map((x, i) => ({
                        id: x.id || i, title: x.title || `Song ${i + 1}`,
                        url: x.audio_url || x.source_audio_url || x.stream_audio_url || '',
                        image: x.image_url || x.source_image_url || '', duration: x.duration, kind: instrumental ? 'instrumental' : 'song'
                    })).filter(x => x.url);
                    if (!results.length) throw new Error(`Proses selesai tapi tidak ada audio.`);
                    setLib(l => ({ ...l, covers: [...results.map(r => ({ ...r, id: 's' + Date.now() + '-' + r.id, source: 'AI Generator', style: finalStyle, sig, date: Date.now() })), ...l.covers] }));
                    showToast(`Proses selesai. ${results.length} versi lagu dihasilkan.`, "success");
                    onSongDone(instrumental ? 'instrumental' : 'song');

                } catch (e) {
                    if (cancelGen.current || e.name === 'AbortError') showToast('Dibatalkan', 'info');
                    else {
                        setErr({ title: 'Proses gagal', msg: e.message, raw: e.raw });
                        showToast("Pembuatan lagu gagal", 'error');
                    }
                } finally {
                    genAbort.current = null; setGen(false);
                    refreshCreditsLater();
                }
            };
            const cancelGenerate = () => { cancelGen.current = true; if (genAbort.current) genAbort.current.abort(); };

            const aiBtn = (type, idleIcon, idleLabel, busyLabel, extra = '') => (
                <button onClick={() => runAi(type)} disabled={busy || (type === 'polish' ? !lyrics.trim() : !style.trim())} className={`px-5 py-2.5 rounded-lg text-xs font-semibold uppercase tracking-wider transition-all shadow-sm flex items-center justify-center gap-2 ${extra} disabled:opacity-50 disabled:cursor-not-allowed`}>
                    {ai === type ? <><i className="fa-solid fa-circle-notch fa-spin"></i> {busyLabel}</> : <><i className={`fa-solid ${idleIcon}`}></i> {idleLabel}</>}
                </button>
            );

            return (
                <div className="h-full relative font-sans text-zinc-300">
                    
                    {gen && (
                        <div className="absolute inset-0 bg-black/80 backdrop-blur-md z-40 flex flex-col items-center justify-center animate-fade-in px-6 text-center">
                            <div className="glass-panel p-10 rounded-2xl flex flex-col items-center max-w-md w-full border border-white/10 shadow-2xl">
                                <div className="relative mb-8">
                                    <svg viewBox="0 0 100 100" className="w-20 h-20 animate-spin text-zinc-800">
                                        <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" strokeWidth="4" />
                                    </svg>
                                    <svg viewBox="0 0 100 100" className="w-20 h-20 animate-spin absolute inset-0 text-white" style={{ animationDuration: '2s' }}>
                                        <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" strokeWidth="4" strokeDasharray="80" strokeLinecap="round"/>
                                    </svg>
                                </div>
                                <h3 className="text-lg font-bold text-white mb-2 tracking-wide">Memproses Lagu...</h3>
                                <p className="text-sm font-mono text-zinc-400 mb-6 bg-black/40 px-4 py-1.5 rounded-full border border-white/5">{msg}</p>
                                <p className="text-xs font-mono text-zinc-500 mb-8">Waktu berjalan: {elapsed} detik</p>
                                
                                <button onClick={cancelGenerate} className="px-6 py-2.5 rounded-lg border border-red-500/50 text-xs font-bold uppercase tracking-widest text-red-400 hover:text-white hover:bg-red-500 hover:border-red-500 transition-all w-full">Batalkan</button>
                            </div>
                        </div>
                    )}

                    <div className="h-full overflow-y-auto max-w-4xl mx-auto">
                        <div className="p-6 md:p-10 flex flex-col gap-6 animate-fade-in pb-24">
                            
                            <div className="flex p-1.5 glass-card rounded-xl shadow-lg border border-white/10 w-full max-w-md mx-auto">
                                {[{ id: 'vocal', l: 'Mode Vokal', i: 'fa-microphone-lines' }, { id: 'instrumental', l: 'Instrumental', i: 'fa-guitar' }].map(t => (
                                    <button key={t.id} onClick={() => !busy && setKind(t.id)} disabled={busy} className={`flex-1 py-3 text-sm font-bold transition-all rounded-lg flex items-center justify-center gap-2 ${kind === t.id ? 'bg-white text-black shadow-md scale-[1.02]' : 'text-zinc-400 hover:text-white hover:bg-white/5'}`}>
                                        <i className={`fa-solid ${t.i}`}></i> {t.l}
                                    </button>
                                ))}
                            </div>

                            {err && (
                                <div className="glass-panel border border-red-500/50 p-6 rounded-2xl shadow-xl text-white">
                                    <div className="font-bold text-lg mb-2 flex items-center gap-3 text-red-400"><i className="fa-solid fa-triangle-exclamation"></i> {err.title}</div>
                                    <div className="text-sm">{err.msg}</div>
                                </div>
                            )}

                            <div className="glass-card border border-white/10 rounded-2xl p-6 md:p-8 flex flex-col gap-6 shadow-xl">
                                <div className="flex items-center justify-between border-b border-white/10 pb-4">
                                    <h3 className="text-base md:text-lg font-bold uppercase tracking-wider flex items-center gap-3 text-white"><div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i className="fa-solid fa-sliders text-zinc-300 text-sm"></i></div> Style Lagu</h3>
                                    <span className="text-xs font-mono text-zinc-500 bg-black/40 px-3 py-1 rounded-full border border-white/5">{style.length}/{STYLE_MAX}</span>
                                </div>
                                <div className="space-y-3">
                                    <textarea value={style} onChange={e => setStyle(e.target.value)} readOnly={ai === 'style'} rows={2} maxLength={STYLE_MAX} placeholder="Contoh: Pop akustik ceria, tempo lambat, melodi romantis..." className="w-full glass-inner border border-white/5 rounded-xl p-4 text-sm md:text-base text-zinc-200 focus:border-white/40 focus:ring-1 focus:ring-white/20 outline-none resize-y transition-all font-sans placeholder:text-zinc-600" />
                                </div>
                                <div className="flex flex-wrap items-center gap-3">
                                    {aiBtn('style', 'fa-wand-magic-sparkles', 'Optimasi Style', 'Memproses...', 'glass-btn hover:bg-white text-zinc-200 hover:text-black hover:border-transparent flex-1')}
                                    {prevStyle !== null && !busy && <button onClick={() => { setStyle(prevStyle); setPrevStyle(null); }} className="px-4 py-2.5 text-sm font-semibold text-zinc-400 hover:text-white transition-colors">Urungkan</button>}
                                </div>
                            </div>

                            {!instrumental && (
                                <div className="glass-card border border-white/10 rounded-2xl p-6 md:p-8 flex flex-col gap-6 shadow-xl">
                                    <div className="border-b border-white/10 pb-4">
                                        <h3 className="text-base md:text-lg font-bold uppercase tracking-wider flex items-center gap-3 text-white"><div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i className="fa-solid fa-microphone text-zinc-300 text-sm"></i></div> Konfigurasi Vokal</h3>
                                    </div>
                                    <div className="flex gap-2">{[{ id: 'f', l: 'Penyanyi Wanita' }, { id: 'm', l: 'Penyanyi Pria' }].map(o => <Chip key={o.id} on={vocal.genders.includes(o.id)} onClick={() => toggleGender(o.id)}>{o.l}</Chip>)}</div>
                                    {vocal.genders.length > 0 && (<div className="space-y-4 p-4 glass-inner rounded-xl border border-white/5 mt-2">
                                        <div className="flex flex-wrap gap-2">{VOCAL_AGES.map(a => <Chip key={a.id} on={vocal.age === a.id} onClick={() => pickAge(a.id)}>{a.l}</Chip>)}</div>
                                        {vocal.genders.length === 1 && vocal.age !== 'child' && (
                                            <div className="flex flex-wrap gap-2 pt-2 border-t border-white/5">{VOCAL_RANGES[vocal.genders[0]].map(r => <Chip key={r} on={vocal.range === r} onClick={() => pickRange(r)}>{r}</Chip>)}</div>
                                        )}
                                        <div className="flex flex-wrap gap-2 pt-2 border-t border-white/5">{VOCAL_TRAITS.map(t => <Chip key={t.id} on={vocal.traits.includes(t.id)} disabled={traitBlocked(t.id, vocal)} onClick={() => toggleTrait(t.id)}>{t.l}</Chip>)}</div>
                                    </div>)}
                                </div>
                            )}

                            {!instrumental && (
                                <div className="glass-card border border-white/10 rounded-2xl p-6 md:p-8 flex flex-col gap-6 shadow-xl">
                                    <div className="flex items-center justify-between border-b border-white/10 pb-4">
                                        <h3 className="text-base md:text-lg font-bold uppercase tracking-wider flex items-center gap-3 text-white"><div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i className="fa-solid fa-align-left text-zinc-300 text-sm"></i></div> Editor Lirik</h3>
                                    </div>
                                    <div className="space-y-3">
                                        <label className="text-xs text-zinc-400 font-semibold uppercase tracking-wider">Template Struktur</label>
                                        <div className="flex gap-2 overflow-x-auto hide-scroll pb-2 snap-x">
                                            {SONG_TAGS.map(t => (<button key={t} onClick={() => insertTag(t)} className="snap-start shrink-0 px-4 py-1.5 rounded-full glass-btn text-xs font-semibold text-zinc-300 hover:text-white transition-colors">{t}</button>))}
                                        </div>
                                    </div>
                                    <textarea ref={lyricsRef} value={lyrics} onChange={e => setLyrics(e.target.value)} maxLength={LYRICS_MAX} readOnly={ai === 'write' || ai === 'polish'} spellCheck={false} placeholder="Masukkan lirik lagu. Gunakan tag bagian seperti [Verse 1] atau [Chorus]." className="w-full glass-inner border border-white/5 rounded-xl p-5 text-sm md:text-base leading-relaxed text-zinc-200 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/20 font-mono whitespace-pre-wrap resize-y min-h-[300px] transition-all placeholder:text-zinc-600" />
                                    
                                    <div className="flex flex-col sm:flex-row items-center gap-3 pt-2">
                                        {aiBtn('write', 'fa-pen-nib', 'Susun Lirik', 'Menyusun...', 'glass-btn hover:bg-white text-zinc-200 hover:text-black hover:border-transparent flex-1 w-full')}
                                        {aiBtn('polish', 'fa-wand-magic', 'Format Lirik', 'Memformat...', 'glass-btn hover:bg-white text-zinc-200 hover:text-black hover:border-transparent flex-1 w-full')}
                                    </div>
                                </div>
                            )}

                            <div className="pt-6">
                                <button onClick={generate} disabled={!style.trim() || (!instrumental && !lyrics.trim())} className="w-full disabled:opacity-50 disabled:cursor-not-allowed bg-white text-black py-5 rounded-2xl text-base font-bold uppercase tracking-widest hover:bg-zinc-200 hover:scale-[1.01] transition-all text-center flex items-center justify-center gap-3">
                                    <i className="fa-solid fa-bolt text-lg"></i> Generate Lagu
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function Chip({ on, disabled, onClick, children }) {
            return <button type="button" disabled={disabled} onClick={onClick} className={`px-4 py-2 rounded-full border text-xs font-bold uppercase tracking-wider transition-all shadow-sm ${on ? 'bg-white border-white text-black' : 'glass-btn border-white/10 text-zinc-400 hover:text-white hover:border-white/30'} ${disabled ? 'opacity-30 cursor-not-allowed' : ''}`}>{children}</button>;
        }

        function formatPrecise(secs) {
            const t = Math.round(Math.max(0, secs) * 10);
            const m = Math.floor(t / 600);
            const s = (t % 600) / 10;
            return `${m}:${s < 10 ? '0' : ''}${s.toFixed(1)}`;
        }

        function Studio({ fileName, duration, currentTime, isPlaying, togglePlay, handleRestart, handleSeek, formatTime, vocalState, setIntensity, echoLevel, setEcho, robotLevel, setRobot, engine, trim, onTrim, onSeekTime }) {
            return (
                <div className="flex flex-col gap-4 animate-fade-in text-zinc-300">
                    <div className="glass-card rounded-2xl p-5 md:p-6 relative overflow-hidden shadow-xl">
                        <div className="text-xs font-bold text-white uppercase tracking-widest mb-4 flex items-center gap-3 border-b border-white/10 pb-3">
                            <div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i className="fa-solid fa-chart-simple text-zinc-300"></i></div> Monitor Spektrum
                        </div>
                        <div className="h-28 w-full rounded-xl relative glass-inner overflow-hidden border border-white/5">
                            <SpectrumVisualizer engine={engine} isPlaying={isPlaying} />
                        </div>
                    </div>
                    
                    <TimelineWaveformCard engine={engine} duration={duration} currentTime={currentTime} isPlaying={isPlaying} togglePlay={togglePlay} handleRestart={handleRestart} handleSeek={handleSeek} trim={trim} onTrim={onTrim} onSeekTime={onSeekTime} formatTime={formatTime} />

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <CutAudioCard duration={duration} currentTime={currentTime} trim={trim} onTrim={onTrim} />
                        <FilterCard state={vocalState} onIntensity={setIntensity} />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <RobotCard level={robotLevel} onLevel={setRobot} />
                        <EchoCard level={echoLevel} onLevel={setEcho} />
                    </div>
                </div>
            );
        }

        function SpectrumVisualizer({ engine, isPlaying }) {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const vAnalyser = engine.vocalAnalyser;
                const bufferLength = vAnalyser.frequencyBinCount;
                const vData = new Uint8Array(bufferLength);
                let req;
                const drawCurve = (dataArray, color, fillStyle) => {
                    ctx.beginPath();
                    ctx.moveTo(0, canvas.height);
                    const sliceWidth = canvas.width * 1.0 / (bufferLength / 1.5); 
                    let x = 0;
                    for(let i = 0; i < bufferLength; i++) {
                        const v = dataArray[i] / 255.0;
                        const y = canvas.height - (v * canvas.height * 0.9);
                        if(i === 0) ctx.lineTo(x, y);
                        else {
                            const prevV = dataArray[i-1] / 255.0;
                            const prevY = canvas.height - (prevV * canvas.height * 0.9);
                            const xc = (x - sliceWidth + x) / 2;
                            const yc = (prevY + y) / 2;
                            ctx.quadraticCurveTo(x - sliceWidth, prevY, xc, yc);
                        }
                        x += sliceWidth;
                    }
                    ctx.lineTo(canvas.width, canvas.height);
                    ctx.lineTo(0, canvas.height);
                    ctx.fillStyle = fillStyle;
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = color;
                    ctx.stroke();
                };
                const render = () => {
                    req = requestAnimationFrame(render);
                    vAnalyser.getByteFrequencyData(vData);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    const vGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    vGrad.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
                    vGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    drawCurve(vData, '#ffffff', vGrad);
                };
                render();
                return () => cancelAnimationFrame(req);
            }, [engine]);
            return <canvas ref={canvasRef} width="600" height="150" className="w-full h-full absolute inset-0"></canvas>;
        }

        function TimelineWaveformCard({ engine, duration, currentTime, isPlaying, togglePlay, handleRestart, handleSeek, trim, onTrim, onSeekTime, formatTime }) {
            const d = duration || 0;
            const minGap = Math.min(MIN_CUT, d);
            const trackRef = useRef(null);
            const canvasRef = useRef(null);
            const dragRef = useRef(null);
            const [peaks, setPeaks] = useState(null);

            useEffect(() => { setPeaks(engine.getPeaks(600)); }, [engine, duration]);

            useEffect(() => {
                const c = canvasRef.current;
                if (!c || !peaks) return;
                const g = c.getContext('2d');
                const W = c.width, H = c.height;
                g.clearRect(0, 0, W, H);
                g.fillStyle = 'rgba(255,255,255,0.9)';
                const bw = W / peaks.length;
                for (let b = 0; b < peaks.length; b++) {
                    const h = Math.max(1, Math.pow(peaks[b], 0.7) * H * 0.85);
                    g.fillRect(b * bw, (H - h) / 2, Math.max(1, bw - 0.5), h);
                }
            }, [peaks]);

            const startPct = d > 0 ? (trim.start / d) * 100 : 0;
            const endPct = d > 0 ? (trim.end / d) * 100 : 100;
            const playPct = d > 0 ? Math.min(100, Math.max(0, (currentTime / d) * 100)) : 0;

            const timeFromX = (clientX) => {
                const r = trackRef.current.getBoundingClientRect();
                return Math.min(1, Math.max(0, (clientX - r.left) / r.width)) * d;
            };
            const handleDown = (which) => (e) => {
                e.preventDefault();
                try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
                dragRef.current = which;
            };
            const handleMove = (which) => (e) => {
                if (dragRef.current !== which) return;
                const t = timeFromX(e.clientX);
                if (which === 'start') onTrim(Math.min(t, trim.end - minGap), trim.end);
                else onTrim(trim.start, Math.max(t, trim.start + minGap));
            };
            const handleUp = (e) => { dragRef.current = null; try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {} };
            const handleTap = (e) => { onSeekTime(Math.min(Math.max(timeFromX(e.clientX), trim.start), Math.max(trim.start, trim.end - 0.05))); };

            return (
                <div className="glass-card rounded-2xl p-5 md:p-6 flex flex-col gap-4 shadow-xl">
                    <div className="flex justify-between items-center border-b border-white/10 pb-3">
                        <div className="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-3">
                            <div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i className="fa-solid fa-timeline text-zinc-300 text-sm"></i></div> Ruang Kerja Audio
                        </div>
                    </div>
                    <div>
                        <div ref={trackRef} className="relative h-24 select-none glass-inner rounded-xl overflow-hidden border border-white/10">
                            <div className="absolute inset-0 cursor-pointer" onClick={handleTap}>
                                <canvas ref={canvasRef} width="800" height="96" className="absolute inset-0 w-full h-full pointer-events-none opacity-70"></canvas>
                                <div className="absolute inset-y-0 left-0 bg-black/80 pointer-events-none border-r border-red-500/50" style={{ width: `${startPct}%` }}></div>
                                <div className="absolute inset-y-0 right-0 bg-black/80 pointer-events-none border-l border-red-500/50" style={{ width: `${100 - endPct}%` }}></div>
                                <div className="absolute inset-y-0 w-[2px] bg-white pointer-events-none z-20" style={{ left: `${playPct}%`, transform: 'translateX(-50%)' }}></div>
                            </div>
                            <div className="absolute inset-y-0 border-y border-white/20 pointer-events-none" style={{ left: `${startPct}%`, width: `${Math.max(0, endPct - startPct)}%` }}></div>
                            
                            <div className="absolute inset-y-0 w-6 flex justify-end cursor-ew-resize z-10" style={{ left: `${startPct}%`, transform: 'translateX(-100%)', touchAction: 'none' }} onPointerDown={handleDown('start')} onPointerMove={handleMove('start')} onPointerUp={handleUp} onPointerCancel={handleUp}>
                                <div className="w-1.5 h-full bg-zinc-400 hover:bg-white hover:scale-x-150 transition-all rounded-l"></div>
                            </div>
                            <div className="absolute inset-y-0 w-6 flex justify-start cursor-ew-resize z-10" style={{ left: `${endPct}%`, touchAction: 'none' }} onPointerDown={handleDown('end')} onPointerMove={handleMove('end')} onPointerUp={handleUp} onPointerCancel={handleUp}>
                                <div className="w-1.5 h-full bg-zinc-400 hover:bg-white hover:scale-x-150 transition-all rounded-r"></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function CutAudioCard({ duration, currentTime, trim, onTrim }) {
            const d = duration || 0;
            const len = trim.end - trim.start;
            const isCut = trim.start > 0.001 || trim.end < d - 0.001;

            return (
                <div className="glass-card rounded-2xl p-5 flex flex-col gap-4 shadow-xl">
                    <div className="flex items-center justify-between border-b border-white/10 pb-3">
                        <div className="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-3">
                            <div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i className="fa-solid fa-scissors text-zinc-300 text-sm"></i></div> Potong Audio
                        </div>
                        <span className="text-xs font-mono text-zinc-400 bg-black/40 px-2 py-1 rounded">Durasi: <span className="text-white">{formatPrecise(len)}</span></span>
                    </div>

                    <div className="grid grid-cols-3 gap-2 text-center h-full">
                        <button onClick={() => onTrim(Math.min(currentTime, trim.end - MIN_CUT), trim.end)} className="py-3 glass-btn rounded-xl text-xs font-bold uppercase tracking-widest text-zinc-300 hover:text-white hover:border-white/30 flex flex-col items-center justify-center transition-all font-mono shadow-sm">
                            Masuk <span className="text-[10px] opacity-70 mt-1">{formatPrecise(trim.start)}</span>
                        </button>
                        <button onClick={() => onTrim(trim.start, Math.max(currentTime, trim.start + MIN_CUT))} className="py-3 glass-btn rounded-xl text-xs font-bold uppercase tracking-widest text-zinc-300 hover:text-white hover:border-white/30 flex flex-col items-center justify-center transition-all font-mono shadow-sm">
                            Keluar <span className="text-[10px] opacity-70 mt-1">{formatPrecise(trim.end)}</span>
                        </button>
                        <button onClick={() => onTrim(0, d)} disabled={!isCut} className={`py-3 rounded-xl text-xs font-bold uppercase tracking-widest flex flex-col items-center justify-center transition-all font-mono shadow-sm ${isCut ? 'glass-btn border-red-500/30 text-red-400 hover:text-white hover:bg-red-500/50 hover:border-red-500' : 'opacity-30 text-zinc-500 border border-white/5 bg-transparent'}`}>
                            Reset <span className="text-[10px] opacity-70 mt-1">Full</span>
                        </button>
                    </div>
                </div>
            );
        }

        function FilterCard({ state, onIntensity }) {
            return (
                <div className="glass-card rounded-2xl p-5 flex flex-col gap-5 justify-center shadow-xl">
                    <div className="flex justify-between items-center border-b border-white/10 pb-3">
                        <div className="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-3">
                            <div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i className="fa-solid fa-microphone text-zinc-300 text-sm"></i></div> Filter 1
                        </div>
                        <span className="text-xs font-mono font-bold text-white bg-black/40 px-2 py-1 rounded">{Math.round(state.intensity * 100)}%</span>
                    </div>
                    <div className="flex items-center gap-4 glass-inner p-3 rounded-xl border border-white/5">
                        <i className="fa-solid fa-microphone-lines text-sm text-zinc-400"></i>
                        <input type="range" min="0" max="1" step="0.01" value={state.intensity} onChange={(e) => onIntensity(parseFloat(e.target.value))} className="w-full cursor-pointer" />
                    </div>
                </div>
            );
        }

        function RobotCard({ level, onLevel }) {
            return (
                <div className="glass-card rounded-2xl p-5 flex flex-col gap-5 justify-center shadow-xl">
                    <div className="flex justify-between items-center border-b border-white/10 pb-3">
                        <div className="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-3">
                            <div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i className="fa-solid fa-fire text-zinc-300 text-sm"></i></div> Filter 2
                        </div>
                        <span className="text-xs font-mono font-bold text-white bg-black/40 px-2 py-1 rounded">{Math.round(level * 100)}%</span>
                    </div>
                    <div className="flex items-center gap-4 glass-inner p-3 rounded-xl border border-white/5">
                        <i className="fa-solid fa-wave-square text-sm text-zinc-400"></i>
                        <input type="range" min="0" max="1" step="0.01" value={level} onChange={(e) => onLevel(parseFloat(e.target.value))} className="w-full cursor-pointer" />
                    </div>
                </div>
            );
        }

        function EchoCard({ level, onLevel }) {
            return (
                <div className="glass-card rounded-2xl p-5 flex flex-col gap-5 justify-center shadow-xl">
                    <div className="flex justify-between items-center border-b border-white/10 pb-3">
                        <div className="text-xs font-bold text-white uppercase tracking-widest flex items-center gap-3">
                            <div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><i className="fa-solid fa-volume-high text-zinc-300 text-sm"></i></div> Filter 3
                        </div>
                        <span className="text-xs font-mono font-bold text-white bg-black/40 px-2 py-1 rounded">{Math.round(level * 100)}%</span>
                    </div>
                    <div className="flex items-center gap-4 glass-inner p-3 rounded-xl border border-white/5">
                        <i className="fa-solid fa-podcast text-sm text-zinc-400"></i>
                        <input type="range" min="0" max="1" step="0.01" value={level} onChange={(e) => onLevel(parseFloat(e.target.value))} className="w-full cursor-pointer" />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
