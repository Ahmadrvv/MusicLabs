                try {
                    const res = await fetchWithTimeout('https://api.kie.ai/api/v1/chat/credit', { cache: 'no-store', headers: { 'Authorization': `Bearer ${key}`, 'Accept': 'application/json' } });
                    const data = await res.json().catch(() => ({}));
                    const code = Number(data.code != null ? data.code : res.status);
                    const credits = Number(data.data);
                    if (code === 401 || res.status === 401) setStatus('kie', { state: 'error', msg: 'API key tidak valid', credits: null });
                    else if (code === 402) setStatus('kie', { state: 'empty', msg: 'Kredit habis', credits: 0 });
                    else if (res.ok && code === 200 && isFinite(credits)) {
                        if (credits <= 0) setStatus('kie', { state: 'empty', msg: 'Kredit habis', credits });
                        else setStatus('kie', { state: 'ok', msg: 'Terhubung', credits });
                    }
                    else setStatus('kie', { state: 'error', msg: `Error ${code}: ${data.msg || 'server Kie bermasalah, coba cek ulang'}`, credits: null });
                } catch (e) {
                    setStatus('kie', { state: 'error', msg: e.name === 'AbortError' ? 'Timeout (15 dtk)' : 'Tidak bisa terhubung (cek internet)', credits: null });
                }
            };

            // Saldo Kie baru terpotong beberapa saat setelah tugas berjalan: cek ulang berkala
            const checkKieLater = () => { checkKie(); [4000, 15000, 45000, 90000].forEach(ms => setTimeout(checkKie, ms)); };
            const refreshAll = () => { checkKie(); };

            // Cek otomatis saat key berubah (ditunda 800ms agar tidak menembak tiap ketikan) & saat aplikasi dibuka
            useEffect(() => {
                const id = setTimeout(checkKie, 800);
                return () => clearTimeout(id);
            }, [apiKeys.kie]);

            const statusView = (id) => {
                const st = apiStatus[id];
                const dot = st.state === 'ok' ? 'bg-emerald-500' : st.state === 'checking' ? 'bg-amber-400 animate-pulse' : st.state === 'empty' ? 'bg-amber-500' : st.state === 'error' ? 'bg-red-500' : 'bg-slate-500';
                const textColor = st.state === 'ok' ? 'text-emerald-400' : st.state === 'error' ? 'text-red-400' : st.state === 'empty' ? 'text-amber-400' : 'text-dsp-muted';
                let short = st.msg || 'Belum diisi';
                let long = st.msg || 'Belum diisi';
                if (id === 'kie' && st.state === 'ok' && st.credits != null) {
                    short = `${fmtNum(st.credits)} kredit`;
                    long = `Terhubung · sisa ${fmtNum(st.credits)} kredit`;
                }
                return { dot, textColor, short, long };
            };
            const anyChecking = apiStatus.kie.state === 'checking';

            // Timer detik berjalan saat memproses, supaya jelas aplikasi masih bekerja
            useEffect(() => {
                if (!isProcessing) { setElapsed(0); return; }
                const t0 = Date.now();
                const id = setInterval(() => setElapsed(Math.floor((Date.now() - t0) / 1000)), 1000);
                return () => clearInterval(id);
            }, [isProcessing]);

            const cancelProcessing = () => {
                if (abortRef.current) { cancelledRef.current = true; abortRef.current.abort(); }
            };

            // Audio loop: sinkronkan waktu & status play dengan engine
            // (dulu isPlaying tidak kembali false saat lagu selesai & waktu tidak update setelah seek saat pause)
            useEffect(() => {
                let req;
                const update = () => {
                    const t = engine.getCurrentTime();
                    const playing = engine.isPlaying;
                    setCurrentTime(prev => prev === t ? prev : t);
                    setIsPlaying(prev => prev === playing ? prev : playing);
                    req = requestAnimationFrame(update);
                };
                req = requestAnimationFrame(update);
                return () => cancelAnimationFrame(req);
            }, []);

            const handleFileSelect = (e) => {
                const f = e.target.files && e.target.files[0];
                if (!f) return;
                e.target.value = ''; // agar file yang sama bisa dipilih ulang
                engine.stop();
                setIsPlaying(false); setCurrentTime(0);
                setCoverResults([]); setSunoErr(null); setUploadedUrl(''); setErrorDetail('');
                setLibMode(false); setLibId(''); dspBlobRef.current = null;
                // File baru: kosongkan lirik lama; lirik diisi manual di langkah Edit
                if (!audioFile || AudioEngine.fileKey(f) !== AudioEngine.fileKey(audioFile)) {
                    setLyricsText(''); setLyricsHistory([]); setLastAction('');
                }
                setAudioFile(f);
                goToDsp(f); // langsung ke DSP
            };

            // Muat audio untuk DSP dan TUNGGU sampai selesai (dulu tidak di-await -> tombol play diam saja)
            const prepareDSP = async (fileArg) => {
                const af = fileArg instanceof File ? fileArg : audioFile;
                if (!af) { showToast("File audio belum ada!", "error"); return false; }
                setIsProcessing(true);
                setProcessMsg('Memuat DSP...');
                try {
                    await engine.loadAudio(af, (pct, txt) => setProcessMsg(`Memuat DSP: ${txt} (${pct}%)`));
                    setTrimState({ start: engine.trimStart, end: engine.trimEnd });
                    setVocalState({ intensity: engine.tracks.vocal.intensity });
                    return true;
                } catch (err) {
                    console.error(err);
                    showToast("Gagal memuat audio: " + (err.message || "format tidak didukung"), "error");
                    return false;
                } finally {
                    setIsProcessing(false);
                }
            };

            const goToDsp = async (f) => { if (await prepareDSP(f)) { setUploadedUrl(''); setSunoErr(null); dspBlobRef.current = null; setAudioDuration(0); setLibMode(false); setLibId(''); setStep(2); } };

            const leaveDsp = (n) => {
                engine.stop(); setIsPlaying(false);
                setStep(n);
            };

            const goStep = (n) => {
                if (n === 2) return goToDsp();
                engine.stop(); setIsPlaying(false);
                setStep(n);
            };

            // Panggil Kie (GPT-6 Luna) dengan beberapa percobaan; kembalikan teks mentah balasan
            const callKie = async (prompt, opts = {}) => {
                const kieKey = cleanKey(apiKeys.kie);
                let rawContent = '', lastErr = null;
                const attemptLog = [];
                if (!opts.silent) setStreamPreview('');
                for (let i = 0; i < KIE_ATTEMPTS.length; i++) {
                    const { model, effort } = KIE_ATTEMPTS[i];
                    const ctrl = new AbortController();
                    if (!opts.silent) { abortRef.current = ctrl; cancelledRef.current = false; }
                    let timedOut = false;
                    const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, opts.timeout || KIE_TIMEOUT_MS);
                    try {
                        if (!opts.silent) setProcessMsg(`Menghubungi AI (${model}) - percobaan ${i + 1}/${KIE_ATTEMPTS.length}...`);
                        const res = await fetch(KIE_URL, {
                            method: 'POST',
                            signal: ctrl.signal,
                            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'Authorization': `Bearer ${kieKey}` },
                            body: JSON.stringify({ model, stream: false, reasoning: { effort }, input: [{ role: 'user', content: [{ type: 'input_text', text: prompt }] }] })
                        });
                        const txt = await res.text();
                        let data = {}; try { data = JSON.parse(txt); } catch (e) {}
                        // Kie bisa membalas HTTP 200 tapi isinya {code, msg} (error)
                        if (!res.ok || (data.code && Number(data.code) !== 200) || data.error) {
                            const err = new Error((data.error && data.error.message) || data.msg || data.message || txt.slice(0, 200) || `HTTP ${res.status}`);
                            err.status = res.ok ? Number(data.code) || 0 : res.status;
                            throw err;
                        }
                        rawContent = extractText(data);
                        if (!rawContent) throw new Error("Respons kosong dari AI");
                        lastErr = null;
                        break;
                    } catch (e) {
                        if (!opts.silent && cancelledRef.current) throw new Error("Dibatalkan");
                        const isTimeout = e.name === 'AbortError' || timedOut;
                        attemptLog.push(`#${i + 1} ${model} (${effort}): ${isTimeout ? 'timeout' : e.message}${e.status ? ` [${e.status}]` : ''}`);
                        lastErr = isTimeout ? new Error("Kie AI tidak merespons (timeout). Coba lagi beberapa saat lagi.") : e;
                        if ([401, 402, 403].includes(e.status)) break; // key/kredit bermasalah: percobaan ulang tidak membantu
                    } finally {
                        clearTimeout(timer);
                    }
                }
                if (!opts.silent) abortRef.current = null;
                if (lastErr) {
                    setErrorDetail(attemptLog.join('\n'));
                    throw lastErr;
                }
                return rawContent;
            };

            const optimizeStyle = async () => {
                if (optimizing) return;
                if (!cleanKey(apiKeys.kie)) return showToast("API Key Kie AI dibutuhkan!", "error");
                const cur = style.trim();
                if (!cur) return showToast("Isi style dulu.", "error");
                setOptimizing(true); setErrorDetail('');
                try {
                    // silent: tanpa overlay layar penuh; hasil langsung masuk ke kotak style
                    const raw = await callKie(buildStylePrompt(cur, { tags: vocalTags, lyrics: lyricsText }), { silent: true, timeout: 60000 });
                    const out = parseStyleResponse(raw);
                    if (!out) throw new Error("Hasil kosong, coba ulang");
                    setPrevStyle(cur); setStyle(out.slice(0, STYLE_MAX));
                } catch (err) {
                    console.error(err);
                    showToast(err.message || "Gagal mengoptimalkan style", "error");
                } finally {
                    setOptimizing(false);
                    setTimeout(checkKie, 3000); // satu kali cek saldo (dulu 5 kali)
                }
            };

            const styleBox = (
                <div className="bg-dsp-panel border border-dsp-border rounded-xl p-5 flex flex-col gap-3">
                    <div className="flex items-center justify-between">
                        <h3 className="font-semibold flex items-center gap-2"><i className="fa-solid fa-palette text-dsp-music"></i> Style Lagu</h3>
                        <span className="text-[10px] font-mono text-dsp-muted">{style.length}/1000</span>
                    </div>
                    <p className="text-xs text-dsp-muted leading-relaxed">Tulis lagu ini mau dibuat seperti apa (genre, suasana, instrumen, vokal). Bahasa Indonesia boleh, lalu tekan Optimalkan.</p>
                    <textarea value={style} onChange={e => setStyle(e.target.value)} readOnly={optimizing} rows={3} maxLength={1000} placeholder="mis. lagu anak ceria, akustik, vokal wanita, tempo sedang" className="w-full bg-dsp-bg border border-dsp-border rounded-lg p-3 text-sm text-dsp-text focus:border-dsp-music outline-none resize-y" />
                    <div className="flex items-center gap-3">
                        <button onClick={optimizeStyle} disabled={!style.trim() || optimizing} className="flex-1 bg-dsp-ai text-white py-2.5 rounded-lg text-sm font-semibold hover:opacity-90 disabled:opacity-40">{optimizing ? <><i className="fa-solid fa-circle-notch fa-spin mr-2"></i>Mengoptimalkan...</> : <><i className="fa-solid fa-wand-magic-sparkles mr-2"></i>Optimalkan Style</>}</button>
                        {prevStyle !== null && <button onClick={() => { setStyle(prevStyle); setPrevStyle(null); }} className="text-[11px] font-mono text-dsp-accent">Urungkan</button>}
                    </div>
                    <div className="border-t border-dsp-border/60 pt-3 flex flex-col gap-3">
                        <div className="text-[11px] font-mono text-dsp-muted">VOKAL (otomatis masuk ke depan style, tanpa AI)</div>
                        <div>
                            <div className="text-[11px] text-dsp-muted mb-1.5">Jenis suara. Pilih keduanya untuk duet.</div>
                            <div className="flex gap-2">{[{ id: 'f', l: 'Wanita' }, { id: 'm', l: 'Pria' }].map(o => <Chip key={o.id} on={vocal.genders.includes(o.id)} onClick={() => toggleGender(o.id)}>{o.l}</Chip>)}</div>
                        </div>
                        {vocal.genders.length > 0 && (<>
                            <div>
                                <div className="text-[11px] text-dsp-muted mb-1.5">Usia suara</div>
                                <div className="flex flex-wrap gap-2">{VOCAL_AGES.map(a => <Chip key={a.id} on={vocal.age === a.id} onClick={() => pickAge(a.id)}>{a.l}</Chip>)}</div>
                            </div>
                            {vocal.genders.length === 1 && vocal.age !== 'child' && (
                                <div>
                                    <div className="text-[11px] text-dsp-muted mb-1.5">Rentang suara</div>
                                    <div className="flex flex-wrap gap-2">{VOCAL_RANGES[vocal.genders[0]].map(r => <Chip key={r} on={vocal.range === r} onClick={() => pickRange(r)}>{r}</Chip>)}</div>
                                </div>
                            )}
                            <div>
                                <div className="text-[11px] text-dsp-muted mb-1.5">Karakter suara (maks 2; yang bertentangan dikunci)</div>
                                <div className="flex flex-wrap gap-2">{VOCAL_TRAITS.map(t => <Chip key={t.id} on={vocal.traits.includes(t.id)} disabled={traitBlocked(t.id, vocal)} onClick={() => toggleTrait(t.id)}>{t.l}</Chip>)}</div>
                            </div>
                        </>)}
                        <div className="rounded-lg bg-dsp-bg border border-dsp-border p-2.5 text-[11px] font-mono break-words select-text">
                            <div className="text-dsp-muted mb-1">Style akhir yang dikirim ({composeStyle(style, vocalTags).length}/{STYLE_MAX})</div>
                            {composeStyle(style, vocalTags) || '-'}
                        </div>
                    </div>
                </div>
            );

            const insertTag = (tag) => {
                const el = lyricsRef.current; const pos = el ? el.selectionStart : lyricsText.length;
                const before = lyricsText.slice(0, pos), after = lyricsText.slice(pos);
                const ins = `${before && !before.endsWith('\n') ? '\n' : ''}${tag}\n`;
                setLyricsHistory(h => [...h.slice(-19), lyricsText]);
                setLyricsText(before + ins + after);
                setTimeout(() => { if (el) { el.focus(); const c = (before + ins).length; el.setSelectionRange(c, c); } }, 0);
            };

            const undoLyrics = () => {
                if (lyricsHistory.length === 0) return;
                setLyricsText(lyricsHistory[lyricsHistory.length - 1]);
                setLyricsHistory(h => h.slice(0, -1));
                setLastAction('Dikembalikan ke versi sebelumnya');
            };

            const generateKieCover = async (config, mode = 'final') => {
                const kieKey = cleanKey(apiKeys.kie);
                if (!kieKey) return showToast("API Key Kie AI dibutuhkan!", "error");
                if (!audioFile) return showToast("File audio belum ada!", "error");
                if (mode === 'final' && !lyricsText.trim()) return showToast("Isi lirik dulu sebelum Generate!", "error");
                // Input sama persis (audio, lirik, style, vokal, model) dengan cover yang sudah ada: jangan boros kredit tanpa konfirmasi
                const sig = mode === 'final' ? genSig(config.style) : '';
                if (mode === 'final') {
                    const dup = lib.covers.find(c => c.sig === sig);
                    if (dup && !window.confirm('Audio, lirik, style, dan vokal ini sama persis dengan cover yang sudah ada di Library. Generate ulang tetap memakai kredit. Lanjutkan?')) { setLibTab('covers'); setView('library'); return; }
                }
                // Lirik ikut tersimpan ke entri Library saat Generate
                if (mode === 'final' && libId) setLib(l => ({ ...l, uploads: l.uploads.map(x => x.id === libId ? { ...x, lyrics: lyricsText } : x) }));

                const ctrl = new AbortController();
                abortRef.current = ctrl; cancelledRef.current = false;
                const chk = () => { if (cancelledRef.current) throw new Error("Dibatalkan"); };
                const auth = { 'Authorization': `Bearer ${kieKey}` };
                let taskId = '';
                setIsProcessing(true); setErrorDetail(''); setStreamPreview(''); setCoverResults([]); setSunoErr(null); setStage(mode === 'final' ? 1 : (uploadedUrl ? 5 : (dspBlobRef.current ? 4 : 2)));
                engine.stop(); setIsPlaying(false);

                try {
                    // 0. Format lirik (AI): hasil langsung dipakai untuk Suno, tidak ditampilkan
                    let lyricsOut = '';
                    if (mode === 'final') {
                        const srcLy = lyricsText.trim();
                        if (fmtCache.current.src === srcLy && fmtCache.current.out) lyricsOut = fmtCache.current.out; // lirik tidak berubah: pakai hasil format sebelumnya, tanpa panggilan AI
                        else {
                            setProcessMsg('AI memformat lirik untuk Suno (suku kata + label bagian)...');
                            const rawLy = await callKie(buildFormatPrompt(srcLy));
                            abortRef.current = ctrl; chk(); // callKie memakai controller sendiri; pulihkan agar tombol Batal tetap berfungsi
                            lyricsOut = parseLyricsResponse(rawLy);
                            if (lyricsOut) fmtCache.current = { src: srcLy, out: lyricsOut };
                        }
                        if (!lyricsOut) throw new Error('Hasil format lirik kosong, coba lagi.');
                        if (lyricsOut.length > LYRICS_MAX) throw new Error(`Lirik setelah diformat ${lyricsOut.length} karakter, melebihi batas ${LYRICS_MAX} karakter. Persingkat lirik lalu coba lagi.`);
                        setStage(uploadedUrl ? 5 : (dspBlobRef.current ? 4 : 2));
                    }
                    // 1. Siapkan MP3 hasil DSP: pakai yang sudah ada (render sebelumnya / dari Library) atau render baru
                    let dur = audioDuration;
                    let uploadUrl = uploadedUrl;
                    if (!uploadUrl) {
                        let mp3 = dspBlobRef.current;
                        if (!mp3) {
                            if (!engine.vocalBuffer || !engine.filterBuffer) {
                                setProcessMsg('Memuat DSP...');
                                await engine.loadAudio(audioFile, () => {});
                            }
                            if (engine.trimEnd - engine.trimStart > 480) throw new Error("Durasi audio lebih dari 8 menit (batas Suno Upload & Cover).");
                            setProcessMsg('Merender audio hasil DSP...');
                            await new Promise(r => setTimeout(r, 60));
                            const rendered = await renderDspBuffer(engine); chk();
                            setStage(3); setProcessMsg('Mengompres audio DSP ke MP3 (0%)...');
                            mp3 = await encodeMp3(rendered, 192, (p) => setProcessMsg(`Mengompres audio DSP ke MP3 (${p}%)...`)); chk();
                            dspBlobRef.current = mp3; dur = rendered.duration; setAudioDuration(dur);
                        }

                        // 2. Unggah ke Kie -> URL publik
                        setStage(4); setProcessMsg(`Mengunggah audio DSP (${(mp3.size / 1048576).toFixed(1)} MB) ke Kie AI...`);
                        uploadUrl = await kieUploadAudio(mp3, `dsp-${Date.now()}.mp3`, kieKey, ctrl.signal); chk();
                        setUploadedUrl(uploadUrl);
                    }

                    // 3. Kirim tugas Upload & Cover ke Suno via Kie
                    setStage(5); setProcessMsg(mode === 'check' ? 'Mengirim sampel 10 detik ke Suno untuk cek copyright...' : 'Mengirim tugas cover ke Suno (Kie AI)...');
                    const base = (audioFile.name || 'Cover').replace(/\.[^.]+$/, '');
                    const body = {
                        uploadUrl, instrumental: false, model: KIE_SUNO_MODEL,
                        callBackUrl: cleanKey(apiKeys.callback) || KIE_DEFAULT_CALLBACK,
                        title: `${base} (Cover)`.slice(0, 80),
                        ...(mode === 'check' ? { duration: 10 } : { lyrics: lyricsOut, ...(apiGender ? { vocalGender: apiGender } : {}) })
                    };
                    const style = composeStyle(config.style, vocalTags);
                    if (style) body.style = style;
                    const submit = async (b) => {
                        const res = await fetch(KIE_SUNO_URL, { method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'application/json', ...auth }, body: JSON.stringify(b) });
                        return { res, j: await res.json().catch(() => ({})) };
                    };
                    let { res, j } = await submit(body);
                    if (!(res.ok && Number(j.code) === 200 && j.data && j.data.taskId) && /customMode/i.test(j.msg || '')) ({ res, j } = await submit({ ...body, customMode: true }));
                    if (!(res.ok && Number(j.code) === 200 && j.data && j.data.taskId)) {
                        throw new Error(`Kie AI menolak tugas: ${j.msg || j.message || 'HTTP ' + res.status} (code ${j.code || res.status})`);
                    }
                    taskId = j.data.taskId;

                    // 4. Polling sampai Suno selesai
                    const t0 = Date.now(); let fails = 0, polls = 0, tracks = []; setStage(6);
                    const FAILED = ['CREATE_TASK_FAILED', 'GENERATE_AUDIO_FAILED', 'SENSITIVE_WORD_ERROR'];
                    while (true) {
                        chk();
                        if (Date.now() - t0 > 600000) throw new Error(`Suno terlalu lama (>10 menit). Task ID: ${taskId}`);
                        await new Promise(r => setTimeout(r, 5000)); chk();
                        let info;
                        try {
                            const r = await fetch(`${KIE_SUNO_INFO}?taskId=${encodeURIComponent(taskId)}`, { headers: auth, signal: ctrl.signal });
                            const d = await r.json().catch(() => ({}));
                            if (!r.ok || Number(d.code) !== 200) {
                                if ([401, 402, 403].includes(r.status) || [401, 402, 403].includes(Number(d.code))) throw Object.assign(new Error(d.msg || 'Akses ditolak'), { fatal: true });
                                throw new Error(d.msg || `HTTP ${r.status}`);
                            }
                            info = d.data || {}; fails = 0;
                        } catch (e) {
                            if (e.name === 'AbortError' || e.fatal || ++fails > 5) throw e;
                            continue; // gangguan jaringan sesaat (HP): coba lagi
                        }
                        const status = info.status || '';
                        const list = (info.response && (info.response.sunoData || info.response.data)) || [];
                        const labels = { PENDING: 'Menunggu antrean Suno', TEXT_SUCCESS: 'Suno menyusun lirik', FIRST_SUCCESS: 'Track pertama selesai, menunggu sisanya' };
                        setProcessMsg(`${labels[status] || 'Suno sedang membuat cover'}... (${status || 'PENDING'}) · cek ke-${++polls}${Date.now() - t0 > 150000 ? '\nAntrean Suno padat, ini normal. Tetap dipantau, boleh tekan Batal.' : ''}`);
                        if (mode === 'check' && ['TEXT_SUCCESS', 'FIRST_SUCCESS', 'SUCCESS'].includes(status)) break;
                        if (status === 'SUCCESS') { tracks = list; break; }
                        if (status === 'CALLBACK_EXCEPTION' && list.some(x => x.audio_url || x.source_audio_url)) { tracks = list; break; }
                        if (FAILED.includes(status) || status === 'CALLBACK_EXCEPTION') {
                            throw Object.assign(new Error(`Suno gagal: ${info.errorMessage || status}`), { raw: `status: ${status}\n${info.errorMessage || ''}` });
                        }
                    }

                    if (mode === 'check') {
                        // Simpan file hasil DSP (bukan file asli) ke Library
                        const blob = dspBlobRef.current;
                        const id = 'u' + Date.now();
                        let saved = false;
                        try { if (blob) { await idbPut(id, blob); saved = true; } } catch (e) {}
                        if (saved) {
                            const name = audioFile.name;
                            lib.uploads.filter(x => x.name === name).forEach(x => idbDel(x.id).catch(() => {}));
                            setLib(l => ({ ...l, uploads: [{ id, name, size: blob.size, duration: dur || engine.duration, lyrics: lyricsText, sig: audioSig(), date: Date.now() }, ...l.uploads.filter(x => x.name !== name)] }));
                            setLibId(id);
                            showToast("Lolos cek Suno. File DSP tersimpan di Library. Lanjut isi lirik & style.", "success");
                        } else {
                            showToast("Lolos cek Suno, tapi file gagal disimpan ke Library (penyimpanan perangkat).", "info");
                        }
                        setStep(4);
                        return;
                    }
                    // 5. Tampilkan hasil
                    const results = tracks.map((x, i) => ({
                        id: x.id || i, title: x.title || `Cover ${i + 1}`,
                        url: x.audio_url || x.source_audio_url || x.stream_audio_url || '',
                        image: x.image_url || x.source_image_url || '', duration: x.duration
                    })).filter(x => x.url);
                    if (!results.length) throw new Error(`Suno selesai tapi tidak ada audio. Task ID: ${taskId}`);
                    setCoverResults(results);
                    setLib(l => ({ ...l, covers: [...results.map(r => ({ ...r, id: 'c' + Date.now() + '-' + r.id, source: audioFile.name, style: config.style || '', sig, date: Date.now() })), ...l.covers] }));
                    setLibTab('covers'); setView('library');
                    showToast(`Cover selesai! ${results.length} versi dari Suno.`, "success");
                } catch (e) {
                    console.error(e);
                    if (cancelledRef.current || e.name === 'AbortError') showToast("Dibatalkan", "info");
                    else {
                        const cr = /copyright|existing work|matches|sensitive|lyric|hak cipta/i.test(`${e.message} ${e.raw || ''}`);
                        const chkMode = mode === 'check';
                        setSunoErr(cr ? {
                            kind: 'copyright', title: chkMode ? 'Lagu terdeteksi copyright' : 'Lirik/audio ditolak Suno (terindikasi copyright)',
                            msg: chkMode ? 'Suno menolak audio ini karena cocok dengan karya yang sudah ada. Silakan ganti dengan lagu lain (rekaman milik sendiri / bebas hak cipta) lalu upload ulang.' : 'Suno menolak lirik atau audio karena terindikasi hak cipta. Ubah/parafrase lirik lalu coba lagi.',
                            raw: e.raw || e.message, back: chkMode ? 1 : 4, backLabel: chkMode ? 'Ganti Lagu' : 'Edit Lirik'
                        } : { kind: 'error', title: 'Proses gagal', msg: e.message || 'Gagal generate cover', raw: e.detail || (taskId ? `Task ID: ${taskId}` : '') });
                        showToast(e.message || "Gagal generate cover", "error");
                    }
                } finally {
                    abortRef.current = null;
                    setStage(0);
                    setIsProcessing(false);
                    checkKieLater(); // kredit berubah setelah dipakai
                }
            };

            const sunoErrPanel = sunoErr && (
                <div className={`rounded-lg border p-3 text-xs ${sunoErr.kind === 'copyright' ? 'border-amber-500/40 bg-amber-500/10 text-amber-200' : 'border-red-500/30 bg-red-500/10 text-red-300'}`}>
                    <div className="font-semibold mb-1"><i className="fa-solid fa-triangle-exclamation mr-1"></i>{sunoErr.title}</div>
                    <div className="leading-relaxed">{sunoErr.msg}</div>
                    {sunoErr.raw && <pre className="mt-2 font-mono text-[10px] opacity-80 whitespace-pre-wrap break-words select-text">Pesan Suno/Kie: {sunoErr.raw}</pre>}
                    {sunoErr.back && <button onClick={() => { setSunoErr(null); setStep(sunoErr.back); }} className="mt-3 px-3 py-2 rounded-lg bg-white text-black font-semibold">{sunoErr.backLabel}</button>}
                </div>
            );

            const useLibUpload = async (it) => {
                let blob = null; try { blob = await idbGet(it.id); } catch (e) {}
                if (!blob) return showToast("File audio tidak tersimpan di perangkat ini", "error");
                engine.stop(); setIsPlaying(false); setCurrentTime(0);
                const f = new File([blob], `${String(it.name || 'Lagu').replace(/\.[^.]+$/, '')}.mp3`, { type: blob.type || 'audio/mpeg' });
                dspBlobRef.current = blob;           // sudah hasil DSP & lolos cek Suno: DSP dan Cek dilewati
                setAudioFile(f); setAudioDuration(it.duration || 0);
                setLyricsText(it.lyrics || ''); setLyricsHistory([]); setLastAction('');
                setCoverResults([]); setSunoErr(null); setErrorDetail(''); setUploadedUrl('');
                setLibMode(true); setLibId(it.id);
                setView('flow'); setStep(4);          // langsung ke kolom lirik
            };

            // Unduh langsung ke perangkat (tanpa membuka halaman web Kie). Atribut download pada <a> diabaikan browser untuk
            // alamat lintas-situs, jadi file diambil dulu sebagai blob lalu disimpan dengan nama lagunya.
            const [dlBusy, setDlBusy] = useState('');
            // Selalu disimpan bernama .mp3 dengan jenis file netral (octet-stream), supaya HP/browser tidak menimpa ekstensi jadi .mpga
            const downloadResult = async (it) => {
                if (dlBusy || !it.url) return;
                setDlBusy(it.id);
                const base = String(it.title || 'Lagu').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || 'Lagu';
                const saveRaw = (blob, ext) => {
                    const obj = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = obj; a.download = `${base}.${ext}`; a.style.display = 'none';
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(obj), 60000);
                    return `${base}.${ext}`;
                };
                const saveMp3 = (bytes) => saveRaw(new Blob([bytes], { type: 'application/octet-stream' }), 'mp3');
                try {
                    const res = await fetch(it.url);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const ab = await res.arrayBuffer();
                    if (!ab.byteLength) throw new Error('File kosong');
                    const kind = sniffAudio(new Uint8Array(ab, 0, Math.min(16, ab.byteLength)));
                    if (kind === 'mp3') {
                        showToast('Mengunduh: ' + saveMp3(ab), 'success');
                    } else {
                        // Bukan MP3 (WAV/M4A/dll): ubah ke MP3 di perangkat.
                        const label = kind === 'unknown' ? 'non-MP3' : kind.toUpperCase();
                        let mp3 = null;
                        try {
                            showToast('File berformat ' + label + ', mengonversi ke MP3...', 'info');
                            const AC = window.AudioContext || window.webkitAudioContext;
                            const ctx = new AC();
                            let abuf; try { abuf = await ctx.decodeAudioData(ab.slice(0)); } finally { try { ctx.close(); } catch (e) {} }
                            if (![44100, 48000, 32000].includes(abuf.sampleRate)) throw new Error('sample rate ' + abuf.sampleRate + ' tidak didukung encoder');
                            mp3 = await encodeMp3(abuf, 192, () => {});
                        } catch (ce) { console.error(ce); }
                        if (mp3) showToast('Mengunduh: ' + saveMp3(mp3) + ' (dikonversi dari ' + label + ')', 'success');
                        else if (kind === 'unknown') throw new Error('isi file bukan audio yang dikenali');   // jangan simpan file palsu berekstensi .mp3
                        else showToast('Tidak bisa dikonversi penuh, disimpan langsung sebagai MP3: ' + saveMp3(ab), 'info');
                    }
                } catch (e) {
                    console.error(e);
                    // Server menolak pengambilan langsung (CORS) / jaringan putus / file bukan audio:
                    // Secara eksplisit memaksa browser membuka dan menyimpan sebagai file mp3.
                    showToast('Unduh langsung diblokir server. Mengunduh lewat tab baru sebagai MP3...', 'info');
                    const a = document.createElement('a');
                    a.href = it.url;
                    a.download = `${base}.mp3`;
                    a.target = '_blank';
                    a.rel = 'noopener';
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } finally {
                    setDlBusy('');
                }
            };
            
            const delLib = (kind, it) => {
                if (!window.confirm('Hapus dari library?')) return;
                if (kind === 'uploads') idbDel(it.id).catch(() => {});
                setLib(l => ({ ...l, [kind]: l[kind].filter(x => x.id !== it.id) }));
            };

            const togglePlay = () => {
                if (engine.isPlaying) { engine.stop(); setIsPlaying(false); setCurrentTime(engine.getCurrentTime()); } 
                else {
                    const ok = engine.play(engine.getCurrentTime());
                    setIsPlaying(!!ok);
                    if (!ok) showToast("Audio belum siap, upload ulang lagunya lalu lanjut ke DSP.", "error");
                }
            };

            const handleSeek = (e) => {
                engine.seek(parseFloat(e.target.value));
                setCurrentTime(engine.getCurrentTime());
            };

            const handleRestart = () => {
                engine.seekTime(engine.trimStart);
                setCurrentTime(engine.getCurrentTime());
            };

            const setIntensity = (value) => {
                engine.setIntensity(value);
                setVocalState(prev => ({ ...prev, intensity: value }));
            };

            const handleTrim = (start, end) => {
                engine.setTrim(start, end);
                setTrimState({ start: engine.trimStart, end: engine.trimEnd });
            };

            const handleTimelineSeek = (time) => {
                engine.seekTime(time);
                setCurrentTime(engine.getCurrentTime());
            };

            return (
                <div className="flex flex-col h-full bg-dsp-bg relative">
                    {/* Header */}
                    <div className="pt-6 pb-4 px-6 flex justify-between items-center border-b border-dsp-border bg-dsp-bg/95 z-20 shrink-0">
                        <div className="flex items-center gap-3">
                            {appMode !== 'home' && <button onClick={goHome} title="Kembali ke menu awal" className="w-10 h-10 rounded-lg border border-dsp-border flex items-center justify-center hover:bg-dsp-panel transition-colors text-dsp-muted hover:text-white"><i className="fa-solid fa-house"></i></button>}
                            <div>
                                <h1 className="text-xl font-bold tracking-wide text-white">Kie <span className="text-dsp-accent">Cover Studio</span></h1>
                                <p className="text-[10px] text-dsp-muted uppercase tracking-widest font-mono mt-1">{appMode === 'song' ? 'Buat Lagu Baru' : appMode === 'cover' ? 'Cover Lagu' : 'AI Powered Remaker'}</p>
                            </div>
                        </div>
                        <button onClick={() => setView('library')} className="absolute z-30 top-6 right-[4.75rem] w-10 h-10 rounded-lg border border-dsp-border flex items-center justify-center hover:bg-dsp-panel transition-colors text-dsp-muted hover:text-white"><i className="fa-solid fa-compact-disc"></i></button>
                        <button onClick={() => setShowSettings(true)} className="w-10 h-10 rounded-lg border border-dsp-border flex items-center justify-center hover:bg-dsp-panel transition-colors text-dsp-muted hover:text-white">
                            <i className="fa-solid fa-gear"></i>
                        </button>
                    </div>

                    {/* Status API & Kredit */}
                    <div className="flex items-center gap-2 px-6 py-2 shrink-0 border-b border-dsp-border bg-dsp-bg overflow-x-auto hide-scroll">
                        {[{ id: 'kie', label: 'Kie AI' }].map(it => {
                            const v = statusView(it.id);
                            return (
                                <button key={it.id} onClick={() => setShowSettings(true)} className="flex items-center gap-2 px-3 py-1.5 rounded-full border border-dsp-border bg-dsp-panel text-[11px] font-mono whitespace-nowrap hover:bg-dsp-panelHover transition-colors">
                                    <span className={`w-2 h-2 rounded-full ${v.dot}`}></span>
                                    <span className="text-dsp-text font-semibold">{it.label}</span>
                                    <span className={v.textColor}>{v.short}</span>
                                </button>
                            );
                        })}
                        <button onClick={refreshAll} title="Cek ulang koneksi & kredit" className="ml-auto shrink-0 w-8 h-8 rounded-lg border border-dsp-border flex items-center justify-center text-dsp-muted hover:text-white hover:bg-dsp-panel transition-colors">
                            <i className={`fa-solid fa-rotate-right text-xs ${anyChecking ? 'fa-spin' : ''}`}></i>
                        </button>
                    </div>

                    {/* Stepper Header (hanya mode Cover) */}
                    <div className={`${appMode === 'cover' ? 'flex' : 'hidden'} px-6 py-4 gap-2 shrink-0 bg-dsp-panel/50 border-b border-dsp-border overflow-x-auto hide-scroll`}>
                        {[[1, 'Upload'], [2, 'DSP'], [4, 'Edit'], [5, 'Generate']].map(([num, lbl], i) => {
                            const isActive = step === num;
                            const isDone = step > num;
                            const clickable = isDone && !(libMode && (num === 2 || num === 3)); // dari Library: DSP & Cek dilewati
                            return (
                                <div key={num} onClick={() => clickable ? goStep(num) : null} className={`flex items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap transition-colors ${isActive ? 'bg-dsp-accent text-white shadow-[0_0_10px_rgba(59,130,246,0.3)]' : isDone ? (clickable ? 'bg-dsp-border text-white cursor-pointer hover:bg-dsp-border/80' : 'bg-dsp-border text-white opacity-60') : 'text-dsp-muted'}`}>
                                    {isDone ? <i className="fa-solid fa-check"></i> : <span>{i + 1}</span>}
                                    {lbl}
                                </div>
                            );
                        })}
                    </div>

                    {/* Menu awal: pilih Cover Lagu atau Buat Lagu Baru */}
                    {appMode === 'home' && (
                        <div className="flex-1 overflow-y-auto min-h-0">
                            <div className="p-6 flex flex-col gap-4 animate-fade-in">
                                <p className="text-sm text-dsp-muted">Mau buat apa hari ini?</p>
                                <button onClick={() => setAppMode('cover')} className="text-left bg-dsp-panel border border-dsp-border rounded-2xl p-5 flex items-start gap-4 hover:border-dsp-accent transition-colors">
                                    <div className="w-12 h-12 shrink-0 rounded-full bg-dsp-accent/10 flex items-center justify-center text-dsp-accent text-xl"><i className="fa-solid fa-cloud-arrow-up"></i></div>
                                    <div>
                                        <div className="font-semibold text-base text-white">Cover Lagu</div>
                                        <p className="text-xs text-dsp-muted leading-relaxed mt-1">Upload lagu, atur DSP, lalu buat cover dengan lirik dan style baru.</p>
                                    </div>
                                </button>
                                <button onClick={() => setAppMode('song')} className="text-left bg-dsp-panel border border-dsp-border rounded-2xl p-5 flex items-start gap-4 hover:border-dsp-music transition-colors">
                                    <div className="w-12 h-12 shrink-0 rounded-full bg-dsp-music/10 flex items-center justify-center text-dsp-music text-xl"><i className="fa-solid fa-music"></i></div>
                                    <div>
                                        <div className="font-semibold text-base text-white">Buat Lagu Baru</div>
                                        <p className="text-xs text-dsp-muted leading-relaxed mt-1">Buat lagu dari nol lewat style dan lirik, dengan pilihan Vocal atau Instrumental. Tanpa upload.</p>
                                    </div>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Buat Lagu Baru (state terpisah dari Cover; tetap terpasang agar isian tidak hilang saat pindah menu) */}
                    <div className={appMode === 'song' ? 'flex-1 relative min-h-0' : 'hidden'}>
                        <NewSong apiKeys={apiKeys} lib={lib} setLib={setLib} refreshCredits={checkKie} refreshCreditsLater={checkKieLater}
                            onSongDone={(k) => { setLibTab('covers'); setLibFilter(k === 'instrumental' ? 'instrumental' : 'song'); setView('library'); }} />
                    </div>

                    {/* Main Content Area (mode Cover) */}
                    <div className={appMode === 'cover' ? 'flex-1 overflow-y-auto relative min-h-0' : 'hidden'}>
                        
                        {isProcessing && (
                            <div className="absolute inset-0 bg-dsp-bg/90 backdrop-blur-sm z-40 flex flex-col items-center justify-center animate-fade-in px-6 text-center">
                                <i className="fa-solid fa-circle-notch fa-spin text-4xl text-dsp-accent mb-4"></i>
                                <p className="font-mono text-sm text-dsp-text break-words max-w-full">{processMsg}</p>
                                <p className="font-mono text-xs text-dsp-muted mt-2">Berjalan {elapsed} dtk</p>
                                {stage > 0 && (<ol className="mt-4 text-left text-[11px] font-mono space-y-1">{SUNO_STAGES.map((l, i) => (<li key={i} className={i + 1 < stage ? 'text-dsp-music' : i + 1 === stage ? 'text-white' : 'text-dsp-muted/50'}><i className={`fa-solid ${i + 1 < stage ? 'fa-check' : i + 1 === stage ? 'fa-circle-notch fa-spin' : 'fa-circle'} w-4 mr-1`}></i>{l}</li>))}</ol>)}
                                {streamPreview && (
                                    <pre className="mt-4 w-full max-w-sm max-h-40 overflow-y-auto text-left text-[11px] leading-relaxed font-mono text-dsp-muted bg-dsp-panel border border-dsp-border rounded-lg p-3 whitespace-pre-wrap break-words">{streamPreview.replace(/\\n/g, '\n').slice(-500)}</pre>
                                )}
                                {!processMsg.startsWith('Memuat DSP') && (
                                    <button onClick={cancelProcessing} className="mt-6 px-5 py-2.5 rounded-lg border border-dsp-border text-sm font-medium text-dsp-text hover:bg-dsp-panelHover transition-colors">Batal</button>
                                )}
                            </div>
                        )}

                        <div className="p-6">
                            {/* Step 1: Upload */}
                            {step === 1 && (
                                <div className="flex flex-col items-center justify-center py-10 animate-fade-in">
                                    <label className="w-full aspect-video max-h-[300px] border-2 border-dashed border-dsp-border bg-dsp-panel rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:border-dsp-accent transition-colors">
                                        <div className="w-16 h-16 rounded-full bg-dsp-accent/10 flex items-center justify-center mb-4 text-dsp-accent text-2xl">
                                            <i className="fa-solid fa-cloud-arrow-up"></i>
                                        </div>
                                        <h2 className="text-base font-semibold mb-1 text-dsp-text">Pilih File Audio</h2>
                                        <p className="text-xs text-dsp-muted text-center px-8 mb-4">MP3, WAV maks durasi disarankan 8 menit.</p>
                                        {audioFile && <div className="px-4 py-2 bg-dsp-border rounded-lg text-xs font-mono text-dsp-accent"><i className="fa-solid fa-file-audio mr-2"></i>{audioFile.name}</div>}
                                        <input type="file" className="hidden" accept="audio/*" onChange={handleFileSelect} />
                                    </label>
                                </div>
                            )}

                            {/* Step 4: Edit (lirik & style) */}
                            {step === 4 && (
                                <div className="flex flex-col gap-4 animate-fade-in">
                                    {styleBox}
                                    <div className="bg-dsp-panel border border-dsp-border rounded-xl p-5 flex flex-col gap-4">
                                        <div className="flex justify-between items-start gap-3">
                                            <h3 className="font-semibold flex items-center gap-2"><i className="fa-solid fa-pen-nib text-dsp-ai"></i> Lirik & Parafrase</h3>
                                            
                                        </div>
                                        <p className="text-xs text-dsp-muted leading-relaxed">Tempel atau ketik lirik di kolom bawah, boleh diedit bebas. Saat Generate, lirik otomatis diformat AI (suku kata dipisah, label bagian ditambah) dan langsung dikirim ke Suno tanpa ditampilkan lagi.</p>

                                        {errorDetail && (
                                            <div className="p-3 rounded-lg border border-red-700 bg-red-900/30 text-[11px] font-mono text-red-200">
                                                <div className="flex justify-between items-center mb-1.5">
                                                    <span className="font-semibold">Detail error terakhir</span>
                                                    <button onClick={() => { try { navigator.clipboard.writeText(errorDetail); showToast('Detail error disalin', 'success'); } catch (e) {} }} className="underline">Salin</button>
                                                </div>
                                                <pre className="whitespace-pre-wrap break-words select-text">{errorDetail}</pre>
                                            </div>
                                        )}

                                        <div className="flex gap-1.5 overflow-x-auto hide-scroll">{['[Intro]', '[Verse 1]', '[Pre-Chorus]', '[Chorus]', '[Verse 2]', '[Bridge]', '[Outro]'].map(t => (<button key={t} onClick={() => insertTag(t)} className="shrink-0 px-2.5 py-1.5 rounded-md border border-dsp-border text-[11px] font-mono text-dsp-muted hover:text-white">{t}</button>))}</div>
                                        <textarea ref={lyricsRef}
                                            value={lyricsText}
                                            onChange={e => setLyricsText(e.target.value)}
                                            spellCheck={false}
                                            placeholder="Tempel atau ketik lirik di sini. Beri label seperti [Verse 1] dan [Chorus] agar hasil Suno lebih rapi."
                                            className="w-full bg-dsp-bg rounded-lg border border-dsp-border p-4 text-sm leading-relaxed text-dsp-text focus:outline-none focus:border-dsp-ai font-mono whitespace-pre-wrap resize-y min-h-[280px]"
